<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" role="img" aria-labelledby="t2 d2">
  <title id="t2">一度に渡す場合と、少しずつ届ける場合</title>
  <desc id="d2">上段はふつうの生命保険で、親が亡くなった時に保険金が一度にお子さんの口座へ入り、大きなタンクがいきなり満水になる。下段は生命保険信託で、信託銀行のタンクから蛇口を通して毎月少しずつお子さんのコップに注がれる。急な出費のときは、指図権者が「入院費を出して」と領収書を添えて信託銀行に頼み、蛇口を多めに開けてもらう。</desc>
  <defs>
    <style>
      .t { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; fill: #2a2620; }
      .s { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; fill: #6b5f52; }
    </style>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b4a2f"/>
    </marker>
  </defs>
  <rect width="640" height="450" rx="16" fill="#faf6ef"/>

  <!-- 上段 -->
  <text x="24" y="38" class="t" font-size="17">ふつうの生命保険 ― 一度にドン</text>
  <line x1="24" y1="46" x2="616" y2="46" stroke="#6b4a2f" stroke-width="1" stroke-dasharray="3 4"/>
  <g transform="translate(50 66)">
    <path d="M20 20 q30 -30 60 0 v70 q-30 14 -60 0 z" fill="#c9a44a" stroke="#8a6a1f" stroke-width="2"/>
    <text x="50" y="68" text-anchor="middle" class="t" font-size="16" fill="#3a2d10">保険金</text>
  </g>
  <line x1="140" y1="116" x2="220" y2="116" stroke="#6b4a2f" stroke-width="2.5" marker-end="url(#ar2)"/>
  <text x="180" y="107" text-anchor="middle" class="s" font-size="11">全額</text>
  <g transform="translate(230 60)">
    <rect x="0" y="0" width="110" height="112" rx="10" fill="#dbe7f3" stroke="#3a6ea5" stroke-width="2.5"/>
    <rect x="4" y="6" width="102" height="102" rx="8" fill="#9dbbdc"/>
    <text x="55" y="62" text-anchor="middle" class="t" font-size="14">お子さんの口座</text>
  </g>
  <text x="365" y="96" class="s" font-size="13">いきなり満水。</text>
  <text x="365" y="116" class="s" font-size="13">管理が難しい人には重すぎる。</text>
  <text x="365" y="136" class="s" font-size="13">悪意のある人に目をつけられやすい。</text>

  <!-- 下段 -->
  <text x="24" y="214" class="t" font-size="17">生命保険信託 ― 蛇口から少しずつ</text>
  <line x1="24" y1="222" x2="616" y2="222" stroke="#6b4a2f" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- タンク（左） -->
  <g transform="translate(40 250)">
    <rect x="0" y="0" width="130" height="112" rx="10" fill="#fff4e0" stroke="#b85f3d" stroke-width="2.5"/>
    <rect x="4" y="30" width="122" height="78" rx="8" fill="#f4c88a"/>
    <text x="65" y="22" text-anchor="middle" class="t" font-size="13">信託銀行のタンク</text>
    <!-- 蛇口（右下） -->
    <rect x="128" y="78" width="28" height="10" fill="#6b4a2f"/>
    <rect x="150" y="68" width="8" height="30" rx="2" fill="#6b4a2f"/>
    <circle cx="140" cy="68" r="6" fill="#6b4a2f"/>
  </g>
  <!-- 滴とコップ -->
  <g fill="#3a6ea5">
    <path d="M194 354 q4 8 0 10 q-4 -2 0 -10z"/>
    <path d="M194 370 q4 8 0 10 q-4 -2 0 -10z"/>
  </g>
  <g transform="translate(176 386)">
    <path d="M0 0 h36 l-4 28 h-28 z" fill="#ffffff" stroke="#3a6ea5" stroke-width="2"/>
    <rect x="4" y="12" width="28" height="14" fill="#9dbbdc"/>
  </g>
  <text x="194" y="432" text-anchor="middle" class="s" font-size="11">毎月のぶん</text>

  <!-- 指図権者（中央、タンクの右上） -->
  <g transform="translate(262 236)">
    <rect x="0" y="0" width="128" height="26" rx="8" fill="#ffffff" stroke="#6b4a2f" stroke-width="1.5"/>
    <path d="M24 26 l6 8 l6 -8" fill="#ffffff" stroke="#6b4a2f" stroke-width="1.5"/>
    <text x="64" y="18" text-anchor="middle" class="t" font-size="12">「入院費を出して」</text>
  </g>
  <g transform="translate(262 276)">
    <circle cx="30" cy="12" r="12" fill="#ffffff" stroke="#6b4a2f" stroke-width="2"/>
    <path d="M16 28 q14 -10 28 0 v22 h-28 z" fill="#ffffff" stroke="#6b4a2f" stroke-width="2"/>
    <text x="30" y="68" text-anchor="middle" class="s" font-size="11">指図権者</text>
    <text x="30" y="83" text-anchor="middle" class="s" font-size="10">（領収書を添えて）</text>
  </g>
  <!-- 矢印：指図権者→蛇口のハンドル（左へ） -->
  <line x1="272" y1="302" x2="206" y2="318" stroke="#6b4a2f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar2)"/>

  <!-- 説明（右） -->
  <g transform="translate(410 256)">
    <text x="0" y="0" class="t" font-size="14">定例交付</text>
    <text x="0" y="20" class="s" font-size="12">「毎月◯万円」「年に1回◯万円」</text>
    <text x="0" y="38" class="s" font-size="12">と、親が生前に決めた量だけ出る。</text>
    <text x="0" y="76" class="t" font-size="14">随時交付</text>
    <text x="0" y="96" class="s" font-size="12">入院・引っ越し・冠婚葬祭。</text>
    <text x="0" y="114" class="s" font-size="12">本人か指図権者が領収書を</text>
    <text x="0" y="132" class="s" font-size="12">添えて頼むと、多めに出る。</text>
  </g>
</svg>
