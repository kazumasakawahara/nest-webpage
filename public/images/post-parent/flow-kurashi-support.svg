<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="800" height="600" fill="#faf6ef"/>
<text x="400" y="46" text-anchor="middle" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="26" fill="#2d5a27">聞く → 渡す → 引き出す</text>
<text x="400" y="72" text-anchor="middle" font-size="14" fill="#6b665e">一人の記録が、途切れずに次へつながるまで</text>
<line x1="48" y1="88" x2="752" y2="88" stroke="#e6e0d4" stroke-width="1"/>
<g opacity="0.7">
<rect x="48" y="104" width="704" height="124" rx="14" fill="#faf6ef" stroke="#e6e0d4" stroke-width="1"/>
<g transform="translate(116,166) scale(0.86)" stroke="#9a948a"
      stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-26" y="-26" width="36" height="48" rx="4" fill="#faf6ef" transform="rotate(-10)"/>
      <rect x="-20" y="-25" width="36" height="48" rx="4" fill="#faf6ef" transform="rotate(5)"/>
      <rect x="-17" y="-24" width="36" height="48" rx="4" fill="#faf6ef"/>
      <line x1="-9" y1="-12" x2="11" y2="-12"/>
      <line x1="-9" y1="-2" x2="11" y2="-2"/>
      <line x1="-9" y1="8" x2="3" y2="8"/>
    </g>
<text x="180" y="154" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="28" fill="#9a948a">①</text>
<text x="220" y="154" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="23" fill="#9a948a">聞く</text>
<text x="180" y="182" font-size="14" fill="#9a948a">ふだんどおりに聞き取る</text>
<text x="404" y="142" font-size="13.5" fill="#9a948a">・フェイスシート・面談メモ・会議録</text>
<text x="404" y="169" font-size="13.5" fill="#9a948a">・聞き方を変える必要はありません</text>
<text x="404" y="196" font-size="13.5" fill="#9a948a">・清書せず、そのまま受付箱へ</text>
</g>
<path d="M116 231 L116 243" stroke="#e6e0d4" stroke-width="2" stroke-linecap="round"/>
<path d="M110 238 L116 245 L122 238" fill="none" stroke="#e6e0d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g opacity="0.7">
<rect x="48" y="246" width="704" height="124" rx="14" fill="#faf6ef" stroke="#e6e0d4" stroke-width="1"/>
<g transform="translate(116,312) scale(1.06)" stroke="#9a948a"
      stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-15" y="-40" width="30" height="26" rx="3" fill="#faf6ef"/>
      <line x1="-8" y1="-32" x2="8" y2="-32"/>
      <line x1="-8" y1="-24" x2="4" y2="-24"/>
      <path d="M0,-14 L-6,-21 M0,-14 L6,-21" stroke-width="2.4"/>
      <path d="M-36,-8 L36,-8 L27,28 L-27,28 Z" fill="#faf6ef"/>
      <path d="M-36,-8 L-28,0 L28,0 L36,-8" fill="none"/>
      <rect x="-38" y="-13" width="76" height="9" rx="4" fill="#faf6ef"/>
    </g>
<text x="180" y="296" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="28" fill="#9a948a">②</text>
<text x="220" y="296" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="23" fill="#9a948a">渡す</text>
<text x="180" y="324" font-size="14" fill="#9a948a">受付箱に置くだけ</text>
<text x="404" y="284" font-size="13.5" fill="#9a948a">・デスクトップの箱に入れる</text>
<text x="404" y="311" font-size="13.5" fill="#9a948a">・原本は書き換えできない棚へ移る</text>
<text x="404" y="338" font-size="13.5" fill="#9a948a">・置き間違いは記録前なら取り消せる</text>
</g>
<path d="M116 373 L116 385" stroke="#e6e0d4" stroke-width="2" stroke-linecap="round"/>
<path d="M110 380 L116 387 L122 380" fill="none" stroke="#e6e0d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g opacity="1">
<rect x="48" y="388" width="704" height="124" rx="14" fill="#ffffff" stroke="#4a8c3f" stroke-width="2.5"/>
<g transform="translate(116,450) scale(0.86)" stroke="#2d5a27"
      stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-34" y="-22" width="28" height="42" rx="3" fill="#ffffff"/>
      <line x1="-27" y1="-12" x2="-13" y2="-12"/>
      <line x1="-27" y1="-3" x2="-13" y2="-3"/>
      <line x1="-27" y1="6" x2="-19" y2="6"/>
      <ellipse cx="17" cy="-18" rx="16" ry="6" fill="#ffffff"/>
      <path d="M1,-18 L1,13 A16,6 0 0 0 33,13 L33,-18" fill="#ffffff"/>
      <path d="M1,-4 A16,6 0 0 0 33,-4" fill="none"/>
    </g>
<text x="180" y="438" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="28" fill="#2d5a27">③</text>
<text x="220" y="438" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="23" fill="#2d5a27">引き出す</text>
<text x="180" y="466" font-size="14" fill="#2a2620">必要なときに、必要な人へ</text>
<text x="404" y="426" font-size="13.5" fill="#6b665e">・経緯は手元の記録（Obsidian）へ</text>
<text x="404" y="453" font-size="13.5" fill="#6b665e">・確実に拾う事実はデータベースへ</text>
<text x="404" y="480" font-size="13.5" fill="#6b665e">・緊急時は「してはいけないこと」を先に</text>
<rect x="654" y="375" width="82" height="26" rx="13" fill="#d97757"/>
<text x="695" y="393" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">いまここ</text>
</g>
<rect x="48" y="530" width="704" height="42" rx="10" fill="#e8efe6"/>
<text x="400" y="557" text-anchor="middle" font-size="13.5" fill="#2d5a27">実名が入るデータベースへの登録は、必ず人の確認を経てから行います</text>
<text x="400" y="590" text-anchor="middle" font-size="11.5" fill="#9a948a">親なき後の支援 ／ 特定非営利活動法人 nest</text>
</svg>