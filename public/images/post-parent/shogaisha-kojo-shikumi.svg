<svg width="1000" height="622" viewBox="0 0 1000 622" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kojoFigTitle kojoFigDesc">
  <title id="kojoFigTitle">障害者控除の仕組み</title>
  <desc id="kojoFigDesc">総所得額から、諸々の所得控除と障害者控除が差し引かれ、残った課税対象所得に税率がかかることを示す図。控除額は所得税が一般27万円・特別40万円・同居特別75万円、住民税が26万円・30万円・53万円。</desc>
  <defs>
    <linearGradient id="gOther" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e3cd"/><stop offset="1" stop-color="#eecfae"/>
    </linearGradient>
    <linearGradient id="gDis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ee9350"/><stop offset="1" stop-color="#dd7429"/>
    </linearGradient>
    <linearGradient id="gTax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31789f"/><stop offset="1" stop-color="#1f5a80"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="622" fill="#ffffff"/>

  <text x="40" y="40" font-size="25" font-weight="bold" fill="#0f3d5c">障害者控除の仕組み　―　税率をかける前の所得から差し引きます</text>
  <line x1="40" y1="56" x2="960" y2="56" stroke="#0f3d5c" stroke-width="2.5"/>

  <text x="500" y="92" font-size="17" font-weight="bold" fill="#0f3d5c" text-anchor="middle">総 所 得 額</text>
  <path d="M40 116 L40 106 L960 106 L960 116" stroke="#8a99a5" stroke-width="1.5" fill="none"/>

  <rect x="40"  y="124" width="440" height="78" fill="url(#gOther)" stroke="#d0a877"/>
  <rect x="480" y="124" width="160" height="78" fill="url(#gDis)" stroke="#b85f1c"/>
  <rect x="640" y="124" width="320" height="78" fill="url(#gTax)" stroke="#164a6d"/>
  <text x="260" y="158" font-size="18" font-weight="bold" fill="#6b4526" text-anchor="middle">諸々の所得控除</text>
  <text x="260" y="180" font-size="12.5" fill="#8a6642" text-anchor="middle">（基礎控除・社会保険料控除・扶養控除など）</text>
  <text x="560" y="158" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">障害者控除</text>
  <text x="560" y="180" font-size="12.5" fill="#fbe6d4" text-anchor="middle">ここが上乗せされる</text>
  <text x="800" y="158" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">課税対象所得</text>
  <text x="800" y="180" font-size="12.5" fill="#d7e6f1" text-anchor="middle">税率がかかるのはここだけ</text>

  <path d="M40 210 L40 220 L640 220 L640 210" stroke="#c08a52" stroke-width="1.8" fill="none"/>
  <text x="340" y="242" font-size="16" font-weight="bold" fill="#8a5a2b" text-anchor="middle">所得から差し引かれる部分（税金がかかりません）</text>

  <line x1="800" y1="202" x2="800" y2="242" stroke="#1d5273" stroke-width="2.2"/>
  <path d="M793 242 L807 242 L800 254 Z" fill="#1d5273"/>

  <rect x="40" y="264" width="920" height="74" rx="4" fill="#f2f7fa" stroke="#2b6d97" stroke-width="1.6"/>
  <text x="500" y="300" font-size="21" font-weight="bold" fill="#0f3d5c" text-anchor="middle">課税対象所得　×　所定の税率　＝　納める税額</text>
  <text x="500" y="324" font-size="14" fill="#5a6b76" text-anchor="middle">軽くなる税金は「障害者控除額 × 税率」です。控除額がそのまま戻ってくるわけではありません。</text>

  <rect x="40" y="348" width="920" height="46" rx="4" fill="#fdf2e9" stroke="#e0a97b" stroke-width="1.4"/>
  <text x="60" y="377" font-size="14.5" fill="#8a3d13">※ 障害のある方は合計所得135万円以下なら住民税がかかりません（非課税限度額）。この場合の税額は0円です。</text>

  <text x="40" y="432" font-size="17" font-weight="bold" fill="#0f3d5c">◆ 差し引かれる「障害者控除額」は、税の種類と障害の区分によって異なります</text>

  <g stroke="#a8bcc9" stroke-width="1.2">
    <rect x="40"  y="446" width="170" height="38" fill="#dde7ee"/>
    <rect x="210" y="446" width="250" height="38" fill="#dde7ee"/>
    <rect x="460" y="446" width="250" height="38" fill="#dde7ee"/>
    <rect x="710" y="446" width="250" height="38" fill="#dde7ee"/>
    <rect x="40"  y="484" width="170" height="38" fill="#f7fafc"/>
    <rect x="210" y="484" width="250" height="38" fill="#ffffff"/>
    <rect x="460" y="484" width="250" height="38" fill="#ffffff"/>
    <rect x="710" y="484" width="250" height="38" fill="#ffffff"/>
    <rect x="40"  y="522" width="170" height="38" fill="#f7fafc"/>
    <rect x="210" y="522" width="250" height="38" fill="#ffffff"/>
    <rect x="460" y="522" width="250" height="38" fill="#ffffff"/>
    <rect x="710" y="522" width="250" height="38" fill="#ffffff"/>
  </g>
  <text x="125" y="471" font-size="15" font-weight="bold" fill="#33454f" text-anchor="middle">税の種類</text>
  <text x="335" y="471" font-size="15" font-weight="bold" fill="#33454f" text-anchor="middle">一般障害者</text>
  <text x="585" y="471" font-size="15" font-weight="bold" fill="#33454f" text-anchor="middle">特別障害者</text>
  <text x="835" y="471" font-size="15" font-weight="bold" fill="#33454f" text-anchor="middle">同居特別障害者</text>
  <text x="125" y="510" font-size="16" font-weight="bold" fill="#0f3d5c" text-anchor="middle">所得税</text>
  <text x="335" y="510" font-size="19" font-weight="bold" fill="#b3401f" text-anchor="middle">27万円</text>
  <text x="585" y="510" font-size="19" font-weight="bold" fill="#b3401f" text-anchor="middle">40万円</text>
  <text x="835" y="510" font-size="19" font-weight="bold" fill="#b3401f" text-anchor="middle">75万円</text>
  <text x="125" y="548" font-size="16" font-weight="bold" fill="#0f3d5c" text-anchor="middle">住民税</text>
  <text x="335" y="548" font-size="19" font-weight="bold" fill="#b3401f" text-anchor="middle">26万円</text>
  <text x="585" y="548" font-size="19" font-weight="bold" fill="#b3401f" text-anchor="middle">30万円</text>
  <text x="835" y="548" font-size="19" font-weight="bold" fill="#b3401f" text-anchor="middle">53万円</text>

  <text x="40" y="586" font-size="13.5" fill="#5a6b76">※ 税率は、所得税が所得に応じて5〜45%、住民税（県民税・市町村民税）が一律10%です。</text>
  <text x="40" y="608" font-size="13.5" fill="#5a6b76">※ 帯の長さは仕組みを示すためのもので、実際の金額の割合を表すものではありません。</text>
</svg>
