<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="くらしサポートのアイコン。巣のなかに、ハートの描かれた卵がひとつ置かれている。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d5a27"/>
      <stop offset="1" stop-color="#1a3d18"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- 卵：受け継がれる「我が子を守る知恵」 -->
  <ellipse cx="48" cy="44" rx="14" ry="17" fill="#faf6ef"/>
  <path d="M48 40.4c-2.6-3.4-7.8-1.2-7.8 2.4 0 3.1 4.4 6.3 7.8 8.6 3.4-2.3 7.8-5.5 7.8-8.6 0-3.6-5.2-5.8-7.8-2.4z" fill="#d97757"/>
  <!-- 巣：支援チームという受け皿 -->
  <path d="M20 52q28 14 56 0" fill="none" stroke="#e8efe6" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  <path d="M24 58q24 16 48 0" fill="none" stroke="#faf6ef" stroke-width="5.5" stroke-linecap="round" opacity=".85"/>
  <path d="M30 65q18 12 36 0" fill="none" stroke="#e8efe6" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  <path d="M36 71q12 8 24 0" fill="none" stroke="#faf6ef" stroke-width="4.5" stroke-linecap="round" opacity=".45"/>
</svg>
