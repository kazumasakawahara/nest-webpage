<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="800" height="600" fill="#faf6ef"/>
<text x="400" y="52" text-anchor="middle" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="26" fill="#2d5a27">聞く → 渡す → 引き出す</text>
<text x="400" y="80" text-anchor="middle" font-size="14" fill="#6b665e">一人の記録が、途切れずに次へつながるまで</text>
<line x1="56" y1="98" x2="744" y2="98" stroke="#e6e0d4" stroke-width="1"/>
<g opacity="0.72">
<rect x="56" y="128" width="688" height="118" rx="14" fill="#faf6ef" stroke="#e6e0d4" stroke-width="1"/>
<text x="84" y="172" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="30" fill="#9a948a">①</text>
<text x="126" y="172" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="24" fill="#9a948a">聞く</text>
<text x="126" y="198" font-size="14.5" fill="#9a948a">ふだんどおりに聞き取る</text>
<text x="378" y="162" font-size="13.5" fill="#9a948a">・フェイスシート・面談メモ・会議録</text>
<text x="378" y="189" font-size="13.5" fill="#9a948a">・聞き方を変える必要はありません</text>
<text x="378" y="216" font-size="13.5" fill="#9a948a">・清書もしません</text>
</g>
<path d="M400 252 L400 268" stroke="#e6e0d4" stroke-width="2" stroke-linecap="round"/>
<path d="M394 263 L400 270 L406 263" fill="none" stroke="#e6e0d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g opacity="1">
<rect x="56" y="274" width="688" height="118" rx="14" fill="#ffffff" stroke="#4a8c3f" stroke-width="2.5"/>
<text x="84" y="318" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="30" fill="#2d5a27">②</text>
<text x="126" y="318" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="24" fill="#2d5a27">渡す</text>
<text x="126" y="344" font-size="14.5" fill="#2a2620">受付箱に置くだけ</text>
<text x="378" y="308" font-size="13.5" fill="#6b665e">・デスクトップのフォルダに入れる</text>
<text x="378" y="335" font-size="13.5" fill="#6b665e">・原本は書き換えできない棚へ移る</text>
<text x="378" y="362" font-size="13.5" fill="#6b665e">・置き間違いは記録前なら取り消せる</text>
<rect x="648" y="261" width="80" height="26" rx="13" fill="#d97757"/>
<text x="688" y="279" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">いまここ</text>
</g>
<path d="M400 398 L400 414" stroke="#e6e0d4" stroke-width="2" stroke-linecap="round"/>
<path d="M394 409 L400 416 L406 409" fill="none" stroke="#e6e0d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g opacity="0.72">
<rect x="56" y="420" width="688" height="118" rx="14" fill="#faf6ef" stroke="#e6e0d4" stroke-width="1"/>
<text x="84" y="464" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="30" fill="#9a948a">③</text>
<text x="126" y="464" font-family="'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif" font-size="24" fill="#9a948a">引き出す</text>
<text x="126" y="490" font-size="14.5" fill="#9a948a">必要なときに、必要な人へ</text>
<text x="378" y="454" font-size="13.5" fill="#9a948a">・経緯は手元の記録（Obsidian）へ</text>
<text x="378" y="481" font-size="13.5" fill="#9a948a">・確実に拾う事実はデータベースへ</text>
<text x="378" y="508" font-size="13.5" fill="#9a948a">・緊急時は「してはいけないこと」を先に</text>
</g>
<rect x="56" y="516" width="688" height="46" rx="10" fill="#e8efe6"/>
<text x="400" y="545" text-anchor="middle" font-size="13.5" fill="#2d5a27">実名が入るデータベースへの登録は、必ず人の確認を経てから行います</text>
<text x="400" y="584" text-anchor="middle" font-size="11.5" fill="#9a948a">親なき後の支援 ／ 特定非営利活動法人 nest</text>
</svg>