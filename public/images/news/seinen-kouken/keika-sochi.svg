<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="施行時の経過措置の分岐図">
  <style>
    text{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif}
    .m{font-size:13px;fill:#2a2620}
    .ms{font-size:11.5px;fill:#6b665e}
    .mh{font-family:'Shippori Mincho B1','Hiragino Mincho ProN',serif;font-size:15px;font-weight:600}
  </style>

  <rect x="0" y="0" width="200" height="52" fill="#f0ead8" stroke="#9a948a"/>
  <text x="16" y="24" class="mh" fill="#2a2620">後見・保佐の利用者</text>
  <text x="16" y="43" class="ms">約23.9万人</text>

  <path d="M200 26 L250 26 M250 26 L250 90 M250 26 L250 200 M250 26 L250 300" stroke="#9a948a" stroke-width="1.2" fill="none"/>
  <path d="M250 90 L290 90 M250 200 L290 200 M250 300 L290 300" stroke="#9a948a" stroke-width="1.2"/>
  <path d="M290 90 l-9 -5 v10 z M290 200 l-9 -5 v10 z M290 300 l-9 -5 v10 z" fill="#9a948a"/>

  <rect x="292" y="62" width="468" height="86" fill="#ffffff" stroke="#9a948a"/>
  <text x="308" y="86" class="m">そのまま続けたい</text>
  <text x="308" y="110" class="ms">→ 基本的に現行法の内容のまま利用を継続できる（附則2条・3条）</text>
  <text x="308" y="132" class="ms">　ただし、解任事由（民876条の5）と意向把握義務（民876条の11）は改正後の民法が適用される</text>

  <rect x="292" y="172" width="468" height="86" fill="#e8efe6" stroke="#2d5a27"/>
  <text x="308" y="196" class="m" fill="#2d5a27">新制度へ移りたい</text>
  <text x="308" y="220" class="ms">→ 改正後の補助開始の申立てをする（本人・配偶者・四親等内の親族・後見人等）</text>
  <text x="308" y="242" class="ms">　補助が開始すると、いま受けている後見・保佐開始の審判は取り消される</text>

  <rect x="292" y="272" width="468" height="86" fill="#ffffff" stroke="#9a948a"/>
  <text x="308" y="296" class="m">もうやめたい</text>
  <text x="308" y="320" class="ms">→ 後見・保佐開始の審判の取消しを申し立てることができる（附則2条・3条）</text>
  <text x="308" y="342" class="ms">　能力が回復していなくても、必要がなくなっていれば終われる</text>
</svg>
