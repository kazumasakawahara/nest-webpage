<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="赤ペンの図。AIの答えが書かれた用紙の余白に、赤ペンで◎・△・✕・＋の印が入っている。右下から大きな赤ペンが用紙に向かい、左ではAIさんのロボットが少し緊張した顔で用紙を見守っている" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <!-- 背景 -->
  <rect x="10" y="10" width="620" height="320" rx="18" fill="#efe9dd"/>

  <!-- 用紙（少し傾ける） -->
  <g transform="rotate(-3 330 170)">
    <rect x="186" y="34" width="300" height="272" rx="10" fill="#ffffff" stroke="#ddd3c1" stroke-width="2"/>
    <!-- 見出し -->
    <text x="210" y="70" class="lbl" font-size="16" font-weight="700" fill="#5f5847">AIの答え</text>
    <line x1="210" y1="80" x2="462" y2="80" stroke="#ddd3c1" stroke-width="1.5"/>
    <!-- 本文の行（文字の代わり） -->
    <g stroke="#cfc6b4" stroke-width="7" stroke-linecap="round">
      <line x1="250" y1="104" x2="452" y2="104"/>
      <line x1="250" y1="122" x2="410" y2="122"/>
      <line x1="250" y1="152" x2="446" y2="152"/>
      <line x1="250" y1="170" x2="392" y2="170"/>
      <line x1="250" y1="200" x2="452" y2="200"/>
      <line x1="250" y1="218" x2="420" y2="218"/>
      <line x1="250" y1="248" x2="440" y2="248"/>
      <line x1="250" y1="266" x2="380" y2="266"/>
    </g>
    <!-- 赤ペンの印（余白） -->
    <g fill="none" stroke="#d14b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- ◎ -->
      <circle cx="224" cy="112" r="11"/>
      <circle cx="224" cy="112" r="5.5"/>
      <!-- ✕ -->
      <line x1="214" y1="150" x2="234" y2="170"/>
      <line x1="234" y1="150" x2="214" y2="170"/>
      <!-- △ -->
      <path d="M224 196 L236 218 L212 218 Z"/>
      <!-- ＋ -->
      <line x1="224" y1="244" x2="224" y2="268"/>
      <line x1="212" y1="256" x2="236" y2="256"/>
    </g>
    <!-- 誤りの行に波線・二重線 -->
    <path d="M250 161 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#d14b3a" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 書き込み -->
    <text x="398" y="236" class="lbl" font-size="13" font-weight="700" fill="#d14b3a" transform="rotate(-6 398 236)">20歳未満まで!</text>
  </g>

  <!-- 大きな赤ペン -->
  <g transform="translate(470,250) rotate(-38)">
    <rect x="0" y="-13" width="150" height="26" rx="8" fill="#d14b3a"/>
    <rect x="0" y="-13" width="30" height="26" rx="6" fill="#a8372a"/>
    <rect x="118" y="-15" width="10" height="30" rx="3" fill="#faf6ef" stroke="#a8372a" stroke-width="1.5"/>
    <path d="M0 -13 L-26 0 L0 13 Z" fill="#f2d9ae" stroke="#a8372a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M-26 0 L-17 -4.5 L-17 4.5 Z" fill="#d14b3a"/>
    <text x="72" y="5" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#ffffff">赤ペン</text>
  </g>

  <!-- AIさん（左で見守る） -->
  <g transform="translate(56,164)">
    <line x1="40" y1="14" x2="40" y2="2" stroke="#7c7360" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="0" r="5" fill="#ffd15c"/>
    <rect x="4" y="14" width="72" height="56" rx="16" fill="#faf6ef" stroke="#7c7360" stroke-width="2.6"/>
    <rect x="16" y="26" width="48" height="32" rx="9" fill="#4a443a"/>
    <circle cx="30" cy="41" r="5" fill="#f2d9ae"/>
    <circle cx="50" cy="41" r="5" fill="#f2d9ae"/>
    <!-- 汗 -->
    <path d="M84 20 q5 8 0 12 q-5 -4 0 -12 Z" fill="#8fc3e8"/>
    <rect x="18" y="72" width="44" height="34" rx="10" fill="#faf6ef" stroke="#7c7360" stroke-width="2.6"/>
  </g>
  <text x="96" y="302" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#7c7360">ドキドキ……</text>

  <!-- タイトル -->
  <text x="40" y="58" class="lbl" font-size="18" font-weight="700" fill="#d14b3a">AIの答えに、</text>
  <text x="40" y="84" class="lbl" font-size="18" font-weight="700" fill="#d14b3a">赤ペン</text>
</svg>
