<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Obsidianで文献ノート「山田_2024_意思決定支援の類型」を開いた画面のイメージ。書誌情報・3行要約・使えそうな引用・自分の研究とのつながり、の見出しが並び、本文中の「意思決定支援」「支援付き意思決定」が二重角かっこのリンクになっている。注釈に「概念の名前をリンクにしておくのがコツ」とある">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
    <filter id="shn2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#102211" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="620" height="380" rx="16" fill="#ffffff" stroke="#e3d8c4" stroke-width="1.5" filter="url(#shn2)"/>
  <path d="M10 26 a16 16 0 0 1 16 -16 H614 a16 16 0 0 1 16 16 V44 H10 Z" fill="#f3ead9"/>
  <circle cx="34" cy="27" r="6" fill="#e0685a"/>
  <circle cx="54" cy="27" r="6" fill="#e8b64b"/>
  <circle cx="74" cy="27" r="6" fill="#5aa85a"/>
  <text x="320" y="32" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#8a8073">Obsidian — 文献ノート</text>

  <!-- サイドバー -->
  <rect x="10" y="44" width="150" height="346" fill="#faf6ef"/>
  <line x1="160" y1="44" x2="160" y2="390" stroke="#eee6d6" stroke-width="1.5"/>
  <g class="lbl" font-size="11" fill="#2a2620">
    <path d="M22 62 h8 l3 4 h11 v9 h-22 Z" fill="#e8b64b"/>
    <text x="52" y="73" font-weight="700">文献ノート</text>
    <text x="34" y="96" fill="#8a8073">佐藤_2021_…</text>
    <rect x="26" y="106" width="126" height="20" rx="5" fill="#eef3e6"/>
    <text x="34" y="120" fill="#2d5a27" font-weight="700">山田_2024_…</text>
    <text x="34" y="144" fill="#8a8073">Smith_2019_…</text>
  </g>

  <!-- 本文 -->
  <text x="180" y="76" class="lbl" font-size="15" font-weight="700" fill="#2a2620">山田_2024_意思決定支援の類型</text>

  <g class="lbl" font-size="12.5">
    <text x="180" y="106" font-weight="700" fill="#b85f3d">## 書誌情報</text>
    <text x="180" y="126" fill="#2a2620">山田太郎（2024）「……の類型」『社会福祉学』65(2), 45-58.</text>

    <text x="180" y="156" font-weight="700" fill="#b85f3d">## 3行要約（自分の言葉で）</text>
    <text x="180" y="176" fill="#2a2620"><tspan fill="#4a6fb0">[[意思決定支援]]</tspan> の先行研究を3類型に整理。</text>
    <text x="180" y="194" fill="#2a2620">代行型への偏りを指摘し <tspan fill="#4a6fb0">[[支援付き意思決定]]</tspan> を提案。</text>

    <text x="180" y="224" font-weight="700" fill="#b85f3d">## 使えそうな引用（頁番号つき）</text>
    <text x="180" y="244" fill="#2a2620">「支援者の善意は、しばしば本人の…」（p.52）</text>

    <text x="180" y="274" font-weight="700" fill="#b85f3d">## 自分の研究とのつながり</text>
    <text x="180" y="294" fill="#2a2620">2章の枠組みに採用。ただしB類型の定義には異論→考察で</text>
  </g>

  <!-- 注釈 -->
  <g>
    <rect x="404" y="316" width="212" height="58" rx="10" fill="#fff" stroke="#b85f3d" stroke-width="2"/>
    <text x="510" y="340" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#b85f3d">概念の名前を [[リンク]] に</text>
    <text x="510" y="359" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#b85f3d">しておくのがコツ</text>
    <line x1="404" y1="330" x2="286" y2="182" stroke="#b85f3d" stroke-width="2"/>
    <path d="M286 182 l13 2 l-7 10 z" fill="#b85f3d"/>
  </g>
</svg>
