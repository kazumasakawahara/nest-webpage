<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="電車の窓辺に座った旅人がスマホに向かって話している絵。窓の外には海と灯台。旅人の手元から、声の吹き出し・切符・レシート・食堂の看板の写真が「raw なんでも箱」と書かれた箱に落ちていく。箱のそばでAIさん人形が「仕分け係」の札を持って待っている">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; fill: #2f2a24; }
      .mute { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; fill: #8a7f6e; }
      .thread { stroke: #b85f3d; stroke-width: 2; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="640" height="360" rx="16" fill="#faf6ef"/>

  <!-- 車内の壁と窓 -->
  <rect x="0" y="0" width="400" height="360" rx="16" fill="#efe9dc"/>
  <rect x="40" y="40" width="300" height="150" rx="10" fill="#a9c8e2" stroke="#8a7f6e" stroke-width="3"/>
  <rect x="40" y="140" width="300" height="50" fill="#4a7ea3"/>
  <!-- 灯台と岬 -->
  <path d="M230 140 L330 140 L300 112 L260 112 Z" fill="#7a8a6a"/>
  <path d="M276 112 L296 112 L292 78 L280 78 Z" fill="#f2efe8"/>
  <rect x="279" y="74" width="14" height="6" fill="#b85f3d"/>
  <circle cx="90" cy="70" r="10" fill="#f6dc8a"/>
  <!-- 座席 -->
  <rect x="30" y="200" width="200" height="120" rx="8" fill="#6f8a63"/>
  <rect x="30" y="300" width="230" height="30" rx="6" fill="#5b7351"/>

  <!-- 旅人 -->
  <g transform="translate(150 190)">
    <path d="M-40 130 q0 -60 40 -60 q40 0 40 60 Z" fill="#c97b5b"/>
    <circle cx="0" cy="42" r="28" fill="#f2d3b3"/>
    <path d="M-28 36 q10 -30 40 -22 q16 6 16 22 q-8 -10 -24 -10 q-16 0 -32 10 Z" fill="#4a3a2c"/>
    <circle cx="-9" cy="46" r="2.5" fill="#2f2a24"/>
    <circle cx="9" cy="46" r="2.5" fill="#2f2a24"/>
    <path d="M-6 58 q6 5 12 0" stroke="#2f2a24" stroke-width="1.8" fill="none"/>
    <!-- 腕とスマホ -->
    <path d="M30 96 q30 -20 44 -46" stroke="#c97b5b" stroke-width="14" stroke-linecap="round" fill="none"/>
    <rect x="62" y="30" width="22" height="40" rx="5" fill="#2f2a24"/>
    <rect x="65" y="34" width="16" height="30" rx="3" fill="#ffffff"/>
    <!-- 声 -->
    <path d="M92 40 q10 -6 10 -14" class="thread"/>
    <path d="M96 48 q16 -8 18 -24" class="thread"/>
  </g>
  <text x="150" y="345" text-anchor="middle" class="mute" font-size="11">電車の中で、話しておく</text>

  <!-- 落ちていくもの -->
  <g transform="translate(300 215)">
    <g transform="rotate(-10)">
      <rect x="0" y="0" width="54" height="26" rx="4" fill="#ffffff" stroke="#8a7f6e"/>
      <line x1="6" y1="6" x2="6" y2="20" stroke="#b85f3d" stroke-width="2"/>
      <text x="30" y="17" text-anchor="middle" class="mute" font-size="8">乗車券</text>
    </g>
    <g transform="translate(60 30) rotate(8)">
      <rect x="0" y="0" width="34" height="44" fill="#ffffff" stroke="#8a7f6e"/>
      <line x1="6" y1="10" x2="28" y2="10" stroke="#c9c1b0"/>
      <line x1="6" y1="18" x2="28" y2="18" stroke="#c9c1b0"/>
      <line x1="6" y1="26" x2="20" y2="26" stroke="#c9c1b0"/>
    </g>
    <g transform="translate(10 55) rotate(-4)">
      <rect x="0" y="0" width="52" height="22" rx="3" fill="#8b5e3c"/>
      <text x="26" y="15" text-anchor="middle" font-size="9" fill="#ffffff" font-family="serif">浜食堂</text>
    </g>
    <g transform="translate(70 -20)">
      <path d="M0 14 q0 -14 14 -14 h20 q14 0 14 14 q0 14 -14 14 h-12 l-10 8 v-8 h-2 q-10 0 -10 -14 Z" fill="#ffffff" stroke="#b85f3d" stroke-width="1.5"/>
      <text x="24" y="18" text-anchor="middle" class="cap" font-size="8">声</text>
    </g>
  </g>

  <!-- なんでも箱 -->
  <g transform="translate(430 200)">
    <path d="M0 40 L120 40 L110 140 L10 140 Z" fill="#d8b98a" stroke="#b98f5c" stroke-width="2"/>
    <rect x="-6" y="30" width="132" height="14" rx="3" fill="#b98f5c"/>
    <text x="60" y="100" text-anchor="middle" class="cap" font-size="14">raw</text>
    <text x="60" y="118" text-anchor="middle" class="mute" font-size="10">なんでも箱</text>
  </g>

  <!-- AIさん人形 -->
  <g transform="translate(590 230)">
    <rect x="-20" y="38" width="40" height="48" rx="10" fill="#e7b9a0"/>
    <rect x="-18" y="0" width="36" height="32" rx="8" fill="#ffffff" stroke="#b85f3d" stroke-width="2"/>
    <circle cx="-7" cy="14" r="2.3" fill="#2f2a24"/>
    <circle cx="7" cy="14" r="2.3" fill="#2f2a24"/>
    <path d="M-6 22 q6 5 12 0" stroke="#2f2a24" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="-8" x2="0" y2="0" stroke="#b85f3d" stroke-width="2"/>
    <circle cx="0" cy="-10" r="3" fill="#b85f3d"/>
    <g transform="translate(0 92)">
      <rect x="-28" y="0" width="56" height="18" fill="#ffffff" stroke="#8a7f6e"/>
      <text x="0" y="13" text-anchor="middle" class="cap" font-size="10">仕分け係</text>
    </g>
  </g>
  <text x="520" y="345" text-anchor="middle" class="mute" font-size="11">帰ってから、まとめて仕分け</text>
</svg>
