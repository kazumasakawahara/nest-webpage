<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Obsidianで査読対応ノートを開いた画面のイメージ。表の列は番号・査読者・指摘の要旨・対応方針・直した場所・状態。A-1とA-2は済、B-1は作業中。注釈に「直したらすぐ、この表に書き込む。最後にまとめて思い出そうとしない」とある">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
    <filter id="sht4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#102211" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="620" height="380" rx="16" fill="#ffffff" stroke="#e3d8c4" stroke-width="1.5" filter="url(#sht4)"/>
  <path d="M10 26 a16 16 0 0 1 16 -16 H614 a16 16 0 0 1 16 16 V44 H10 Z" fill="#f3ead9"/>
  <circle cx="34" cy="27" r="6" fill="#e0685a"/>
  <circle cx="54" cy="27" r="6" fill="#e8b64b"/>
  <circle cx="74" cy="27" r="6" fill="#5aa85a"/>
  <text x="320" y="32" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#8a8073">Obsidian — 原稿/査読対応_第1回</text>

  <text x="34" y="76" class="lbl" font-size="15" font-weight="700" fill="#2a2620">査読対応_第1回</text>

  <!-- 表 -->
  <g>
    <!-- ヘッダ -->
    <rect x="30" y="92" width="580" height="30" fill="#f3ead9"/>
    <g class="lbl" font-size="11.5" font-weight="700" fill="#55503f">
      <text x="42" y="112">番号</text>
      <text x="88" y="112">指摘の要旨</text>
      <text x="288" y="112">対応方針</text>
      <text x="452" y="112">直した場所</text>
      <text x="548" y="112">状態</text>
    </g>
    <!-- 枠線 -->
    <rect x="30" y="92" width="580" height="216" fill="none" stroke="#d8cfbd" stroke-width="1.5"/>
    <line x1="30" y1="122" x2="610" y2="122" stroke="#d8cfbd" stroke-width="1.2"/>
    <line x1="30" y1="184" x2="610" y2="184" stroke="#eee6d6" stroke-width="1.2"/>
    <line x1="30" y1="246" x2="610" y2="246" stroke="#eee6d6" stroke-width="1.2"/>
    <line x1="80" y1="92" x2="80" y2="308" stroke="#eee6d6" stroke-width="1.2"/>
    <line x1="280" y1="92" x2="280" y2="308" stroke="#eee6d6" stroke-width="1.2"/>
    <line x1="444" y1="92" x2="444" y2="308" stroke="#eee6d6" stroke-width="1.2"/>
    <line x1="540" y1="92" x2="540" y2="308" stroke="#eee6d6" stroke-width="1.2"/>

    <!-- 行1 -->
    <g class="lbl" font-size="11.5" fill="#2a2620">
      <text x="42" y="146" font-weight="700">A-1</text>
      <text x="88" y="146">先行研究に○○の視点が</text>
      <text x="88" y="164">欠けている</text>
      <text x="288" y="146">文献を2本追加し</text>
      <text x="288" y="164">1.2節を加筆</text>
      <text x="452" y="146">1.2節</text>
      <text x="548" y="150" font-size="13">✅ 済</text>
    </g>
    <!-- 行2 -->
    <g class="lbl" font-size="11.5" fill="#2a2620">
      <text x="42" y="208" font-weight="700">A-2</text>
      <text x="88" y="208">表2の数値の根拠が不明</text>
      <text x="288" y="208">集計方法を注に明記</text>
      <text x="452" y="208">表2・注3</text>
      <text x="548" y="212" font-size="13">✅ 済</text>
    </g>
    <!-- 行3 -->
    <g class="lbl" font-size="11.5" fill="#2a2620">
      <text x="42" y="270" font-weight="700">B-1</text>
      <text x="88" y="270">考察が結果の繰り返しに</text>
      <text x="88" y="288">なっている</text>
      <text x="288" y="270">構成をテーマ別に</text>
      <text x="288" y="288">組み替え中</text>
      <text x="452" y="270">4章</text>
      <text x="548" y="274" font-size="13">🔲 作業中</text>
    </g>
  </g>

  <!-- 注釈 -->
  <g>
    <rect x="130" y="330" width="380" height="42" rx="10" fill="#fff" stroke="#b85f3d" stroke-width="2"/>
    <text x="320" y="356" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#b85f3d">直したらすぐ、この表に書き込む。最後にまとめて思い出そうとしない</text>
  </g>
</svg>
