<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="人形劇の舞台で、封筒を持った漁師の人形ガタロウさんが困っており、蝶ネクタイのAIさんが「写真に撮って、見せてください」と声をかけている様式サンプル">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; }
    </style>
  </defs>

  <!-- 舞台背景（クリーム） -->
  <rect width="640" height="360" rx="16" fill="#faf6ef"/>

  <!-- 空の書き割り -->
  <rect x="12" y="56" width="616" height="248" fill="#eef3e6"/>
  <ellipse cx="120" cy="188" rx="38" ry="13" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="155" cy="196" rx="26" ry="10" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="560" cy="200" rx="32" ry="12" fill="#ffffff" opacity="0.9"/>
  <circle cx="590" cy="96" r="20" fill="#c9a44a" opacity="0.85"/>

  <!-- 緞帳（どんちょう） -->
  <rect x="0" y="0" width="640" height="42" fill="#b85f3d"/>
  <path d="M0 42 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 v-8 h-640 Z" fill="#b85f3d"/>
  <g fill="#a04e2f" opacity="0.5">
    <rect x="70" y="0" width="7" height="40"/>
    <rect x="230" y="0" width="7" height="40"/>
    <rect x="390" y="0" width="7" height="40"/>
    <rect x="550" y="0" width="7" height="40"/>
  </g>
  <!-- 袖幕（左右・細め） -->
  <path d="M0 0 h34 q8 84 -4 164 q-8 54 -30 72 Z" fill="#a04e2f"/>
  <path d="M640 0 h-34 q-8 84 4 164 q8 54 30 72 Z" fill="#a04e2f"/>

  <!-- 木の看板（中央・ぶら下がり） -->
  <line x1="320" y1="42" x2="320" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="252" y1="42" x2="260" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="388" y1="42" x2="380" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <g transform="translate(212 58)">
    <rect width="216" height="38" rx="6" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="3"/>
    <text x="108" y="25" text-anchor="middle" class="cap" font-size="15" fill="#4a3b2f">第一幕「役所からの手紙」</text>
  </g>

  <!-- ふきだし（ガタロウさん・左上） -->
  <g>
    <rect x="26" y="66" width="192" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M150 106 l12 16 l4 -16 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="122" y="91" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">なんて書いてあるんじゃ？</text>
  </g>

  <!-- ふきだし（AIさん・右） -->
  <g>
    <rect x="386" y="118" width="236" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M516 158 l-4 14 l-10 -14 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="504" y="143" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">写真に撮って、見せてください</text>
  </g>

  <!-- ガタロウさん（漁師の人形） -->
  <g transform="translate(200 200)">
    <!-- 胴体（縞シャツ） -->
    <g>
      <path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36 C36 18 -36 18 -52 36 Z" fill="#e9eef5"/>
      <clipPath id="shirt"><path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36 C36 18 -36 18 -52 36 Z"/></clipPath>
      <g clip-path="url(#shirt)" stroke="#3a6ea5" stroke-width="9">
        <line x1="-60" y1="38" x2="60" y2="38"/>
        <line x1="-60" y1="60" x2="60" y2="60"/>
        <line x1="-60" y1="82" x2="60" y2="82"/>
        <line x1="-60" y1="104" x2="60" y2="104"/>
      </g>
      <path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36" fill="none" stroke="#8ba3c4" stroke-width="1.6" stroke-dasharray="4 4"/>
    </g>
    <!-- 腕（左：封筒を胸の横で持つ） -->
    <path d="M-44 48 C-70 52 -84 40 -88 24" fill="none" stroke="#e9eef5" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-90" cy="20" r="11" fill="#f0c9a8"/>
    <!-- 封筒 -->
    <g transform="translate(-138 -12) rotate(-8)">
      <rect width="72" height="46" rx="4" fill="#ffffff" stroke="#8a7a5c" stroke-width="2.5"/>
      <path d="M0 0 L36 25 L72 0" fill="none" stroke="#8a7a5c" stroke-width="2.5"/>
      <rect x="47" y="6" width="17" height="13" fill="#d97757" opacity="0.85"/>
      <text x="9" y="40" class="cap" font-size="12" fill="#6b5a3c">役所より</text>
    </g>
    <!-- 腕（右：ほほに手） -->
    <path d="M44 52 C66 58 72 44 66 28" fill="none" stroke="#e9eef5" stroke-width="18" stroke-linecap="round"/>
    <circle cx="64" cy="24" r="11" fill="#f0c9a8"/>
    <!-- 頭 -->
    <circle cx="0" cy="-30" r="52" fill="#f0c9a8"/>
    <path d="M-52 -30 a52 52 0 0 1 104 0" fill="none" stroke="#d9b28c" stroke-width="1.6" stroke-dasharray="4 4"/>
    <!-- 白ひげ -->
    <path d="M-46 -12 C-48 20 -24 34 0 34 C24 34 48 20 46 -12 C34 4 22 6 12 2 C6 10 -6 10 -12 2 C-22 6 -34 4 -46 -12 Z" fill="#f4f1ea" stroke="#d9d2c2" stroke-width="1.5"/>
    <!-- 口（へにゃ） -->
    <path d="M-8 14 q8 -6 16 2" stroke="#9e4a3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- 赤い大きな鼻（ひげの上に乗せる） -->
    <circle cx="0" cy="-10" r="16" fill="#d97757"/>
    <circle cx="-5" cy="-15" r="4.5" fill="#ffffff" opacity="0.6"/>
    <!-- 太い眉（困り） -->
    <path d="M-36 -44 q14 -12 26 -4" stroke="#4a3b2f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M10 -48 q14 -4 26 6" stroke="#4a3b2f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- 丸い目 -->
    <circle cx="-18" cy="-30" r="7" fill="#2a2620"/>
    <circle cx="18" cy="-30" r="7" fill="#2a2620"/>
    <circle cx="-16" cy="-32" r="2.4" fill="#ffffff"/>
    <circle cx="20" cy="-32" r="2.4" fill="#ffffff"/>
    <!-- ニット帽（緑） -->
    <path d="M-50 -54 C-46 -90 46 -90 50 -54 C34 -64 -34 -64 -50 -54 Z" fill="#2d5a27"/>
    <rect x="-52" y="-60" width="104" height="16" rx="8" fill="#4a8c3f"/>
    <circle cx="0" cy="-86" r="9" fill="#c9a44a"/>
  </g>

  <!-- AIさん（続投デザイン＋蝶ネクタイ。波の書き割りに足元が隠れる高さ） -->
  <g transform="translate(0 46)">
    <rect x="452" y="150" width="68" height="58" rx="14" fill="#2d5a27"/>
    <line x1="486" y1="140" x2="486" y2="150" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="486" cy="136" r="5" fill="#d97757"/>
    <path d="M466 174 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M494 174 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M476 192 q10 7 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M486 214 l-16 -9 v18 z" fill="#b85f3d"/>
    <path d="M486 214 l16 -9 v18 z" fill="#b85f3d"/>
    <circle cx="486" cy="214" r="4" fill="#c9a44a"/>
    <rect x="460" y="222" width="52" height="42" rx="10" fill="#4a8c3f" opacity="0.9"/>
  </g>

  <!-- 波の書き割り（手前。人形の下半身を隠す） -->
  <g>
    <path d="M-10 316 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 v60 h-650 Z" fill="#3a6ea5" opacity="0.85"/>
    <path d="M-30 334 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 v40 h-690 Z" fill="#2a5580"/>
  </g>
</svg>
