<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="対比図。左：ひとつの引き出しに「音楽会・送迎表・研修資料・備品」の書類が全部詰まってあふれている。右：「秋の音楽会」「送迎表の見直し」「研修資料」と用件ごとに引き出しが分かれていて、それぞれ余裕がある。1会話＝1用件">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <!-- 左パネル -->
  <rect x="14" y="14" width="296" height="272" rx="16" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
  <rect x="14" y="14" width="296" height="40" rx="16" fill="#f7ede7"/><rect x="14" y="42" width="296" height="12" fill="#f7ede7"/>
  <text x="162" y="40" text-anchor="middle" class="lbl" font-size="14" font-weight="700" fill="#b8543a">ぜんぶ同じ会話に ── すぐあふれる</text>

  <!-- 引き出し（1段・あふれ） -->
  <g transform="translate(62,90)">
    <rect width="200" height="150" rx="6" fill="#d8cdb4" stroke="#8a7a5c" stroke-width="2"/>
    <rect x="14" y="34" width="172" height="96" rx="4" fill="#a5825c" stroke="#6b4a2f" stroke-width="2"/>
    <rect x="84" y="76" width="32" height="8" rx="4" fill="#6b4a2f"/>
    <!-- はみ出す書類 -->
    <g class="lbl" font-size="9.5" fill="#2a2620">
      <g transform="translate(22,10) rotate(-8)"><rect width="62" height="36" fill="#fff" stroke="#8a7a5c" stroke-width="1.2"/><text x="31" y="22" text-anchor="middle">音楽会</text></g>
      <g transform="translate(70,2) rotate(6)"><rect width="62" height="36" fill="#fff" stroke="#8a7a5c" stroke-width="1.2"/><text x="31" y="22" text-anchor="middle">送迎表</text></g>
      <g transform="translate(118,12) rotate(-4)"><rect width="62" height="36" fill="#fff" stroke="#8a7a5c" stroke-width="1.2"/><text x="31" y="22" text-anchor="middle">研修資料</text></g>
      <g transform="translate(150,-6) rotate(14)"><rect width="56" height="34" fill="#fff" stroke="#8a7a5c" stroke-width="1.2"/><text x="28" y="21" text-anchor="middle">備品</text></g>
      <g transform="translate(-6,-2) rotate(-16)"><rect width="56" height="34" fill="#fff" stroke="#8a7a5c" stroke-width="1.2"/><text x="28" y="21" text-anchor="middle">案内文</text></g>
    </g>
  </g>
  <text x="162" y="268" text-anchor="middle" class="lbl" font-size="11.5" fill="#b8543a">探すのも大変。前提もすぐ薄れる</text>

  <!-- 右パネル -->
  <rect x="330" y="14" width="296" height="272" rx="16" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
  <rect x="330" y="14" width="296" height="40" rx="16" fill="#eaf2e5"/><rect x="330" y="42" width="296" height="12" fill="#eaf2e5"/>
  <text x="478" y="40" text-anchor="middle" class="lbl" font-size="14" font-weight="700" fill="#2f5d3a">1会話＝1用件 ── 余裕がある</text>

  <!-- 引き出し（3段） -->
  <g transform="translate(378,70)">
    <rect width="200" height="170" rx="6" fill="#d8cdb4" stroke="#8a7a5c" stroke-width="2"/>
    <g>
      <rect x="10" y="10" width="180" height="46" rx="4" fill="#a5825c" stroke="#6b4a2f" stroke-width="2"/>
      <rect x="16" y="16" width="90" height="18" rx="3" fill="#fff" stroke="#8a7a5c" stroke-width="1"/>
      <text x="61" y="29" text-anchor="middle" class="lbl" font-size="10" fill="#2a2620">秋の音楽会</text>
      <rect x="150" y="28" width="26" height="7" rx="3.5" fill="#6b4a2f"/>
    </g>
    <g>
      <rect x="10" y="62" width="180" height="46" rx="4" fill="#a5825c" stroke="#6b4a2f" stroke-width="2"/>
      <rect x="16" y="68" width="90" height="18" rx="3" fill="#fff" stroke="#8a7a5c" stroke-width="1"/>
      <text x="61" y="81" text-anchor="middle" class="lbl" font-size="10" fill="#2a2620">送迎表の見直し</text>
      <rect x="150" y="80" width="26" height="7" rx="3.5" fill="#6b4a2f"/>
    </g>
    <g>
      <rect x="10" y="114" width="180" height="46" rx="4" fill="#a5825c" stroke="#6b4a2f" stroke-width="2"/>
      <rect x="16" y="120" width="90" height="18" rx="3" fill="#fff" stroke="#8a7a5c" stroke-width="1"/>
      <text x="61" y="133" text-anchor="middle" class="lbl" font-size="10" fill="#2a2620">研修資料</text>
      <rect x="150" y="132" width="26" height="7" rx="3.5" fill="#6b4a2f"/>
    </g>
  </g>
  <text x="478" y="268" text-anchor="middle" class="lbl" font-size="11.5" fill="#2f5d3a">用件ごとに分ければ、定員はそう簡単に埋まらない</text>
</svg>
