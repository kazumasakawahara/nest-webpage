<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Obsidianのグラフビュー画面のイメージ。中央の「意思決定支援」の大きな点に、山田_2024・佐藤_2021・Smith_2019などの文献ノートから線がつながり、周辺に「本人の意向」「成年後見」「支援者の役割」の概念の点も見える。注釈に「線が集まっている場所が、自分の研究の急所」とある">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
    <filter id="shg2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#102211" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="620" height="360" rx="16" fill="#ffffff" stroke="#e3d8c4" stroke-width="1.5" filter="url(#shg2)"/>
  <path d="M10 26 a16 16 0 0 1 16 -16 H614 a16 16 0 0 1 16 16 V44 H10 Z" fill="#f3ead9"/>
  <circle cx="34" cy="27" r="6" fill="#e0685a"/>
  <circle cx="54" cy="27" r="6" fill="#e8b64b"/>
  <circle cx="74" cy="27" r="6" fill="#5aa85a"/>
  <text x="320" y="32" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#8a8073">Obsidian — グラフビュー</text>

  <rect x="10" y="44" width="620" height="326" fill="#fdfbf7"/>

  <!-- 線（先に描く） -->
  <g stroke="#c9c0ad" stroke-width="1.8">
    <line x1="300" y1="200" x2="150" y2="110"/>
    <line x1="300" y1="200" x2="140" y2="260"/>
    <line x1="300" y1="200" x2="260" y2="320"/>
    <line x1="300" y1="200" x2="430" y2="120"/>
    <line x1="300" y1="200" x2="450" y2="280"/>
    <line x1="430" y1="120" x2="540" y2="90"/>
    <line x1="430" y1="120" x2="520" y2="180"/>
    <line x1="140" y1="260" x2="150" y2="110"/>
    <line x1="450" y1="280" x2="520" y2="180"/>
    <line x1="260" y1="320" x2="450" y2="280"/>
  </g>

  <!-- 中央：意思決定支援 -->
  <circle cx="300" cy="200" r="26" fill="#4a8c3f"/>
  <text x="300" y="244" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#2d5a27">意思決定支援</text>

  <!-- 文献ノードたち -->
  <g class="lbl" font-size="11" fill="#55503f">
    <circle cx="150" cy="110" r="12" fill="#b85f3d"/>
    <text x="150" y="90" text-anchor="middle">山田_2024</text>
    <circle cx="140" cy="260" r="12" fill="#b85f3d"/>
    <text x="140" y="288" text-anchor="middle">佐藤_2021</text>
    <circle cx="260" cy="320" r="12" fill="#b85f3d"/>
    <text x="260" y="348" text-anchor="middle">Smith_2019</text>
    <circle cx="430" cy="120" r="12" fill="#b85f3d"/>
    <text x="430" y="100" text-anchor="middle">高橋_2023</text>
    <circle cx="450" cy="280" r="12" fill="#b85f3d"/>
    <text x="450" y="308" text-anchor="middle">鈴木_2025</text>
  </g>

  <!-- 概念ノードたち -->
  <g class="lbl" font-size="11" fill="#55503f">
    <circle cx="540" cy="90" r="9" fill="#7ea877"/>
    <text x="540" y="72" text-anchor="middle">本人の意向</text>
    <circle cx="520" cy="180" r="9" fill="#7ea877"/>
    <text x="562" y="184">成年後見</text>
    <circle cx="76" cy="180" r="9" fill="#7ea877"/>
    <text x="76" y="162" text-anchor="middle">支援者の役割</text>
  </g>
  <line x1="76" y1="180" x2="140" y2="260" stroke="#c9c0ad" stroke-width="1.8"/>
  <line x1="76" y1="180" x2="150" y2="110" stroke="#c9c0ad" stroke-width="1.8"/>

  <!-- 注釈 -->
  <g>
    <rect x="360" y="322" width="252" height="38" rx="10" fill="#fff" stroke="#b85f3d" stroke-width="2"/>
    <text x="486" y="346" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#b85f3d">線が集まっている場所＝研究の急所</text>
    <line x1="360" y1="336" x2="322" y2="222" stroke="#b85f3d" stroke-width="2"/>
    <path d="M322 222 l12 4 l-8 9 z" fill="#b85f3d"/>
  </g>
</svg>
