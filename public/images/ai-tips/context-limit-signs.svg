<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="3コマの図。①「条件が抜ける」：AIさんが「参加者は何人でしたっけ？」と聞く。②「聞き返される」：「事業所名をもう一度教えてください」と聞く。③「一般論に戻る」：「一般的に、行事の準備では……」とよそよそしい返事になる">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
    <g id="bot">
      <line x1="16" y1="5" x2="16" y2="0" stroke="#2f5d3a" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="16" cy="-2" r="2.8" fill="#ffd15c"/>
      <rect x="2" y="5" width="28" height="23" rx="7" fill="#faf6ef" stroke="#2f5d3a" stroke-width="2"/>
      <rect x="8" y="10" width="16" height="13" rx="4" fill="#1f3a26"/>
      <circle cx="12.5" cy="16.5" r="2.3" fill="#8fe0b0"/>
      <circle cx="19.5" cy="16.5" r="2.3" fill="#8fe0b0"/>
    </g>
  </defs>

  <text x="24" y="34" class="lbl" font-size="17" font-weight="700" fill="#2f5d3a">“ボケ”のサインは、3つ</text>

  <!-- パネル1 -->
  <g transform="translate(20,52)">
    <rect width="192" height="228" rx="14" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
    <rect width="192" height="38" rx="14" fill="#f7ede7"/><rect y="26" width="192" height="12" fill="#f7ede7"/>
    <text x="96" y="25" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#b0492c">① 条件が抜ける</text>
    <use href="#bot" x="16" y="70"/>
    <rect x="58" y="60" width="122" height="56" rx="10" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
    <path d="M58 84 l-8 6 l8 6 z" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
    <text x="119" y="84" text-anchor="middle" class="lbl" font-size="11.5" fill="#2a2620">参加者は</text>
    <text x="119" y="102" text-anchor="middle" class="lbl" font-size="11.5" fill="#2a2620">何人でしたっけ？</text>
    <text x="96" y="150" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">最初に伝えた前提が</text>
    <text x="96" y="167" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">薄れた証拠</text>
    <text x="96" y="206" text-anchor="middle" class="lbl" font-size="10.5" fill="#9a907c">40名って言ったのに…</text>
  </g>

  <!-- パネル2 -->
  <g transform="translate(224,52)">
    <rect width="192" height="228" rx="14" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
    <rect width="192" height="38" rx="14" fill="#f7ede7"/><rect y="26" width="192" height="12" fill="#f7ede7"/>
    <text x="96" y="25" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#b0492c">② 聞き返される</text>
    <use href="#bot" x="16" y="70"/>
    <rect x="58" y="60" width="122" height="56" rx="10" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
    <path d="M58 84 l-8 6 l8 6 z" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
    <text x="119" y="84" text-anchor="middle" class="lbl" font-size="11.5" fill="#2a2620">事業所名を</text>
    <text x="119" y="102" text-anchor="middle" class="lbl" font-size="11.5" fill="#2a2620">もう一度教えて</text>
    <text x="96" y="150" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">ボードの上のほうが</text>
    <text x="96" y="167" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">読めなくなっている</text>
    <text x="96" y="206" text-anchor="middle" class="lbl" font-size="10.5" fill="#9a907c">3週間前に言ったのに…</text>
  </g>

  <!-- パネル3 -->
  <g transform="translate(428,52)">
    <rect width="192" height="228" rx="14" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
    <rect width="192" height="38" rx="14" fill="#f7ede7"/><rect y="26" width="192" height="12" fill="#f7ede7"/>
    <text x="96" y="25" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#b0492c">③ 一般論に戻る</text>
    <use href="#bot" x="16" y="70"/>
    <rect x="58" y="60" width="122" height="56" rx="10" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
    <path d="M58 84 l-8 6 l8 6 z" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
    <text x="119" y="84" text-anchor="middle" class="lbl" font-size="11.5" fill="#2a2620">一般的に、行事の</text>
    <text x="119" y="102" text-anchor="middle" class="lbl" font-size="11.5" fill="#2a2620">準備では……</text>
    <text x="96" y="150" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">あなたの現場の返事から</text>
    <text x="96" y="167" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">教科書の返事に</text>
    <text x="96" y="206" text-anchor="middle" class="lbl" font-size="10.5" fill="#9a907c">急によそよそしい…</text>
  </g>
</svg>
