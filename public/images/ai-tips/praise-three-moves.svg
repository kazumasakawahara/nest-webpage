<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="3枚のカード。技①「先に出させる」：自分の案を見せる前に、AIに案を出させる。技②「採点させる」：100点満点で採点、減点理由を具体的に。技③「立場を変えさせる」：反対する人の意見を3つ、厳しい監査担当として読む">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <text x="24" y="34" class="lbl" font-size="17" font-weight="700" fill="#2f5d3a">耳の痛い指摘を引き出す、3つの技</text>

  <!-- カード1 -->
  <g transform="translate(20,56)">
    <rect width="192" height="264" rx="14" fill="#ffffff" stroke="#bcd7b3" stroke-width="2"/>
    <circle cx="30" cy="30" r="18" fill="#4a8c3f"/>
    <text x="30" y="36" text-anchor="middle" class="lbl" font-size="15" font-weight="700" fill="#fff">1</text>
    <text x="58" y="36" class="lbl" font-size="14" font-weight="700" fill="#2f5d3a">先に出させる</text>
    <!-- 図：条件→AI案、その後に私の案 -->
    <rect x="22" y="64" width="60" height="22" rx="6" fill="#efe9dd"/>
    <text x="52" y="79" text-anchor="middle" class="lbl" font-size="10" fill="#5f5847">条件だけ</text>
    <path d="M86 75 h14 M96 69 l6 6 -6 6" fill="none" stroke="#b7ac97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="106" y="58" width="62" height="34" rx="6" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="1.5"/>
    <text x="137" y="79" text-anchor="middle" class="lbl" font-size="10.5" font-weight="700" fill="#2f5d3a">AIの案</text>
    <rect x="106" y="102" width="62" height="34" rx="6" fill="#fdf8e8" stroke="#c9a44a" stroke-width="1.5"/>
    <text x="137" y="123" text-anchor="middle" class="lbl" font-size="10.5" font-weight="700" fill="#8a6a1a">私の案</text>
    <text x="52" y="122" text-anchor="middle" class="lbl" font-size="9.5" fill="#9a907c">あとで見せる</text>
    <text x="96" y="168" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">自分の案を見せる前に</text>
    <text x="96" y="185" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">AIに案を出させる</text>
    <rect x="16" y="204" width="160" height="44" rx="8" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.2"/>
    <text x="96" y="222" text-anchor="middle" class="lbl" font-size="9.5" fill="#7c7360">「私の案はまだ見せません。</text>
    <text x="96" y="238" text-anchor="middle" class="lbl" font-size="9.5" fill="#7c7360">あなたなら、どうしますか」</text>
  </g>

  <!-- カード2 -->
  <g transform="translate(224,56)">
    <rect width="192" height="264" rx="14" fill="#ffffff" stroke="#bcd7b3" stroke-width="2"/>
    <circle cx="30" cy="30" r="18" fill="#4a8c3f"/>
    <text x="30" y="36" text-anchor="middle" class="lbl" font-size="15" font-weight="700" fill="#fff">2</text>
    <text x="58" y="36" class="lbl" font-size="14" font-weight="700" fill="#2f5d3a">採点させる</text>
    <!-- 図：採点票 -->
    <rect x="46" y="60" width="100" height="84" rx="6" fill="#faf6ef" stroke="#8a7a5c" stroke-width="1.5"/>
    <text x="96" y="86" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#b0492c">72<tspan font-size="11" fill="#5f5847">点</tspan></text>
    <text x="96" y="106" text-anchor="middle" class="lbl" font-size="9.5" fill="#5f5847">減点理由</text>
    <line x1="58" y1="118" x2="134" y2="118" stroke="#d97757" stroke-width="2"/>
    <line x1="58" y1="128" x2="122" y2="128" stroke="#d97757" stroke-width="2"/>
    <line x1="58" y1="138" x2="130" y2="138" stroke="#d97757" stroke-width="2"/>
    <text x="96" y="168" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">点数より、減点理由を</text>
    <text x="96" y="185" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">具体的に言わせる</text>
    <rect x="16" y="204" width="160" height="44" rx="8" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.2"/>
    <text x="96" y="222" text-anchor="middle" class="lbl" font-size="9.5" fill="#7c7360">「100点満点で採点して。</text>
    <text x="96" y="238" text-anchor="middle" class="lbl" font-size="9.5" fill="#7c7360">ほめ言葉は不要です」</text>
  </g>

  <!-- カード3 -->
  <g transform="translate(428,56)">
    <rect width="192" height="264" rx="14" fill="#ffffff" stroke="#bcd7b3" stroke-width="2"/>
    <circle cx="30" cy="30" r="18" fill="#4a8c3f"/>
    <text x="30" y="36" text-anchor="middle" class="lbl" font-size="15" font-weight="700" fill="#fff">3</text>
    <text x="58" y="36" class="lbl" font-size="14" font-weight="700" fill="#2f5d3a">立場を変えさせる</text>
    <!-- 図：お面3つ -->
    <g transform="translate(26,66)">
      <ellipse cx="22" cy="24" rx="20" ry="24" fill="#f7ede7" stroke="#d97757" stroke-width="1.6"/>
      <circle cx="15" cy="20" r="2" fill="#d97757"/><circle cx="29" cy="20" r="2" fill="#d97757"/>
      <path d="M14 33 q8 -6 16 0" fill="none" stroke="#d97757" stroke-width="2" stroke-linecap="round"/>
      <text x="22" y="62" text-anchor="middle" class="lbl" font-size="9" fill="#5f5847">近隣の人</text>
    </g>
    <g transform="translate(76,66)">
      <ellipse cx="22" cy="24" rx="20" ry="24" fill="#f3f6fb" stroke="#3a6ea5" stroke-width="1.6"/>
      <circle cx="15" cy="20" r="2" fill="#3a6ea5"/><circle cx="29" cy="20" r="2" fill="#3a6ea5"/>
      <path d="M14 32 h16" fill="none" stroke="#3a6ea5" stroke-width="2" stroke-linecap="round"/>
      <text x="22" y="62" text-anchor="middle" class="lbl" font-size="9" fill="#5f5847">当日の職員</text>
    </g>
    <g transform="translate(126,66)">
      <ellipse cx="22" cy="24" rx="20" ry="24" fill="#fdf8e8" stroke="#c9a44a" stroke-width="1.6"/>
      <circle cx="15" cy="20" r="2" fill="#8a6a1a"/><circle cx="29" cy="20" r="2" fill="#8a6a1a"/>
      <path d="M14 34 q8 -5 16 0" fill="none" stroke="#8a6a1a" stroke-width="2" stroke-linecap="round"/>
      <text x="22" y="62" text-anchor="middle" class="lbl" font-size="9" fill="#5f5847">ご家族</text>
    </g>
    <text x="96" y="168" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">反対する人の立場で</text>
    <text x="96" y="185" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">読んでもらう</text>
    <rect x="16" y="204" width="160" height="44" rx="8" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.2"/>
    <text x="96" y="222" text-anchor="middle" class="lbl" font-size="9.5" fill="#7c7360">「この企画に反対する人の</text>
    <text x="96" y="238" text-anchor="middle" class="lbl" font-size="9.5" fill="#7c7360">理由を3つ挙げて」</text>
  </g>
</svg>
