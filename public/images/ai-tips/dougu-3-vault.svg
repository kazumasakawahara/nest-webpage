<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Obsidianの保管庫（Vault）の正体を示す図。左はパソコンの中のふつうのフォルダで、中身は「今日の日記.md」などのただのテキストファイル。右はObsidianで見た同じノートで、ノート同士がリンクの糸でつながり、自分だけの百科事典に育つ">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <text x="24" y="40" class="lbl" font-size="17" font-weight="700" fill="#2f5d3a">保管庫（Vault）の正体は、ただのフォルダ</text>

  <!-- 左：フォルダとファイル -->
  <rect x="24" y="60" width="276" height="230" rx="16" fill="#efe9dd" stroke="#ddd3c1" stroke-width="1.5"/>
  <text x="48" y="94" class="lbl" font-size="14" font-weight="700" fill="#7c7360">パソコンで見ると…</text>

  <!-- フォルダアイコン -->
  <g transform="translate(48,110)">
    <path d="M0 8 a4 4 0 0 1 4 -4 h22 l8 8 h50 a4 4 0 0 1 4 4 v40 a4 4 0 0 1 -4 4 h-80 a4 4 0 0 1 -4 -4 z" fill="#c9a06c" stroke="#b18a58" stroke-width="1.5"/>
    <text x="44" y="40" text-anchor="middle" class="lbl" font-size="11" font-weight="700" fill="#ffffff">わたしのノート</text>
  </g>

  <!-- ファイル一覧 -->
  <g class="lbl" font-size="12" fill="#5f5847">
    <g transform="translate(160,112)">
      <rect x="0" y="0" width="16" height="20" rx="2" fill="#ffffff" stroke="#b7ac97" stroke-width="1.3"/>
      <line x1="4" y1="6" x2="12" y2="6" stroke="#b7ac97" stroke-width="1.3"/>
      <line x1="4" y1="10" x2="12" y2="10" stroke="#b7ac97" stroke-width="1.3"/>
      <text x="24" y="15">今日の日記.md</text>
    </g>
    <g transform="translate(160,142)">
      <rect x="0" y="0" width="16" height="20" rx="2" fill="#ffffff" stroke="#b7ac97" stroke-width="1.3"/>
      <line x1="4" y1="6" x2="12" y2="6" stroke="#b7ac97" stroke-width="1.3"/>
      <line x1="4" y1="10" x2="12" y2="10" stroke="#b7ac97" stroke-width="1.3"/>
      <text x="24" y="15">制度メモ.md</text>
    </g>
    <g transform="translate(160,172)">
      <rect x="0" y="0" width="16" height="20" rx="2" fill="#ffffff" stroke="#b7ac97" stroke-width="1.3"/>
      <line x1="4" y1="6" x2="12" y2="6" stroke="#b7ac97" stroke-width="1.3"/>
      <line x1="4" y1="10" x2="12" y2="10" stroke="#b7ac97" stroke-width="1.3"/>
      <text x="24" y="15">連絡先.md</text>
    </g>
  </g>
  <g class="lbl" font-size="12" fill="#7c7360">
    <g><circle cx="52" cy="222" r="4" fill="#b7ac97"/><text x="66" y="227">中身は、ただの文字ファイル</text></g>
    <g><circle cx="52" cy="250" r="4" fill="#b7ac97"/><text x="66" y="255">メモ帳でも、10年後も開ける</text></g>
  </g>

  <!-- 中央：イコール -->
  <g stroke="#d97757" stroke-width="5" stroke-linecap="round">
    <line x1="312" y1="164" x2="330" y2="164"/>
    <line x1="312" y1="178" x2="330" y2="178"/>
  </g>

  <!-- 右：Obsidianで見ると（リンクの糸） -->
  <rect x="344" y="60" width="276" height="230" rx="16" fill="#eaf2e5" stroke="#bcd7b3" stroke-width="2"/>
  <text x="368" y="94" class="lbl" font-size="14" font-weight="700" fill="#2f5d3a">Obsidianで見ると…</text>

  <!-- リンクグラフ -->
  <g stroke="#8fbf87" stroke-width="2">
    <line x1="452" y1="140" x2="408" y2="196"/>
    <line x1="452" y1="140" x2="512" y2="188"/>
    <line x1="408" y1="196" x2="472" y2="238"/>
    <line x1="512" y1="188" x2="472" y2="238"/>
    <line x1="512" y1="188" x2="568" y2="232"/>
  </g>
  <g class="lbl" font-size="11" font-weight="700">
    <g><circle cx="452" cy="140" r="26" fill="#4a8c3f"/><text x="452" y="144" text-anchor="middle" fill="#ffffff">日記</text></g>
    <g><circle cx="408" cy="196" r="24" fill="#ffffff" stroke="#4a8c3f" stroke-width="2"/><text x="408" y="200" text-anchor="middle" fill="#2f5d3a">制度</text></g>
    <g><circle cx="512" cy="188" r="24" fill="#ffffff" stroke="#4a8c3f" stroke-width="2"/><text x="512" y="192" text-anchor="middle" fill="#2f5d3a">先生</text></g>
    <g><circle cx="472" cy="238" r="24" fill="#ffffff" stroke="#4a8c3f" stroke-width="2"/><text x="472" y="242" text-anchor="middle" fill="#2f5d3a">お薬</text></g>
    <g><circle cx="568" cy="232" r="24" fill="#ffffff" stroke="#4a8c3f" stroke-width="2"/><text x="568" y="236" text-anchor="middle" fill="#2f5d3a">窓口</text></g>
  </g>
  <text x="482" y="282" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#2f5d3a">糸でつながる、自分だけの百科事典</text>
</svg>
