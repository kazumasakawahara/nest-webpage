<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="撮ってAIに見せていいものとダメなものの2分割図。左（OK・緑）は機器のエラー画面、掲示物・回覧、食品の表示ラベル。右（ダメ・赤）は人の顔が写るもの、氏名の書かれた書類、服薬・健康・支援の記録。下に「迷ったら——その写真、事業所の外の人に見せられるか？」の一文">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; }
    </style>
  </defs>

  <rect width="640" height="420" rx="16" fill="#faf6ef"/>
  <text x="320" y="36" text-anchor="middle" class="cap" font-size="19" fill="#2a2620">その写真、AIに見せていい？</text>

  <!-- 左：撮ってOK -->
  <g>
    <rect x="24" y="54" width="288" height="280" rx="14" fill="#eef3e6" stroke="#4a8c3f" stroke-width="2.5"/>
    <circle cx="76" cy="88" r="13" fill="none" stroke="#2d5a27" stroke-width="4"/>
    <text x="98" y="95" class="cap" font-size="18" fill="#2d5a27">撮ってOK</text>

    <!-- 1. 機器のエラー画面 -->
    <g transform="translate(46 122)">
      <rect x="0" y="4" width="40" height="28" rx="4" fill="#faf6ef" stroke="#8a7a5c" stroke-width="2"/>
      <text x="20" y="22" text-anchor="middle" class="cap" font-size="10" fill="#c0492c">E-052</text>
      <text x="54" y="18" class="cap" font-size="15" fill="#2a2620">機器のエラー画面</text>
      <text x="54" y="36" class="cap" font-size="12" fill="#6b6355">コピー機・給湯器・洗濯機…</text>
    </g>
    <!-- 2. 掲示物・回覧 -->
    <g transform="translate(46 186)">
      <rect x="4" y="0" width="30" height="36" rx="2" fill="#ffffff" stroke="#8a7a5c" stroke-width="2"/>
      <circle cx="19" cy="6" r="3" fill="#b85f3d"/>
      <g stroke="#8a7a5c" stroke-width="1.6" stroke-linecap="round">
        <line x1="10" y1="14" x2="28" y2="14"/>
        <line x1="10" y1="20" x2="28" y2="20"/>
        <line x1="10" y1="26" x2="22" y2="26"/>
      </g>
      <text x="54" y="18" class="cap" font-size="15" fill="#2a2620">掲示物・回覧</text>
      <text x="54" y="36" class="cap" font-size="12" fill="#6b6355">手書きでも大丈夫</text>
    </g>
    <!-- 3. 食品の表示ラベル -->
    <g transform="translate(46 250)">
      <rect x="2" y="2" width="36" height="32" fill="#ffffff" stroke="#8a7a5c" stroke-width="2"/>
      <line x1="2" y1="12" x2="38" y2="12" stroke="#8a7a5c" stroke-width="1.4"/>
      <line x1="14" y1="2" x2="14" y2="34" stroke="#8a7a5c" stroke-width="1.4"/>
      <g stroke="#a89f8c" stroke-width="1.4" stroke-linecap="round">
        <line x1="18" y1="18" x2="34" y2="18"/>
        <line x1="18" y1="24" x2="30" y2="24"/>
        <line x1="18" y1="30" x2="34" y2="30"/>
      </g>
      <text x="54" y="18" class="cap" font-size="15" fill="#2a2620">食品の表示ラベル</text>
      <text x="54" y="36" class="cap" font-size="12" fill="#6b6355">原材料・賞味期限の確認に</text>
    </g>
  </g>

  <!-- 右：撮ってはダメ -->
  <g>
    <rect x="328" y="54" width="288" height="280" rx="14" fill="#f9ebe4" stroke="#c0492c" stroke-width="2.5"/>
    <g stroke="#c0492c" stroke-width="4" stroke-linecap="round">
      <line x1="370" y1="77" x2="392" y2="99"/>
      <line x1="392" y1="77" x2="370" y2="99"/>
    </g>
    <text x="404" y="95" class="cap" font-size="18" fill="#c0492c">撮ってはダメ</text>

    <!-- 1. 人の顔が写るもの -->
    <g transform="translate(350 122)">
      <circle cx="20" cy="18" r="15" fill="#f0c9a8" stroke="#8a7a5c" stroke-width="2"/>
      <path d="M5 14 a15 15 0 0 1 30 0 c-8 -6 -22 -6 -30 0 Z" fill="#6b5a48"/>
      <circle cx="14" cy="19" r="2" fill="#2a2620"/>
      <circle cx="26" cy="19" r="2" fill="#2a2620"/>
      <line x1="4" y1="34" x2="36" y2="2" stroke="#c0492c" stroke-width="3.5" stroke-linecap="round"/>
      <text x="54" y="18" class="cap" font-size="15" fill="#2a2620">人の顔が写るもの</text>
      <text x="54" y="36" class="cap" font-size="12" fill="#6b6355">利用者さん・職員・ご家族</text>
    </g>
    <!-- 2. 氏名の書かれた書類 -->
    <g transform="translate(350 186)">
      <rect x="4" y="0" width="30" height="36" rx="2" fill="#ffffff" stroke="#8a7a5c" stroke-width="2"/>
      <rect x="8" y="6" width="22" height="8" fill="#f5c9bb" stroke="#c0492c" stroke-width="1.6"/>
      <text x="19" y="12.5" text-anchor="middle" class="cap" font-size="7" fill="#c0492c">氏名</text>
      <g stroke="#8a7a5c" stroke-width="1.6" stroke-linecap="round">
        <line x1="10" y1="22" x2="28" y2="22"/>
        <line x1="10" y1="28" x2="22" y2="28"/>
      </g>
      <text x="54" y="18" class="cap" font-size="15" fill="#2a2620">氏名の書かれた書類</text>
      <text x="54" y="36" class="cap" font-size="12" fill="#6b6355">名簿・連絡帳・提出書類</text>
    </g>
    <!-- 3. 服薬・健康・支援の記録 -->
    <g transform="translate(350 250)">
      <rect x="6" y="10" width="16" height="24" rx="3" fill="#ffffff" stroke="#8a7a5c" stroke-width="2"/>
      <rect x="4" y="4" width="20" height="8" rx="2" fill="#b85f3d"/>
      <circle cx="14" cy="24" r="4" fill="none" stroke="#c0492c" stroke-width="1.8"/>
      <rect x="26" y="8" width="14" height="26" rx="2" fill="#e8d9b8" stroke="#8a7a5c" stroke-width="1.8"/>
      <line x1="30" y1="8" x2="30" y2="34" stroke="#8a7a5c" stroke-width="1.4"/>
      <text x="54" y="18" class="cap" font-size="15" fill="#2a2620">服薬・健康・支援の記録</text>
      <text x="54" y="36" class="cap" font-size="12" fill="#6b6355">お薬手帳・記録類ぜんぶ</text>
    </g>
  </g>

  <!-- 締めの一文 -->
  <g>
    <rect x="44" y="352" width="552" height="48" rx="12" fill="#ffffff" stroke="#b85f3d" stroke-width="2.5"/>
    <text x="320" y="382" text-anchor="middle" class="cap" font-size="17" fill="#2a2620">迷ったら——「その写真、事業所の外の人に見せられるか？」</text>
  </g>
</svg>
