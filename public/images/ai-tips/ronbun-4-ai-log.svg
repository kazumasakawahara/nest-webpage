<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="ObsidianのAI利用ログのノートを開いた画面のイメージ。表の列は日付・使ったAI・何に使ったか・結果をどうしたか。要約下書き・構成案の壁打ち・引用文献リストの整形の3行が並ぶ。注釈に「使った直後に1行。思い出して書くものではない」とある">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
    <filter id="shl4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#102211" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="620" height="360" rx="16" fill="#ffffff" stroke="#e3d8c4" stroke-width="1.5" filter="url(#shl4)"/>
  <path d="M10 26 a16 16 0 0 1 16 -16 H614 a16 16 0 0 1 16 16 V44 H10 Z" fill="#f3ead9"/>
  <circle cx="34" cy="27" r="6" fill="#e0685a"/>
  <circle cx="54" cy="27" r="6" fill="#e8b64b"/>
  <circle cx="74" cy="27" r="6" fill="#5aa85a"/>
  <text x="320" y="32" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#8a8073">Obsidian — 原稿/AI利用ログ</text>

  <text x="34" y="76" class="lbl" font-size="15" font-weight="700" fill="#2a2620">AI利用ログ</text>

  <!-- 表 -->
  <g>
    <rect x="30" y="92" width="580" height="30" fill="#f3ead9"/>
    <g class="lbl" font-size="11.5" font-weight="700" fill="#55503f">
      <text x="42" y="112">日付</text>
      <text x="100" y="112">使ったAI</text>
      <text x="180" y="112">何に使ったか</text>
      <text x="404" y="112">結果をどうしたか</text>
    </g>
    <rect x="30" y="92" width="580" height="198" fill="none" stroke="#d8cfbd" stroke-width="1.5"/>
    <line x1="30" y1="122" x2="610" y2="122" stroke="#d8cfbd" stroke-width="1.2"/>
    <line x1="30" y1="178" x2="610" y2="178" stroke="#eee6d6" stroke-width="1.2"/>
    <line x1="30" y1="234" x2="610" y2="234" stroke="#eee6d6" stroke-width="1.2"/>
    <line x1="92" y1="92" x2="92" y2="290" stroke="#eee6d6" stroke-width="1.2"/>
    <line x1="172" y1="92" x2="172" y2="290" stroke="#eee6d6" stroke-width="1.2"/>
    <line x1="396" y1="92" x2="396" y2="290" stroke="#eee6d6" stroke-width="1.2"/>

    <g class="lbl" font-size="11.5" fill="#2a2620">
      <text x="42" y="146">5/12</text>
      <text x="100" y="146">Claude</text>
      <text x="180" y="146">文献PDFの要約下書き</text>
      <text x="404" y="146">自分の言葉で書き直して</text>
      <text x="404" y="164">ノート化</text>
    </g>
    <g class="lbl" font-size="11.5" fill="#2a2620">
      <text x="42" y="202">6/03</text>
      <text x="100" y="202">Claude</text>
      <text x="180" y="202">考察の構成案を3案出させ</text>
      <text x="180" y="220">壁打ち</text>
      <text x="404" y="202">案2を参考に自分で再構成</text>
    </g>
    <g class="lbl" font-size="11.5" fill="#2a2620">
      <text x="42" y="258">7/21</text>
      <text x="100" y="258">Gemini</text>
      <text x="180" y="258">引用文献リストの書式整形</text>
      <text x="404" y="258">全件を原典と照合して確認</text>
    </g>
  </g>

  <!-- 注釈 -->
  <g>
    <rect x="160" y="312" width="320" height="42" rx="10" fill="#fff" stroke="#b85f3d" stroke-width="2"/>
    <text x="320" y="338" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#b85f3d">使った直後に1行。思い出して書くものではない</text>
  </g>
</svg>
