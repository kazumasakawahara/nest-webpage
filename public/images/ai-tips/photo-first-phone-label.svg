<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-label="スマホのチャット画面のイラスト。食品の原材料表示ラベルの写真を送り、「アレルギー表示の対象になる品目は入ってる？」と聞くと、AIが小麦・卵・乳成分の3つが入っていると答えている">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <!-- スマホ本体 -->
  <rect x="40" y="10" width="280" height="450" rx="34" fill="#2b3a2c"/>
  <rect x="52" y="22" width="256" height="426" rx="24" fill="#f4efe4"/>

  <!-- 上部バー -->
  <rect x="52" y="22" width="256" height="44" rx="24" fill="#2d5a27"/>
  <rect x="52" y="44" width="256" height="22" fill="#2d5a27"/>
  <circle cx="86" cy="44" r="12" fill="#4a8c3f"/>
  <path d="M81 42 q2 3 5 0 M91 42 q2 3 5 0" stroke="#faf6ef" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M83 50 q4 3 8 0" stroke="#faf6ef" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="106" y="49" class="lbl" font-size="13" fill="#faf6ef">AIさん</text>

  <!-- ① 撮った写真（食品の表示ラベル） -->
  <g>
    <rect x="140" y="78" width="156" height="104" rx="10" fill="#ffffff" stroke="#d8cdb4" stroke-width="2"/>
    <rect x="148" y="86" width="140" height="88" rx="6" fill="#dce4d2"/>
    <!-- ラベルの接写（一括表示の枠） -->
    <rect x="158" y="94" width="120" height="72" fill="#ffffff" stroke="#5f5847" stroke-width="1.6"/>
    <line x1="158" y1="112" x2="278" y2="112" stroke="#5f5847" stroke-width="1.2"/>
    <line x1="158" y1="130" x2="278" y2="130" stroke="#5f5847" stroke-width="1.2"/>
    <line x1="196" y1="94" x2="196" y2="166" stroke="#5f5847" stroke-width="1.2"/>
    <text x="177" y="106" text-anchor="middle" class="lbl" font-size="8" fill="#3d3a33">名称</text>
    <text x="177" y="124" text-anchor="middle" class="lbl" font-size="8" fill="#3d3a33">原材料名</text>
    <!-- 細かい文字の風合い -->
    <g stroke="#8a8271" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M202 104 h60"/>
      <path d="M202 121 h70 M202 126 h52"/>
      <path d="M202 138 h68 M202 144 h72 M202 150 h58 M202 156 h64"/>
      <path d="M164 140 h24 M164 146 h20 M164 152 h24"/>
    </g>
  </g>
  <g>
    <rect x="128" y="70" width="54" height="19" rx="9.5" fill="#b85f3d"/>
    <text x="155" y="83.5" text-anchor="middle" class="lbl" font-size="10.5" fill="#ffffff">① 撮る</text>
  </g>

  <!-- ② ひとこと添えて送る -->
  <g>
    <rect x="100" y="196" width="196" height="46" rx="12" fill="#4a8c3f"/>
    <text x="114" y="215" class="lbl" font-size="11.5" fill="#ffffff">アレルギー表示の対象になる</text>
    <text x="114" y="232" class="lbl" font-size="11.5" fill="#ffffff">品目は入ってる？</text>
  </g>
  <g>
    <rect x="88" y="188" width="54" height="19" rx="9.5" fill="#b85f3d"/>
    <text x="115" y="201.5" text-anchor="middle" class="lbl" font-size="10.5" fill="#ffffff">② 送る</text>
  </g>

  <!-- ③ 返ってくる -->
  <g>
    <rect x="62" y="256" width="212" height="86" rx="12" fill="#ffffff" stroke="#ddd6c6" stroke-width="2"/>
    <text x="76" y="276" class="lbl" font-size="11.5" fill="#3d3a33">入っています。</text>
    <text x="76" y="294" class="lbl" font-size="11.5" fill="#3d3a33">・小麦、卵、乳成分の3つです。</text>
    <text x="76" y="312" class="lbl" font-size="11.5" fill="#3d3a33">えび、かに、そば、落花生の</text>
    <text x="76" y="330" class="lbl" font-size="11.5" fill="#3d3a33">表示は見当たりません。</text>
  </g>
  <g>
    <rect x="56" y="248" width="84" height="19" rx="9.5" fill="#b85f3d"/>
    <text x="98" y="261.5" text-anchor="middle" class="lbl" font-size="10.5" fill="#ffffff">③ 返ってくる</text>
  </g>

  <!-- 入力欄 -->
  <g>
    <rect x="64" y="408" width="232" height="30" rx="15" fill="#ffffff" stroke="#d8cdb4" stroke-width="2"/>
    <circle cx="82" cy="423" r="9" fill="none" stroke="#7a8a6a" stroke-width="2"/>
    <path d="M78 423 h8 M82 419 v8" stroke="#7a8a6a" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="427" class="lbl" font-size="10.5" fill="#9b917e">メッセージ</text>
  </g>
</svg>
