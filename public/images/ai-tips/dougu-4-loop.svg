<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="自分専用データセンターの循環図。あなたが話す→Claudeがノートに書き留める→保管庫にたまる→次に聞いたときClaudeが読んで答える→あなたに返る、という輪。まん中に「使うほど、うちの事情にくわしくなる」">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97757"/>
    </marker>
  </defs>

  <text x="24" y="38" class="lbl" font-size="17" font-weight="700" fill="#2f5d3a">“自分専用データセンター”の回り方</text>

  <!-- 循環矢印 -->
  <g fill="none" stroke="#d97757" stroke-width="3">
    <path d="M212 110 q108 -44 216 -2" marker-end="url(#ar)"/>
    <path d="M496 156 q28 62 -22 122" marker-end="url(#ar)"/>
    <path d="M400 300 q-80 30 -160 0" marker-end="url(#ar)"/>
    <path d="M166 278 q-50 -60 -22 -122" marker-end="url(#ar)"/>
  </g>

  <!-- 上左：あなた -->
  <g transform="translate(96,74)">
    <rect x="0" y="0" width="116" height="64" rx="12" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
    <text x="58" y="27" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#2f5d3a">① あなた</text>
    <text x="58" y="48" text-anchor="middle" class="lbl" font-size="11.5" fill="#7c7360">「今日ね、」と話す</text>
  </g>

  <!-- 上右：Claudeが書く -->
  <g transform="translate(432,74)">
    <rect x="0" y="0" width="128" height="64" rx="12" fill="#eaf2e5" stroke="#bcd7b3" stroke-width="2"/>
    <text x="64" y="27" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#2f5d3a">② Claude</text>
    <text x="64" y="48" text-anchor="middle" class="lbl" font-size="11.5" fill="#4a8c3f">ノートに書き留める</text>
  </g>

  <!-- 下右：保管庫 -->
  <g transform="translate(400,282)">
    <rect x="0" y="0" width="128" height="64" rx="12" fill="#efe9dd" stroke="#ddd3c1" stroke-width="1.5"/>
    <text x="64" y="27" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#7c7360">③ 保管庫</text>
    <text x="64" y="48" text-anchor="middle" class="lbl" font-size="11.5" fill="#9a907c">Obsidianに、たまる</text>
  </g>

  <!-- 下左：Claudeが読む -->
  <g transform="translate(104,282)">
    <rect x="0" y="0" width="128" height="64" rx="12" fill="#eaf2e5" stroke="#bcd7b3" stroke-width="2"/>
    <text x="64" y="27" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#2f5d3a">④ Claude</text>
    <text x="64" y="48" text-anchor="middle" class="lbl" font-size="11.5" fill="#4a8c3f">読んでから、答える</text>
  </g>

  <!-- 中央 -->
  <g transform="translate(228,182)">
    <rect x="0" y="0" width="184" height="56" rx="28" fill="#d97757"/>
    <text x="92" y="24" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#ffffff">使うほど、</text>
    <text x="92" y="43" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#ffffff">うちの事情にくわしくなる</text>
  </g>
</svg>
