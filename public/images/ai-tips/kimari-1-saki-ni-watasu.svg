<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">仕事より先に、職場のきまりの紙を渡す</title>
  <desc id="d">代表マスコットが、AIさん人形に「職場のきまり」と書いた紙を手渡している。紙には「書類は、捨てずに箱へ」「鍵付きの棚は、開けない」「迷ったら、アイデアの箱へ」の三行。AIさん人形は「消さずに、箱へ。わかりました」と答えている。右奥には南京錠のかかった棚があり、札に「開けない」とある。足もとには「くらし」「しごと」「アイデア」の三つの箱が並んでいる。</desc>
  <defs>
    <style>
      .ink{fill:#2b2a27}.mute{fill:#6b6a66}
      .hand{font-family:"Zen Kurenaido","Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
    </style>
    <!-- 代表マスコット（白髪・金縁メガネ・紺フリース。ai-tips の既存挿絵と同じ） -->
    <g id="person"><g transform="translate(0 37) scale(.45)">
    <path d="M-64 250 C-72 302 -18 320 10 302 C-4 326 -66 322 -72 286 Z" fill="#1c2942"/>
    <path d="M64 250 C72 302 18 320 -10 302 C4 326 66 322 72 286 Z" fill="#243654"/>
    <rect x="-14" y="48" width="28" height="22" rx="7" fill="#e6b892"/>
    <path d="M-66 252 C-78 168 -58 80 -18 64 C-8 58 8 58 18 64 C58 80 78 168 66 252 Z" fill="#22314f"/>
    <path d="M-30 70 Q0 56 30 70 L22 98 Q0 84 -22 98 Z" fill="#2c3c5e"/>
    <path d="M-17 78 Q0 68 17 78 L11 100 Q0 92 -11 100 Z" fill="#e9eef5"/>
    <line x1="0" y1="96" x2="0" y2="244" stroke="#33456b" stroke-width="3"/>
    <path d="M-72 6 C-88 -66 -44 -100 0 -100 C44 -100 88 -66 72 6 C64 -6 54 -4 48 8 C40 -8 30 -6 24 8 C16 -8 4 -8 -2 8 C-10 -8 -22 -8 -28 8 C-36 -6 -48 -6 -54 10 C-60 2 -66 2 -72 6 Z" fill="#8c908c"/>
    <circle cx="0" cy="0" r="60" fill="#f0c9a8"/>
    <path d="M-52 -52 C-30 -74 30 -74 52 -50" stroke="#a9ada8" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M-44 -34 C-30 -50 -6 -52 6 -40" stroke="#7d817d" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M46 -30 C34 -46 14 -48 4 -38" stroke="#7d817d" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <circle cx="-38" cy="24" r="10" fill="#e79a78" opacity="0.5"/>
    <circle cx="38" cy="24" r="10" fill="#e79a78" opacity="0.5"/>
    <path d="M-38 6 Q-26 -8 -14 6" stroke="#4a3b2f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M14 6 Q26 -8 38 6" stroke="#4a3b2f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <g stroke="#c9a44a" stroke-width="3.5" fill="#ffffff" fill-opacity="0.14">
      <ellipse cx="-26" cy="6" rx="22" ry="15"/>
      <ellipse cx="26" cy="6" rx="22" ry="15"/>
    </g>
    <path d="M-4 4 Q0 -1 4 4" stroke="#c9a44a" stroke-width="3.5" fill="none"/>
    <line x1="-48" y1="2" x2="-64" y2="-4" stroke="#c9a44a" stroke-width="3"/>
    <line x1="48" y1="2" x2="64" y2="-4" stroke="#c9a44a" stroke-width="3"/>
    <path d="M-26 30 Q0 40 26 30 Q0 68 -26 30 Z" fill="#9e4a3a"/>
    <path d="M-21 32 Q0 40 21 32 Q0 35 -21 32 Z" fill="#faf6ef"/>
    <path d="M-56 132 C-64 178 -32 198 -8 198" fill="none" stroke="#22314f" stroke-width="30" stroke-linecap="round"/>
    <path d="M56 132 C64 178 32 198 8 198" fill="none" stroke="#243654" stroke-width="30" stroke-linecap="round"/>
    <path d="M-17 176 h34 a4 4 0 0 1 4 4 v13 a13 13 0 0 1 -13 13 h-16 a13 13 0 0 1 -13 -13 v-13 a4 4 0 0 1 4 -4 Z" fill="#ffffff" stroke="#d9cfbb" stroke-width="1.5"/>
    <path d="M21 182 a9 9 0 0 1 0 18" fill="none" stroke="#d9cfbb" stroke-width="3"/>
    <ellipse cx="0" cy="180" rx="15" ry="4.5" fill="#8a5a3c"/>
    <circle cx="-12" cy="198" r="13" fill="#f0c9a8"/>
    <circle cx="12" cy="198" r="13" fill="#f0c9a8"/>
  </g></g>
    <g id="robot">
      <ellipse cx="0" cy="156" rx="44" ry="7" fill="#e3d9c3"/>
      <rect x="-34" y="40" width="68" height="104" rx="18" fill="#d97757"/>
      <rect x="-9" y="26" width="18" height="16" rx="4" fill="#6b6a66" stroke="#2b2a27" stroke-width="1.5"/>
      <rect x="-30" y="-30" width="60" height="58" rx="14" fill="#fff" stroke="#2b2a27" stroke-width="2"/>
      <rect x="-22" y="-20" width="44" height="34" rx="8" fill="#2b2a27"/>
      <circle cx="-9" cy="-4" r="5" fill="#8fe3a3"/>
      <circle cx="9" cy="-4" r="5" fill="#8fe3a3"/>
      <path d="M-8 6 q8 5 16 0" stroke="#8fe3a3" stroke-width="2" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="0" y2="-44" stroke="#2b2a27" stroke-width="2"/>
      <circle cx="0" cy="-48" r="5" fill="#d97757" stroke="#2b2a27" stroke-width="2"/>
      <path d="M-12 44 l10 6 l-10 6Z M12 44 l-10 6 l10 6Z" fill="#2b2a27"/>
    </g>
  </defs>
  <rect width="640" height="400" fill="#f7f1e3"/>
  <path d="M0 376 H640" stroke="#e3d9c3" stroke-width="2"/>

  <!-- 鍵付きの棚 -->
  <g>
    <rect x="532" y="52" width="88" height="150" rx="6" fill="#c9b48e" stroke="#2b2a27" stroke-width="2"/>
    <line x1="576" y1="56" x2="576" y2="198" stroke="#2b2a27" stroke-width="2"/>
    <circle cx="570" cy="128" r="3" fill="#2b2a27"/><circle cx="582" cy="128" r="3" fill="#2b2a27"/>
    <path d="M568 138 v-10 a8 8 0 0 1 16 0 v10" fill="none" stroke="#6b6a66" stroke-width="4"/>
    <rect x="562" y="136" width="28" height="22" rx="4" fill="#e0b84a" stroke="#2b2a27" stroke-width="2"/>
    <circle cx="576" cy="146" r="3" fill="#2b2a27"/>
    <g transform="rotate(4 576 82)">
      <rect x="546" y="68" width="60" height="28" rx="4" fill="#fff" stroke="#2b2a27" stroke-width="1.5"/>
      <text x="576" y="88" class="hand" font-size="14" font-weight="700" fill="#b23a2a" text-anchor="middle">開けない</text>
    </g>
    <text x="576" y="220" class="hand mute" font-size="13" text-anchor="middle">鍵付きの棚</text>
  </g>

  <!-- 三つの箱 -->
  <g class="hand" font-size="13" font-weight="700" text-anchor="middle">
    <g transform="translate(430 300)">
      <path d="M0 8 h56 v62 h-56Z" fill="#e8c58f" stroke="#2b2a27" stroke-width="2"/>
      <path d="M-4 0 h64 v10 h-64Z" fill="#d9b37a" stroke="#2b2a27" stroke-width="2"/>
      <text x="28" y="46" class="ink">くらし</text>
    </g>
    <g transform="translate(498 300)">
      <path d="M0 8 h56 v62 h-56Z" fill="#e8c58f" stroke="#2b2a27" stroke-width="2"/>
      <path d="M-4 0 h64 v10 h-64Z" fill="#d9b37a" stroke="#2b2a27" stroke-width="2"/>
      <text x="28" y="46" class="ink">しごと</text>
    </g>
    <g transform="translate(566 300)">
      <path d="M0 8 h56 v62 h-56Z" fill="#e8c58f" stroke="#2b2a27" stroke-width="2"/>
      <path d="M-4 0 h64 v10 h-64Z" fill="#d9b37a" stroke="#2b2a27" stroke-width="2"/>
      <text x="28" y="40" class="ink" font-size="12">アイデア</text>
      <text x="28" y="58" class="mute" font-size="11" font-weight="400">迷ったら</text>
    </g>
  </g>

  <!-- 代表マスコット -->
  <g transform="translate(96 236) scale(.8)"><use href="#person"/></g>

  <!-- きまりの紙 -->
  <g transform="rotate(-3 240 150)">
    <rect x="130" y="58" width="214" height="168" rx="6" fill="#fffdf7" stroke="#2b2a27" stroke-width="2"/>
    <text x="237" y="90" class="hand ink" font-size="19" font-weight="700" text-anchor="middle">職場のきまり</text>
    <line x1="150" y1="102" x2="324" y2="102" stroke="#d97757" stroke-width="2"/>
    <g class="hand ink" font-size="13">
      <text x="146" y="132">一、書類は、捨てずに箱へ</text>
      <text x="146" y="166">一、鍵付きの棚は、開けない</text>
      <text x="146" y="200">一、迷ったら、アイデアの箱へ</text>
    </g>
  </g>
  <!-- 紙を持つ手 -->
  <circle cx="140" cy="220" r="10" fill="#f0c9a8" stroke="#2b2a27" stroke-width="1"/>

  <!-- AIさん人形 -->
  <g transform="translate(392 262) scale(.78)"><use href="#robot"/></g>
  <path d="M362 296 q-14 -16 -26 -64" stroke="#d97757" stroke-width="9" stroke-linecap="round" fill="none"/>
  <g transform="translate(358 132)">
    <rect x="0" y="0" width="150" height="58" rx="14" fill="#fff" stroke="#2b2a27" stroke-width="2"/>
    <path d="M30 58 l2 14 l12 -14Z" fill="#fff" stroke="#2b2a27" stroke-width="2"/>
    <path d="M31 58 h12" stroke="#fff" stroke-width="3"/>
    <text x="75" y="25" class="hand ink" font-size="14" text-anchor="middle">消さずに、箱へ。</text>
    <text x="75" y="46" class="hand ink" font-size="14" text-anchor="middle">わかりました</text>
  </g>

  <text x="24" y="394" class="hand mute" font-size="13">してほしいことより先に、してはいけないことを渡す</text>
</svg>
