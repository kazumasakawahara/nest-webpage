<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="2つのクセの対比図。左「事実の誤り」：AIさんが締切を「3月31日です」と言い切るが実際は違う。知らないのに言い切る。防ぎ方は答え合わせ。右「迎合」：AIさんは心の中で「駐車場が足りない……」と思いながら、口では「素晴らしい！」と言う。知っているのに言わない。防ぎ方は頼み方">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
    <g id="bot">
      <line x1="20" y1="8" x2="20" y2="2" stroke="#2f5d3a" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="20" cy="0" r="3" fill="#ffd15c"/>
      <rect x="2" y="8" width="36" height="28" rx="9" fill="#faf6ef" stroke="#2f5d3a" stroke-width="2"/>
      <rect x="10" y="15" width="20" height="14" rx="5" fill="#1f3a26"/>
      <circle cx="16" cy="22" r="2.6" fill="#8fe0b0"/>
      <circle cx="24" cy="22" r="2.6" fill="#8fe0b0"/>
    </g>
  </defs>

  <!-- 左パネル：事実の誤り -->
  <rect x="14" y="14" width="296" height="292" rx="16" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
  <rect x="14" y="14" width="296" height="40" rx="16" fill="#efe9dd"/><rect x="14" y="42" width="296" height="12" fill="#efe9dd"/>
  <text x="162" y="40" text-anchor="middle" class="lbl" font-size="14" font-weight="700" fill="#7c7360">クセ① 事実の誤り</text>

  <use href="#bot" x="40" y="90"/>
  <rect x="96" y="78" width="192" height="48" rx="10" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
  <path d="M96 102 l-8 6 l8 6 z" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
  <text x="192" y="98" text-anchor="middle" class="lbl" font-size="12" fill="#2a2620">申請の締切は</text>
  <text x="192" y="116" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#2a2620">3月31日です！</text>
  <!-- 実際は違う -->
  <g transform="translate(236,130)">
    <circle cx="14" cy="14" r="13" fill="#f7ede7" stroke="#d97757" stroke-width="2"/>
    <path d="M8 8 l12 12 M20 8 l-12 12" stroke="#d97757" stroke-width="2.6" stroke-linecap="round"/>
    <text x="14" y="44" text-anchor="middle" class="lbl" font-size="10" fill="#b0492c">実際は違う</text>
  </g>

  <text x="162" y="204" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#5f5847">知らないのに、言い切る</text>
  <rect x="54" y="228" width="216" height="48" rx="10" fill="#efe9dd"/>
  <text x="162" y="248" text-anchor="middle" class="lbl" font-size="11" fill="#7c7360">防ぎ方</text>
  <text x="162" y="266" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#5f5847">答え合わせ（公式で確かめる）</text>
  <text x="162" y="296" text-anchor="middle" class="lbl" font-size="10" fill="#9a907c">→「自信満々にまちがえる」の回</text>

  <!-- 右パネル：迎合 -->
  <rect x="330" y="14" width="296" height="292" rx="16" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
  <rect x="330" y="14" width="296" height="40" rx="16" fill="#f7ede7"/><rect x="330" y="42" width="296" height="12" fill="#f7ede7"/>
  <text x="478" y="40" text-anchor="middle" class="lbl" font-size="14" font-weight="700" fill="#b8543a">クセ② 迎合（おべっか）</text>

  <use href="#bot" x="356" y="118"/>
  <!-- 心の中（雲・タイトル帯の下） -->
  <g>
    <ellipse cx="508" cy="82" rx="86" ry="20" fill="#eef3e6" stroke="#bcd7b3" stroke-width="1.5"/>
    <circle cx="418" cy="104" r="4" fill="#eef3e6" stroke="#bcd7b3" stroke-width="1.5"/>
    <circle cx="406" cy="114" r="2.5" fill="#eef3e6" stroke="#bcd7b3" stroke-width="1.5"/>
    <text x="508" y="86" text-anchor="middle" class="lbl" font-size="10.5" fill="#2f5d3a">（駐車場、足りないのでは……）</text>
  </g>
  <!-- 口では -->
  <rect x="412" y="114" width="192" height="48" rx="10" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
  <path d="M412 138 l-8 6 l8 6 z" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
  <text x="508" y="134" text-anchor="middle" class="lbl" font-size="12" fill="#2a2620">口では……</text>
  <text x="508" y="152" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#2a2620">素晴らしい企画ですね！</text>

  <text x="478" y="204" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#b8543a">知っているのに、言わない</text>
  <rect x="370" y="228" width="216" height="48" rx="10" fill="#f7ede7"/>
  <text x="478" y="248" text-anchor="middle" class="lbl" font-size="11" fill="#b0492c">防ぎ方</text>
  <text x="478" y="266" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#b8543a">頼み方（遠慮なく言って）</text>
  <text x="478" y="296" text-anchor="middle" class="lbl" font-size="10" fill="#9a907c">→ 今日の話はこちら</text>
</svg>
