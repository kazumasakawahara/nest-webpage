<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="対比図。左は1体のAIが賛成のお面と反対のお面を持ち替えて演じ、5分できれいにまとまってしまう一人芝居の様子。右は円卓に複数の席が並び、それぞれが「白旗を上げる条件」を書いた封筒を持っている様子">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <!-- ===== 左パネル：一人芝居 ===== -->
  <rect x="14" y="14" width="292" height="292" rx="16" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
  <rect x="14" y="14" width="292" height="40" rx="16" fill="#f7ede7"/>
  <rect x="14" y="42" width="292" height="12" fill="#f7ede7"/>
  <text x="160" y="40" text-anchor="middle" class="lbl" font-size="14" font-weight="700" fill="#b8543a">ふつうに頼むと ── 一人芝居</text>

  <!-- AI本体 -->
  <g transform="translate(140,86)">
    <line x1="20" y1="8" x2="20" y2="2" stroke="#2f5d3a" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="20" cy="0" r="3" fill="#ffd15c"/>
    <rect x="2" y="8" width="36" height="28" rx="9" fill="#faf6ef" stroke="#2f5d3a" stroke-width="2"/>
    <rect x="10" y="15" width="20" height="14" rx="5" fill="#1f3a26"/>
    <circle cx="16" cy="22" r="2.6" fill="#8fe0b0"/>
    <circle cx="24" cy="22" r="2.6" fill="#8fe0b0"/>
  </g>

  <!-- 賛成のお面 -->
  <g transform="translate(58,110)">
    <ellipse cx="30" cy="26" rx="28" ry="30" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="2"/>
    <circle cx="21" cy="21" r="2.6" fill="#4a8c3f"/>
    <circle cx="39" cy="21" r="2.6" fill="#4a8c3f"/>
    <path d="M19 33 q11 9 22 0" fill="none" stroke="#4a8c3f" stroke-width="2.4" stroke-linecap="round"/>
    <text x="30" y="72" text-anchor="middle" class="lbl" font-size="12.5" font-weight="700" fill="#4a8c3f">賛成のお面</text>
  </g>

  <!-- 反対のお面 -->
  <g transform="translate(194,110)">
    <ellipse cx="30" cy="26" rx="28" ry="30" fill="#f7ede7" stroke="#d97757" stroke-width="2"/>
    <circle cx="21" cy="21" r="2.6" fill="#d97757"/>
    <circle cx="39" cy="21" r="2.6" fill="#d97757"/>
    <path d="M19 36 q11 -9 22 0" fill="none" stroke="#d97757" stroke-width="2.4" stroke-linecap="round"/>
    <text x="30" y="72" text-anchor="middle" class="lbl" font-size="12.5" font-weight="700" fill="#d97757">反対のお面</text>
  </g>

  <!-- 持ち替えの矢印 -->
  <path d="M120 128 q40 -22 80 0" fill="none" stroke="#b7ac97" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="160" y="106" text-anchor="middle" class="lbl" font-size="10.5" fill="#9a907c">持ち替えているだけ</text>

  <!-- 結末バナー -->
  <rect x="34" y="216" width="252" height="72" rx="12" fill="#faf6ef" stroke="#e8c0ae" stroke-width="1.5"/>
  <text x="160" y="242" text-anchor="middle" class="lbl" font-size="12.5" font-weight="700" fill="#5f5847">「なるほど、おっしゃるとおりですね」</text>
  <text x="160" y="264" text-anchor="middle" class="lbl" font-size="12" fill="#b8543a">5分で、円満に、まとまってしまう</text>
  <text x="160" y="281" text-anchor="middle" class="lbl" font-size="10.5" fill="#9a907c">なぜ折れたのか、あとから確かめられない</text>

  <!-- ===== 右パネル：なれ合えない会議 ===== -->
  <rect x="334" y="14" width="292" height="292" rx="16" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
  <rect x="334" y="14" width="292" height="40" rx="16" fill="#eaf2e5"/>
  <rect x="334" y="42" width="292" height="12" fill="#eaf2e5"/>
  <text x="480" y="40" text-anchor="middle" class="lbl" font-size="14" font-weight="700" fill="#2f5d3a">仕掛けを入れると ── 会議になる</text>

  <!-- 円卓 -->
  <ellipse cx="480" cy="168" rx="86" ry="58" fill="#faf6ef" stroke="#bcd7b3" stroke-width="2"/>
  <text x="480" y="163" text-anchor="middle" class="lbl" font-size="11.5" font-weight="700" fill="#4a8c3f">議論の前に</text>
  <text x="480" y="181" text-anchor="middle" class="lbl" font-size="11.5" font-weight="700" fill="#4a8c3f">全員が封をする</text>

  <!-- 席（封筒つき） -->
  <g fill="#ffffff" stroke="#7c7360" stroke-width="1.6">
    <rect x="466" y="76" width="28" height="20" rx="3"/>
    <rect x="558" y="118" width="28" height="20" rx="3"/>
    <rect x="558" y="198" width="28" height="20" rx="3"/>
    <rect x="466" y="240" width="28" height="20" rx="3"/>
    <rect x="374" y="198" width="28" height="20" rx="3"/>
    <rect x="374" y="118" width="28" height="20" rx="3"/>
  </g>
  <g fill="none" stroke="#d97757" stroke-width="1.6">
    <path d="M466 76 l14 11 14 -11"/>
    <path d="M558 118 l14 11 14 -11"/>
    <path d="M558 198 l14 11 14 -11"/>
    <path d="M466 240 l14 11 14 -11"/>
    <path d="M374 198 l14 11 14 -11"/>
    <path d="M374 118 l14 11 14 -11"/>
  </g>

  <!-- 空席 -->
  <rect x="466" y="240" width="28" height="20" rx="3" fill="#ffffff" stroke="#7c7360" stroke-width="1.6"/>
  <path d="M466 240 l14 11 14 -11" fill="none" stroke="#d97757" stroke-width="1.6"/>

  <text x="480" y="284" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#2f5d3a">封筒＝「白旗を上げる条件」</text>
  <text x="480" y="300" text-anchor="middle" class="lbl" font-size="10.5" fill="#4a8c3f">意見を変えたら、封を開けて照らし合わせる</text>
</svg>
