<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="AIさんが集めた反論のカードが机に並び、それを読んだ人が最後に「決」の判を押している図。反論を集めるのはAI、決めるのは人">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <text x="24" y="34" class="lbl" font-size="17" font-weight="700" fill="#2f5d3a">反論を集めるのはAI。仕分けて、決めるのは人</text>

  <!-- 机 -->
  <rect x="20" y="236" width="600" height="44" rx="8" fill="#a5825c"/>
  <rect x="20" y="230" width="600" height="10" rx="5" fill="#c2a078"/>

  <!-- AIさん（左） -->
  <g transform="translate(52 96)">
    <rect x="0" y="0" width="68" height="58" rx="14" fill="#2d5a27"/>
    <line x1="34" y1="-10" x2="34" y2="0" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="34" cy="-14" r="5" fill="#d97757"/>
    <path d="M14 24 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M42 24 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M24 42 q10 6 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <rect x="8" y="64" width="52" height="42" rx="10" fill="#4a8c3f" opacity="0.9"/>
    <!-- 差し出す手 -->
    <path d="M60 80 q30 -4 48 14" fill="none" stroke="#4a8c3f" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="86" y="76" text-anchor="middle" class="lbl" font-size="11" fill="#2f5d3a">集めました</text>

  <!-- 反論カード×3 -->
  <g transform="translate(170,128) rotate(-4)">
    <rect width="122" height="90" rx="6" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
    <rect x="8" y="8" width="46" height="16" rx="4" fill="#d97757"/>
    <text x="31" y="20" text-anchor="middle" class="lbl" font-size="9.5" font-weight="700" fill="#fff">反論①</text>
    <text x="12" y="46" class="lbl" font-size="10.5" fill="#2a2620">駐車場12台では</text>
    <text x="12" y="62" class="lbl" font-size="10.5" fill="#2a2620">路上駐車が起きる</text>
    <!-- 本当に困る -->
    <circle cx="104" cy="76" r="9" fill="#fdf1ec" stroke="#d97757" stroke-width="1.5"/>
    <text x="104" y="80" text-anchor="middle" class="lbl" font-size="10" font-weight="700" fill="#b0492c">！</text>
  </g>
  <g transform="translate(304,124)">
    <rect width="122" height="90" rx="6" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
    <rect x="8" y="8" width="46" height="16" rx="4" fill="#d97757"/>
    <text x="31" y="20" text-anchor="middle" class="lbl" font-size="9.5" font-weight="700" fill="#fff">反論②</text>
    <text x="12" y="46" class="lbl" font-size="10.5" fill="#2a2620">雨天時の屋内の</text>
    <text x="12" y="62" class="lbl" font-size="10.5" fill="#2a2620">収容人数が不明</text>
    <circle cx="104" cy="76" r="9" fill="#fdf1ec" stroke="#d97757" stroke-width="1.5"/>
    <text x="104" y="80" text-anchor="middle" class="lbl" font-size="10" font-weight="700" fill="#b0492c">！</text>
  </g>
  <g transform="translate(438,130) rotate(3)">
    <rect width="122" height="90" rx="6" fill="#ffffff" stroke="#ddd3c1" stroke-width="2"/>
    <rect x="8" y="8" width="46" height="16" rx="4" fill="#b7ac97"/>
    <text x="31" y="20" text-anchor="middle" class="lbl" font-size="9.5" font-weight="700" fill="#fff">反論③</text>
    <text x="12" y="46" class="lbl" font-size="10.5" fill="#5f5847">看板の文字が</text>
    <text x="12" y="62" class="lbl" font-size="10.5" fill="#5f5847">やや小さい</text>
    <text x="104" y="80" text-anchor="middle" class="lbl" font-size="9" fill="#9a907c">程度の話</text>
  </g>

  <!-- 判を押す手 -->
  <g transform="translate(560,46)">
    <!-- 腕 -->
    <path d="M30 0 q-10 40 -20 70" fill="none" stroke="#22314f" stroke-width="22" stroke-linecap="round"/>
    <circle cx="8" cy="78" r="14" fill="#f0c9a8"/>
    <!-- はんこ -->
    <rect x="-2" y="86" width="20" height="26" rx="4" fill="#b85f3d"/>
  </g>
  <!-- 決の判 -->
  <g transform="translate(548,160)">
    <circle cx="20" cy="20" r="19" fill="none" stroke="#c0392b" stroke-width="2.5" opacity="0.9"/>
    <text x="20" y="27" text-anchor="middle" class="lbl" font-size="17" font-weight="700" fill="#c0392b" opacity="0.9">決</text>
  </g>

  <text x="320" y="268" text-anchor="middle" class="lbl" font-size="12" fill="#faf6ef">「！」は当日本当に困ること。「程度の話」は、あとで</text>
</svg>
