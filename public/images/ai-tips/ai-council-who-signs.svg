<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="AIが議事録の束を差し出し、人間がそれを受け取って印を押している図。議事録はAIが書ける、ハンコは人間が押す、という役割分担を示している">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
    <marker id="arw2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b7ac97"/>
    </marker>
  </defs>

  <text x="24" y="34" class="lbl" font-size="16" font-weight="700" fill="#2f5d3a">役割分担 ── 書くのはAI、決めるのは人間</text>

  <!-- 左：AI -->
  <rect x="24" y="56" width="222" height="196" rx="16" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
  <g transform="translate(112,84)">
    <line x1="22" y1="10" x2="22" y2="3" stroke="#2f5d3a" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="22" cy="0" r="3.4" fill="#ffd15c"/>
    <rect x="1" y="10" width="42" height="32" rx="10" fill="#faf6ef" stroke="#2f5d3a" stroke-width="2.2"/>
    <rect x="10" y="18" width="24" height="16" rx="6" fill="#1f3a26"/>
    <circle cx="17" cy="26" r="3" fill="#8fe0b0"/>
    <circle cx="27" cy="26" r="3" fill="#8fe0b0"/>
  </g>
  <text x="135" y="160" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#2f5d3a">AIができること</text>
  <text x="135" y="184" text-anchor="middle" class="lbl" font-size="11.5" fill="#5f5847">論点を割る／反対意見を残す</text>
  <text x="135" y="204" text-anchor="middle" class="lbl" font-size="11.5" fill="#5f5847">調べる順番をつける</text>
  <text x="135" y="230" text-anchor="middle" class="lbl" font-size="11" fill="#9a907c">＝ 会議の下ごしらえ</text>

  <!-- 議事録の受け渡し -->
  <g transform="translate(270,120)">
    <rect x="0" y="6" width="52" height="66" rx="5" fill="#ffffff" stroke="#7c7360" stroke-width="2"/>
    <rect x="6" y="0" width="52" height="66" rx="5" fill="#ffffff" stroke="#4a8c3f" stroke-width="2.2"/>
    <line x1="14" y1="14" x2="50" y2="14" stroke="#4a8c3f" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="26" x2="50" y2="26" stroke="#bcd7b3" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="38" x2="50" y2="38" stroke="#bcd7b3" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="50" x2="38" y2="50" stroke="#bcd7b3" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="300" y="112" text-anchor="middle" class="lbl" font-size="11" font-weight="700" fill="#9a907c">議事録</text>
  <line x1="252" y1="154" x2="266" y2="154" stroke="#b7ac97" stroke-width="2.5" marker-end="url(#arw2)"/>
  <line x1="336" y1="154" x2="384" y2="154" stroke="#b7ac97" stroke-width="2.5" marker-end="url(#arw2)"/>

  <!-- 右：人間 -->
  <rect x="394" y="56" width="222" height="196" rx="16" fill="#eaf2e5" stroke="#bcd7b3" stroke-width="2"/>
  <g transform="translate(486,84)">
    <circle cx="22" cy="14" r="14" fill="#faf6ef" stroke="#2f5d3a" stroke-width="2.2"/>
    <path d="M4 44 q18 -18 36 0" fill="#faf6ef" stroke="#2f5d3a" stroke-width="2.2"/>
  </g>
  <!-- ハンコ -->
  <g transform="translate(546,108)">
    <rect x="0" y="0" width="20" height="12" rx="3" fill="#d97757"/>
    <rect x="5" y="12" width="10" height="14" fill="#b8543a"/>
    <circle cx="10" cy="34" r="11" fill="none" stroke="#d97757" stroke-width="2.6"/>
    <text x="10" y="39" text-anchor="middle" class="lbl" font-size="11" font-weight="700" fill="#d97757">決</text>
  </g>
  <text x="505" y="160" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#2f5d3a">人間にしかできないこと</text>
  <text x="505" y="184" text-anchor="middle" class="lbl" font-size="11.5" fill="#5f5847">制約を決める／責任を負う</text>
  <text x="505" y="204" text-anchor="middle" class="lbl" font-size="11.5" fill="#5f5847">ご本人の意思を、実際に確かめる</text>
  <text x="505" y="230" text-anchor="middle" class="lbl" font-size="11" font-weight="700" fill="#4a8c3f">＝ 決めること</text>

  <!-- 下部の帯 -->
  <rect x="24" y="264" width="592" height="26" rx="8" fill="#faf6ef" stroke="#e8c0ae" stroke-width="1.5"/>
  <text x="320" y="282" text-anchor="middle" class="lbl" font-size="12.5" font-weight="700" fill="#b8543a">越えてはいけない線 ── ご本人の席に座らせない／専門の判断をさせない／決裁の代わりにしない</text>
</svg>
