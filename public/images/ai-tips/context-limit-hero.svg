<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="書き込みでぎゅうぎゅうになったホワイトボードの前で、汗をかいたAIさんが「えっと……どちらの事業所でしたっけ」と言い、企画書を持った人が「最初に言ったのに……」と困っている図">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; }
      .lbl { font-family: system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif; }
    </style>
  </defs>

  <rect width="640" height="360" rx="16" fill="#faf6ef"/>

  <!-- ホワイトボード（ぎゅうぎゅう） -->
  <g transform="translate(200 70)">
    <rect x="-6" y="-6" width="312" height="212" rx="8" fill="#d8cdb4"/>
    <rect x="0" y="0" width="300" height="200" rx="4" fill="#ffffff" stroke="#8a7a5c" stroke-width="3"/>
    <!-- 上段：薄れた最初の前提 -->
    <g class="lbl" font-size="10" fill="#2a2620" opacity="0.22">
      <text x="10" y="18">事業所は〇〇　参加40名　駐車場12台</text>
      <text x="10" y="32">雨天決行　会場はデイルーム　出演3組</text>
    </g>
    <!-- 中段：ぎっしりの線 -->
    <g stroke="#3a6ea5" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
      <line x1="10" y1="46" x2="290" y2="46"/><line x1="10" y1="56" x2="250" y2="56"/>
      <line x1="10" y1="66" x2="284" y2="66"/><line x1="10" y1="76" x2="200" y2="76"/>
      <line x1="10" y1="86" x2="292" y2="86"/><line x1="10" y1="96" x2="262" y2="96"/>
    </g>
    <g stroke="#b85f3d" stroke-width="2.2" stroke-linecap="round" opacity="0.6">
      <line x1="10" y1="110" x2="240" y2="110"/><line x1="10" y1="120" x2="288" y2="120"/>
      <line x1="10" y1="130" x2="170" y2="130"/><line x1="10" y1="140" x2="280" y2="140"/>
    </g>
    <g stroke="#2a2620" stroke-width="2.4" stroke-linecap="round">
      <line x1="10" y1="156" x2="270" y2="156"/><line x1="10" y1="168" x2="292" y2="168"/>
      <line x1="10" y1="180" x2="230" y2="180"/><line x1="10" y1="190" x2="286" y2="190"/>
    </g>
    <!-- はみ出し -->
    <text x="0" y="232" class="lbl" font-size="11" font-weight="700" fill="#b85f3d">3週間ぶん、びっしり</text>
    <!-- ペン置き -->
    <rect x="90" y="200" width="120" height="8" rx="3" fill="#8a7a5c"/>
  </g>

  <!-- 人（左）：トップページのマスコット。困り顔 -->
  <g transform="translate(96,176) scale(0.35)">
    <path d="M-64 250 C-72 302 -18 320 10 302 C-4 326 -66 322 -72 286 Z" fill="#1c2942"/>
    <path d="M64 250 C72 302 18 320 -10 302 C4 326 66 322 72 286 Z" fill="#243654"/>
    <rect x="-14" y="48" width="28" height="22" rx="7" fill="#e6b892"/>
    <path d="M-66 252 C-78 168 -58 80 -18 64 C-8 58 8 58 18 64 C58 80 78 168 66 252 Z" fill="#22314f"/>
    <path d="M-30 70 Q0 56 30 70 L22 98 Q0 84 -22 98 Z" fill="#2c3c5e"/>
    <path d="M-17 78 Q0 68 17 78 L11 100 Q0 92 -11 100 Z" fill="#e9eef5"/>
    <line x1="0" y1="96" x2="0" y2="244" stroke="#33456b" stroke-width="3"/>
    <path d="M-72 6 C-88 -66 -44 -100 0 -100 C44 -100 88 -66 72 6 C64 -6 54 -4 48 8 C40 -8 30 -6 24 8 C16 -8 4 -8 -2 8 C-10 -8 -22 -8 -28 8 C-36 -6 -48 -6 -54 10 C-60 2 -66 2 -72 6 Z" fill="#8c908c"/>
    <circle cx="0" cy="0" r="60" fill="#f0c9a8"/>
    <path d="M-52 -52 C-30 -74 30 -74 52 -50" stroke="#a9ada8" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="-38" cy="24" r="10" fill="#e79a78" opacity="0.5"/>
    <circle cx="38" cy="24" r="10" fill="#e79a78" opacity="0.5"/>
    <!-- 困り眉 -->
    <path d="M-40 -16 Q-26 -8 -14 -14" stroke="#4a3b2f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M14 -14 Q26 -8 40 -16" stroke="#4a3b2f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="-26" cy="8" r="6" fill="#4a3b2f"/>
    <circle cx="26" cy="8" r="6" fill="#4a3b2f"/>
    <g stroke="#c9a44a" stroke-width="3.5" fill="#ffffff" fill-opacity="0.14">
      <ellipse cx="-26" cy="6" rx="22" ry="15"/>
      <ellipse cx="26" cy="6" rx="22" ry="15"/>
    </g>
    <path d="M-4 4 Q0 -1 4 4" stroke="#c9a44a" stroke-width="3.5" fill="none"/>
    <line x1="-48" y1="2" x2="-64" y2="-4" stroke="#c9a44a" stroke-width="3"/>
    <line x1="48" y1="2" x2="64" y2="-4" stroke="#c9a44a" stroke-width="3"/>
    <path d="M-12 42 Q0 36 12 42" stroke="#9e4a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 腕：企画書を持つ -->
    <path d="M-56 132 C-64 178 -32 198 -8 198" fill="none" stroke="#22314f" stroke-width="30" stroke-linecap="round"/>
    <path d="M56 132 C64 178 32 198 8 198" fill="none" stroke="#243654" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(-34 150) rotate(-6)">
      <rect width="70" height="60" rx="4" fill="#ffffff" stroke="#8a7a5c" stroke-width="4"/>
      <line x1="10" y1="16" x2="58" y2="16" stroke="#b8b2a4" stroke-width="5"/>
      <line x1="10" y1="30" x2="50" y2="30" stroke="#b8b2a4" stroke-width="5"/>
      <line x1="10" y1="44" x2="56" y2="44" stroke="#b8b2a4" stroke-width="5"/>
    </g>
    <circle cx="-12" cy="198" r="13" fill="#f0c9a8"/>
    <circle cx="12" cy="198" r="13" fill="#f0c9a8"/>
  </g>
  <!-- 人のふきだし -->
  <g>
    <rect x="22" y="30" width="172" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M92 70 l8 12 l4 -12 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="108" y="56" text-anchor="middle" class="cap" font-size="17" fill="#2a2620">最初に言ったのに……</text>
  </g>

  <!-- AIさん（右）：汗だく -->
  <g transform="translate(548 206)">
    <rect x="-34" y="0" width="68" height="58" rx="14" fill="#2d5a27"/>
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-14" r="5" fill="#d97757"/>
    <!-- 目（ぐるぐる気味） -->
    <path d="M-20 22 q6 -6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 22 q6 -6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 42 q10 -6 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <rect x="-26" y="64" width="52" height="42" rx="10" fill="#4a8c3f" opacity="0.9"/>
    <!-- 汗 -->
    <g fill="#3a6ea5">
      <path d="M42 6 q6 10 0 14 q-6 -4 0 -14 z"/>
      <path d="M-44 18 q6 10 0 14 q-6 -4 0 -14 z"/>
      <path d="M46 40 q5 8 0 12 q-5 -4 0 -12 z"/>
    </g>
  </g>
  <!-- AIのふきだし -->
  <g>
    <rect x="346" y="294" width="282" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M540 294 l6 -12 l8 12 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <rect x="534" y="292" width="22" height="4" fill="#ffffff"/>
    <text x="487" y="320" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">えっと……どちらの事業所でしたっけ</text>
  </g>
</svg>
