<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="信頼できる倉庫をつくる3つの規律の図。①原本の棚（raw）：消さない・書き換えない。家計簿をつけたあとも領収書は捨てない。②整理棚：型に流し込む。おくすり手帳のように書く欄を決める。③点検の札：記録に賞味期限。出どころと日付を添え、月に一度棚卸しする">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <text x="24" y="44" class="lbl" font-size="18" font-weight="700" fill="#2f5d3a">“信頼できる倉庫”をつくる、3つの規律</text>

  <rect x="24" y="68" width="592" height="72" rx="14" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
  <circle cx="58" cy="104" r="14" fill="#d97757"/>
  <text x="58" y="109" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#ffffff">1</text>
  <text x="90" y="99" class="lbl" font-size="14.5" font-weight="700" fill="#2f5d3a">原本の棚 ― 消さない・書き換えない</text>
  <text x="90" y="121" class="lbl" font-size="12.5" fill="#7c7360">家計簿をつけたあとも、領収書は捨てない。要約は“解釈”、原本が命綱</text>
  <g transform="translate(556,86)">
    <path d="M0 8 a3 3 0 0 1 3 -3 h12 l5 5 h20 a3 3 0 0 1 3 3 v22 a3 3 0 0 1 -3 3 h-37 a3 3 0 0 1 -3 -3 z" fill="#c9a06c" stroke="#b18a58" stroke-width="1.3"/>
  </g>

  <rect x="24" y="156" width="592" height="72" rx="14" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
  <circle cx="58" cy="192" r="14" fill="#d97757"/>
  <text x="58" y="197" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#ffffff">2</text>
  <text x="90" y="187" class="lbl" font-size="14.5" font-weight="700" fill="#2f5d3a">整理棚 ― 型に流し込む</text>
  <text x="90" y="209" class="lbl" font-size="12.5" fill="#7c7360">おくすり手帳のように“書く欄”を決める。型があるから、機械で点検できる</text>
  <g transform="translate(560,176)">
    <rect x="0" y="0" width="26" height="34" rx="3" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="1.5"/>
    <line x1="5" y1="8" x2="21" y2="8" stroke="#4a8c3f" stroke-width="1.8"/>
    <line x1="5" y1="15" x2="21" y2="15" stroke="#8fbf87" stroke-width="1.5"/>
    <line x1="5" y1="21" x2="21" y2="21" stroke="#8fbf87" stroke-width="1.5"/>
    <line x1="5" y1="27" x2="15" y2="27" stroke="#8fbf87" stroke-width="1.5"/>
  </g>

  <rect x="24" y="244" width="592" height="72" rx="14" fill="#eaf2e5" stroke="#bcd7b3" stroke-width="2"/>
  <circle cx="58" cy="280" r="14" fill="#4a8c3f"/>
  <text x="58" y="285" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#ffffff">3</text>
  <text x="90" y="275" class="lbl" font-size="14.5" font-weight="700" fill="#2f5d3a">点検の札 ― 記録に、賞味期限を</text>
  <text x="90" y="297" class="lbl" font-size="12.5" fill="#4a8c3f">出どころと日付を添えて、月に一度の棚卸し。古い記録には「要再確認」の札</text>
  <g transform="translate(556,262)">
    <path d="M6 0 h30 a3 3 0 0 1 3 3 v18 a3 3 0 0 1 -3 3 h-30 l-8 -12 z" fill="#d97757"/>
    <circle cx="8" cy="12" r="2.5" fill="#ffffff"/>
    <text x="22" y="16" text-anchor="middle" class="lbl" font-size="9" font-weight="700" fill="#ffffff">札</text>
  </g>
</svg>
