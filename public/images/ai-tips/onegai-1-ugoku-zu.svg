<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">図（HTMLが良い）でお願いすると、動く一枚が返ってくる</title>
  <desc id="d">左で人が「文章だと頭に入らなくて……図（HTMLが良い）でお願い」と頼み、右でAIさん人形が、三つのボタンと二層の図が描かれた一枚のページを差し出している。</desc>
  <defs>
    <style>
      .ink{fill:#2b2a27}.mute{fill:#6b6a66}
      .hand{font-family:"Zen Kurenaido","Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
      .serif{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
    </style>
  </defs>
  <rect width="640" height="400" fill="#f7f1e3"/>
  <!-- floor line -->
  <path d="M0 330 H640" stroke="#e3d9c3" stroke-width="2"/>

  <!-- person (left) -->
  <g transform="translate(96 150)">
    <ellipse cx="0" cy="176" rx="46" ry="7" fill="#e3d9c3"/>
    <path d="M-34 172 V80 q0-30 34-30 q34 0 34 30 V172 Z" fill="#4a8c3f"/>
    <circle cx="0" cy="26" r="34" fill="#f3d3b3" stroke="#2b2a27" stroke-width="2"/>
    <path d="M-34 20 q10-36 46-28 q22 6 22 26 q-16-14-38-8 q-18 6-30 10Z" fill="#3b2f2a"/>
    <circle cx="-11" cy="30" r="3" class="ink"/>
    <circle cx="11" cy="30" r="3" class="ink"/>
    <path d="M-8 46 q8 4 16 0" stroke="#2b2a27" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- arm pointing -->
    <path d="M30 100 q22 -16 46 -8" stroke="#4a8c3f" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M30 100 q22 -16 46 -8" stroke="#f3d3b3" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="80" cy="90" r="9" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.5"/>
  </g>
  <!-- speech bubble (left) -->
  <g transform="translate(28 28)">
    <rect x="0" y="0" width="264" height="96" rx="16" fill="#fff" stroke="#2b2a27" stroke-width="2"/>
    <path d="M70 96 l10 22 l16-22Z" fill="#fff" stroke="#2b2a27" stroke-width="2"/>
    <path d="M72 96 h22" stroke="#fff" stroke-width="4"/>
    <text x="18" y="30" class="hand ink" font-size="16">文章だと、頭に入らなくて……</text>
    <text x="18" y="58" class="hand ink" font-size="18" font-weight="700">図（HTMLが良い）で</text>
    <text x="18" y="82" class="hand ink" font-size="18" font-weight="700">お願いします</text>
  </g>

  <!-- AI robot (right) -->
  <g transform="translate(548 170)">
    <ellipse cx="0" cy="156" rx="44" ry="7" fill="#e3d9c3"/>
    <rect x="-34" y="40" width="68" height="104" rx="18" fill="#d97757"/>
    <rect x="-30" y="-30" width="60" height="58" rx="14" fill="#fff" stroke="#2b2a27" stroke-width="2"/>
    <rect x="-22" y="-20" width="44" height="34" rx="8" fill="#2b2a27"/>
    <circle cx="-9" cy="-4" r="5" fill="#8fe3a3"/>
    <circle cx="9" cy="-4" r="5" fill="#8fe3a3"/>
    <path d="M-8 6 q8 5 16 0" stroke="#8fe3a3" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="-30" x2="0" y2="-44" stroke="#2b2a27" stroke-width="2"/>
    <circle cx="0" cy="-48" r="5" fill="#d97757" stroke="#2b2a27" stroke-width="2"/>
    <!-- bow tie -->
    <path d="M-12 44 l10 6 l-10 6Z M12 44 l-10 6 l10 6Z" fill="#2b2a27"/>
    <!-- arm holding page -->
    <path d="M-34 78 q-40 -10 -70 -30" stroke="#d97757" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- the page being handed (center) -->
  <g transform="translate(318 118)">
    <rect x="0" y="0" width="176" height="196" rx="8" fill="#fff" stroke="#2b2a27" stroke-width="2" transform="rotate(-6 88 98)"/>
    <g transform="rotate(-6 88 98)">
      <!-- title bar -->
      <rect x="12" y="12" width="120" height="8" rx="4" fill="#2b2a27" opacity=".8"/>
      <!-- three buttons -->
      <rect x="12" y="32" width="46" height="18" rx="6" fill="#2f6fdb"/>
      <rect x="64" y="32" width="46" height="18" rx="6" fill="#fff" stroke="#2f6fdb" stroke-width="1.5"/>
      <rect x="116" y="32" width="46" height="18" rx="6" fill="#fff" stroke="#2f6fdb" stroke-width="1.5"/>
      <text x="35" y="45" font-size="9" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="700">✓</text>
      <!-- cloud layer -->
      <rect x="12" y="62" width="150" height="46" rx="6" fill="#eef4fd" stroke="#2f6fdb" stroke-width="1.5"/>
      <path d="M26 92 h12 a6 6 0 0 0 0-12 a8 8 0 0 0-14 2 a5 5 0 0 0 2 10z" fill="#fff" stroke="#2f6fdb" stroke-width="1.5"/>
      <rect x="52" y="74" width="14" height="18" rx="2" fill="#dce8fb" stroke="#2f6fdb" stroke-width="1.5"/>
      <rect x="74" y="74" width="14" height="18" rx="2" fill="#dce8fb" stroke="#2f6fdb" stroke-width="1.5"/>
      <rect x="96" y="74" width="14" height="18" rx="2" fill="#dce8fb" stroke="#2f6fdb" stroke-width="1.5"/>
      <rect x="118" y="74" width="14" height="18" rx="2" fill="#dce8fb" stroke="#2f6fdb" stroke-width="1.5"/>
      <!-- arrows -->
      <path d="M60 112 v14 M100 126 v-14" stroke="#4b5563" stroke-width="2" fill="none"/>
      <path d="M56 122 l4 6 l4-6Z M96 116 l4-6 l4 6Z" fill="#4b5563"/>
      <!-- pc layer -->
      <rect x="12" y="132" width="150" height="46" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
      <rect x="52" y="144" width="14" height="18" rx="2" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
      <rect x="74" y="144" width="14" height="18" rx="2" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 2"/>
      <rect x="96" y="144" width="14" height="18" rx="2" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 2"/>
      <rect x="118" y="144" width="14" height="18" rx="2" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
      <circle cx="64" cy="160" r="5" fill="#1e8e5a"/>
      <circle cx="130" cy="160" r="5" fill="#1e8e5a"/>
    </g>
  </g>
  <!-- tag above page -->
  <g transform="translate(352 74)">
    <rect x="0" y="0" width="128" height="30" rx="15" fill="#d97757"/>
    <text x="64" y="20" class="hand" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">ボタンで切り替え</text>
  </g>
  <!-- AI speech -->
  <text x="530" y="372" class="hand ink" font-size="14" text-anchor="middle">さわって、見比べてください</text>

  <!-- caption -->
  <text x="20" y="384" class="serif mute" font-size="12">特集・こんな風にお願いするといいよ　その1</text>
</svg>
