<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="三コマの図。左：スマホで撮った灯台の写真と「風が強かった」の一言。中：それらが「なんでも箱（raw）」に落ちていき、隣でAIさん人形が「仕分け係」の札を持って箱をのぞいている。右：日付のついた小さなノートが三枚できて、「潮見町」と書かれた丸いページに糸でぶら下がっている">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; fill: #2f2a24; }
      .mute { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; fill: #8a7f6e; }
      .thread { stroke: #b85f3d; stroke-width: 2; fill: none; stroke-linecap: round; }
      .note { fill: #ffffff; stroke: #8a7f6e; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="640" height="360" rx="16" fill="#faf6ef"/>

  <!-- コマの見出し -->
  <text x="110" y="34" text-anchor="middle" class="mute" font-size="13">① 放り込む</text>
  <text x="320" y="34" text-anchor="middle" class="mute" font-size="13">② 仕分ける</text>
  <text x="530" y="34" text-anchor="middle" class="mute" font-size="13">③ 糸でつながる</text>
  <line x1="215" y1="50" x2="215" y2="330" stroke="#e2dccf" stroke-dasharray="4 4"/>
  <line x1="425" y1="50" x2="425" y2="330" stroke="#e2dccf" stroke-dasharray="4 4"/>

  <!-- ① スマホ -->
  <g transform="translate(60 70)">
    <rect x="0" y="0" width="100" height="190" rx="14" fill="#2f2a24"/>
    <rect x="8" y="14" width="84" height="162" rx="8" fill="#ffffff"/>
    <!-- 灯台の写真 -->
    <rect x="14" y="22" width="72" height="54" fill="#a9c8e2"/>
    <rect x="14" y="58" width="72" height="18" fill="#4a7ea3"/>
    <path d="M30 60 L60 60 L52 34 L38 34 Z" fill="#f2efe8"/>
    <rect x="37" y="30" width="16" height="6" fill="#b85f3d"/>
    <circle cx="74" cy="34" r="5" fill="#f6dc8a"/>
    <!-- 一言 -->
    <text x="50" y="96" text-anchor="middle" class="cap" font-size="10">岬の灯台。</text>
    <text x="50" y="110" text-anchor="middle" class="cap" font-size="10">風が強くて</text>
    <text x="50" y="124" text-anchor="middle" class="cap" font-size="10">帽子が飛びそう</text>
    <text x="50" y="138" text-anchor="middle" class="cap" font-size="10">だった。</text>
    <!-- 送信 -->
    <rect x="30" y="150" width="40" height="16" rx="8" fill="#5f8a6a"/>
    <text x="50" y="162" text-anchor="middle" font-size="9" fill="#ffffff" font-family="sans-serif">保存</text>
  </g>
  <text x="110" y="290" text-anchor="middle" class="cap" font-size="12">撮って、一言。</text>
  <text x="110" y="308" text-anchor="middle" class="mute" font-size="11">分類しない・名前を付けない</text>

  <!-- ①→② 矢印 -->
  <path d="M170 160 q30 0 40 0" class="thread"/>
  <path d="M204 154 l8 6 l-8 6" class="thread"/>

  <!-- ② なんでも箱 -->
  <g transform="translate(235 150)">
    <path d="M0 40 L110 40 L100 130 L10 130 Z" fill="#d8b98a" stroke="#b98f5c" stroke-width="2"/>
    <rect x="-6" y="30" width="122" height="14" rx="3" fill="#b98f5c"/>
    <text x="55" y="100" text-anchor="middle" class="cap" font-size="14">raw</text>
    <text x="55" y="118" text-anchor="middle" class="mute" font-size="10">なんでも箱</text>
    <!-- 落ちていく写真と一言 -->
    <g transform="translate(24 -50) rotate(-12)">
      <rect x="0" y="0" width="36" height="26" fill="#a9c8e2" stroke="#ffffff" stroke-width="2"/>
      <path d="M8 24 L28 24 L22 8 L14 8 Z" fill="#f2efe8"/>
    </g>
    <g transform="translate(64 -22) rotate(10)">
      <rect x="0" y="0" width="40" height="18" fill="#ffffff" stroke="#c9c1b0"/>
      <line x1="6" y1="7" x2="34" y2="7" stroke="#8a7f6e"/>
      <line x1="6" y1="12" x2="26" y2="12" stroke="#8a7f6e"/>
    </g>
  </g>

  <!-- ② AIさん人形（箱をのぞく） -->
  <g transform="translate(378 190)">
    <rect x="-22" y="40" width="44" height="52" rx="10" fill="#e7b9a0"/>
    <rect x="-20" y="0" width="40" height="34" rx="8" fill="#ffffff" stroke="#b85f3d" stroke-width="2"/>
    <circle cx="-8" cy="15" r="2.5" fill="#2f2a24"/>
    <circle cx="8" cy="15" r="2.5" fill="#2f2a24"/>
    <path d="M-7 24 q7 6 14 0" stroke="#2f2a24" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="-8" x2="0" y2="0" stroke="#b85f3d" stroke-width="2"/>
    <circle cx="0" cy="-10" r="3" fill="#b85f3d"/>
    <!-- 腕と札 -->
    <path d="M-22 56 q-20 -6 -34 -22" stroke="#e7b9a0" stroke-width="8" stroke-linecap="round" fill="none"/>
    <g transform="translate(-4 96)">
      <rect x="-30" y="0" width="60" height="18" fill="#ffffff" stroke="#8a7f6e"/>
      <text x="0" y="13" text-anchor="middle" class="cap" font-size="10">仕分け係</text>
    </g>
  </g>
  <text x="320" y="330" text-anchor="middle" class="mute" font-size="11">箱の中身は、読むだけ。動かさない</text>

  <!-- ②→③ 矢印 -->
  <path d="M410 120 q20 -30 46 -40" class="thread"/>
  <path d="M449 74 l8 6 l-9 3" class="thread"/>

  <!-- ③ 潮見町のページと三枚のノート -->
  <g transform="translate(530 100)">
    <circle cx="0" cy="0" r="34" fill="#eef3e6" stroke="#5f8a6a" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" class="cap" font-size="14">潮見町</text>
    <!-- 中継ページ -->
    <circle cx="-60" cy="70" r="20" fill="#ffffff" stroke="#5f8a6a" stroke-width="2"/>
    <text x="-60" y="74" text-anchor="middle" class="cap" font-size="9">岬の灯台</text>
    <circle cx="60" cy="70" r="20" fill="#ffffff" stroke="#5f8a6a" stroke-width="2"/>
    <text x="60" y="74" text-anchor="middle" class="cap" font-size="9">浜食堂</text>
    <!-- 糸 -->
    <path d="M-22 26 q-20 15 -30 26" class="thread"/>
    <path d="M22 26 q20 15 30 26" class="thread"/>
    <path d="M0 34 L0 150" class="thread"/>
    <path d="M-60 90 L-60 150" class="thread"/>
    <path d="M60 90 L60 150" class="thread"/>
    <!-- ノート三枚 -->
    <g transform="translate(-84 150)">
      <rect x="0" y="0" width="48" height="36" class="note"/>
      <rect x="4" y="4" width="40" height="14" fill="#a9c8e2"/>
      <text x="24" y="30" text-anchor="middle" class="mute" font-size="7">08-10 灯台</text>
    </g>
    <g transform="translate(-24 150)">
      <rect x="0" y="0" width="48" height="36" class="note"/>
      <rect x="4" y="4" width="40" height="14" fill="#f2c76a"/>
      <text x="24" y="30" text-anchor="middle" class="mute" font-size="7">08-10 帰りの港</text>
    </g>
    <g transform="translate(36 150)">
      <rect x="0" y="0" width="48" height="36" class="note"/>
      <rect x="4" y="4" width="40" height="14" fill="#c9a37a"/>
      <text x="24" y="30" text-anchor="middle" class="mute" font-size="7">08-10 定食</text>
    </g>
  </g>
  <text x="530" y="330" text-anchor="middle" class="mute" font-size="11">ページが立ち、写真が糸でぶら下がる</text>
</svg>
