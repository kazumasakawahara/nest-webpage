<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="人形劇の舞台で、注文書を掲げた漁師の人形が「ゴールはこれじゃ！」と言い、名札をつけた3体のAIさん（せっけい・くみたて・けんさ）が大きなスマホの大道具を組み立てている図">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; }
    </style>
  </defs>

  <!-- 舞台背景 -->
  <rect width="640" height="360" rx="16" fill="#faf6ef"/>
  <rect x="12" y="56" width="616" height="248" fill="#eef3e6"/>
  <ellipse cx="120" cy="192" rx="38" ry="13" fill="#ffffff" opacity="0.9"/>
  <circle cx="590" cy="96" r="20" fill="#c9a44a" opacity="0.85"/>

  <!-- 緞帳 -->
  <rect x="0" y="0" width="640" height="42" fill="#b85f3d"/>
  <path d="M0 42 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 v-8 h-640 Z" fill="#b85f3d"/>
  <g fill="#a04e2f" opacity="0.5">
    <rect x="70" y="0" width="7" height="40"/>
    <rect x="230" y="0" width="7" height="40"/>
    <rect x="390" y="0" width="7" height="40"/>
    <rect x="550" y="0" width="7" height="40"/>
  </g>
  <path d="M0 0 h34 q8 84 -4 164 q-8 54 -30 72 Z" fill="#a04e2f"/>
  <path d="M640 0 h-34 q-8 84 4 164 q8 54 30 72 Z" fill="#a04e2f"/>

  <!-- 看板 -->
  <line x1="320" y1="42" x2="320" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="252" y1="42" x2="260" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="388" y1="42" x2="380" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <g transform="translate(212 58)">
    <rect width="216" height="38" rx="6" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="3"/>
    <text x="108" y="25" text-anchor="middle" class="cap" font-size="15" fill="#4a3b2f">第三幕「アプリのちゅうもん」</text>
  </g>

  <!-- ふきだし（ガタロウさん） -->
  <g>
    <rect x="30" y="66" width="164" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M120 106 l12 16 l4 -16 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="112" y="91" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">ゴールはこれじゃ！</text>
  </g>

  <!-- ふきだし（AIチーム） -->
  <g>
    <rect x="426" y="108" width="190" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M520 148 l-2 14 l-10 -13 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="521" y="133" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">あとは、おまかせ！</text>
  </g>

  <!-- ガタロウさん（注文書を掲げる） -->
  <g transform="translate(160 202)">
    <g>
      <path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36 C36 18 -36 18 -52 36 Z" fill="#e9eef5"/>
      <clipPath id="shirt3"><path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36 C36 18 -36 18 -52 36 Z"/></clipPath>
      <g clip-path="url(#shirt3)" stroke="#3a6ea5" stroke-width="9">
        <line x1="-60" y1="38" x2="60" y2="38"/>
        <line x1="-60" y1="60" x2="60" y2="60"/>
        <line x1="-60" y1="82" x2="60" y2="82"/>
        <line x1="-60" y1="104" x2="60" y2="104"/>
      </g>
      <path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36" fill="none" stroke="#8ba3c4" stroke-width="1.6" stroke-dasharray="4 4"/>
    </g>
    <!-- 腕（左：注文書を掲げる） -->
    <path d="M-44 48 C-70 44 -82 28 -84 8" fill="none" stroke="#e9eef5" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-86" cy="4" r="11" fill="#f0c9a8"/>
    <!-- 腕（右） -->
    <path d="M44 52 C66 58 72 44 66 28" fill="none" stroke="#e9eef5" stroke-width="18" stroke-linecap="round"/>
    <circle cx="64" cy="24" r="11" fill="#f0c9a8"/>
    <!-- 頭 -->
    <circle cx="0" cy="-30" r="52" fill="#f0c9a8"/>
    <path d="M-52 -30 a52 52 0 0 1 104 0" fill="none" stroke="#d9b28c" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M-46 -12 C-48 20 -24 34 0 34 C24 34 48 20 46 -12 C34 4 22 6 12 2 C6 10 -6 10 -12 2 C-22 6 -34 4 -46 -12 Z" fill="#f4f1ea" stroke="#d9d2c2" stroke-width="1.5"/>
    <path d="M-8 14 q8 -4 16 0" stroke="#9e4a3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-10" r="16" fill="#d97757"/>
    <circle cx="-5" cy="-15" r="4.5" fill="#ffffff" opacity="0.6"/>
    <!-- 眉（今回は張り切り） -->
    <path d="M-36 -48 q14 -6 26 -2" stroke="#4a3b2f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M10 -50 q14 -2 26 4" stroke="#4a3b2f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="-18" cy="-30" r="7" fill="#2a2620"/>
    <circle cx="18" cy="-30" r="7" fill="#2a2620"/>
    <circle cx="-16" cy="-32" r="2.4" fill="#ffffff"/>
    <circle cx="20" cy="-32" r="2.4" fill="#ffffff"/>
    <path d="M-50 -54 C-46 -90 46 -90 50 -54 C34 -64 -34 -64 -50 -54 Z" fill="#2d5a27"/>
    <rect x="-52" y="-60" width="104" height="16" rx="8" fill="#4a8c3f"/>
    <circle cx="0" cy="-86" r="9" fill="#c9a44a"/>
    <!-- 注文書（頭の前に掲げる） -->
    <g transform="translate(-118 -40) rotate(-6)">
      <rect width="100" height="52" rx="4" fill="#ffffff" stroke="#8a7a5c" stroke-width="2.5"/>
      <text x="50" y="21" text-anchor="middle" class="cap" font-size="12" fill="#4a3b2f">ちゅうもん書</text>
      <text x="50" y="41" text-anchor="middle" class="cap" font-size="11" fill="#b85f3d">もちものアプリ</text>
    </g>
  </g>

  <!-- 大道具のスマホ（組み立て中） -->
  <g transform="translate(320 128) rotate(-2)">
    <rect width="120" height="176" rx="18" fill="#ffffff" stroke="#c9c2b4" stroke-width="4"/>
    <rect x="9" y="12" width="102" height="152" rx="10" fill="#f4f1ea"/>
    <text x="60" y="36" text-anchor="middle" class="cap" font-size="13" fill="#2d5a27">もちもの</text>
    <!-- チェック行 -->
    <g font-size="11" class="cap">
      <rect x="16" y="46" width="88" height="22" rx="6" fill="#e8efe6" stroke="#4a8c3f" stroke-width="1.5"/>
      <text x="26" y="61" fill="#1a3d18">✓ れんらく帳</text>
      <rect x="16" y="74" width="88" height="22" rx="6" fill="#e8efe6" stroke="#4a8c3f" stroke-width="1.5"/>
      <text x="26" y="89" fill="#1a3d18">✓ 水とう</text>
      <rect x="16" y="102" width="88" height="22" rx="6" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5"/>
      <text x="26" y="117" fill="#7b756a">　タオル</text>
    </g>
    <text x="60" y="150" text-anchor="middle" class="cap" font-size="12" fill="#b85f3d">よし、出発！</text>
  </g>

  <!-- AIチーム3体（名札つき） -->
  <!-- せっけい係（左・設計図を持つ） -->
  <g transform="translate(268 236) scale(0.62)">
    <rect x="-34" y="-64" width="68" height="58" rx="14" fill="#2d5a27"/>
    <line x1="0" y1="-74" x2="0" y2="-64" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-78" r="5" fill="#d97757"/>
    <path d="M-20 -40 q6 6 12 0 M8 -40 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 -22 q10 7 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <rect x="-26" y="-4" width="52" height="40" rx="10" fill="#4a8c3f" opacity="0.9"/>
    <rect x="-42" y="-14" width="40" height="28" rx="3" fill="#3a6ea5" transform="rotate(-8)"/>
    <path d="M-38 -8 h28 M-38 0 h20" stroke="#ffffff" stroke-width="2" transform="rotate(-8)"/>
  </g>
  <text x="268" y="292" text-anchor="middle" class="cap" font-size="13" fill="#4a3b2f">せっけい係</text>

  <!-- くみたて係（右・かなづち） -->
  <g transform="translate(488 232) scale(0.62)">
    <rect x="-34" y="-64" width="68" height="58" rx="14" fill="#2d5a27"/>
    <line x1="0" y1="-74" x2="0" y2="-64" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-78" r="5" fill="#d97757"/>
    <path d="M-20 -40 q6 6 12 0 M8 -40 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 -22 q10 7 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <rect x="-26" y="-4" width="52" height="40" rx="10" fill="#4a8c3f" opacity="0.9"/>
    <!-- かなづち -->
    <g transform="translate(-48 -18) rotate(-30)">
      <rect x="-4" y="0" width="8" height="34" rx="3" fill="#8a5a3c"/>
      <rect x="-16" y="-12" width="32" height="14" rx="4" fill="#5f5847"/>
    </g>
  </g>
  <text x="488" y="288" text-anchor="middle" class="cap" font-size="13" fill="#4a3b2f">くみたて係</text>

  <!-- けんさ係（右奥・虫めがね） -->
  <g transform="translate(566 244) scale(0.62)">
    <rect x="-34" y="-64" width="68" height="58" rx="14" fill="#2d5a27"/>
    <line x1="0" y1="-74" x2="0" y2="-64" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-78" r="5" fill="#d97757"/>
    <path d="M-20 -40 q6 6 12 0 M8 -40 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 -22 q10 7 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <rect x="-26" y="-4" width="52" height="40" rx="10" fill="#4a8c3f" opacity="0.9"/>
    <!-- 虫めがね -->
    <g transform="translate(40 -30)">
      <circle cx="0" cy="0" r="14" fill="#ffffff" fill-opacity="0.5" stroke="#c9a44a" stroke-width="4"/>
      <line x1="10" y1="10" x2="24" y2="24" stroke="#c9a44a" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
  <text x="566" y="300" text-anchor="middle" class="cap" font-size="13" fill="#4a3b2f">けんさ係</text>

  <!-- 波の書き割り -->
  <g>
    <path d="M-10 316 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 v60 h-650 Z" fill="#3a6ea5" opacity="0.85"/>
    <path d="M-30 334 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 v40 h-690 Z" fill="#2a5580"/>
  </g>
</svg>
