<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="人形劇の舞台で、白紙のチラシを持ったお祭り係の人形うた美さんが困っており、蝶ネクタイのAIさんが盆踊りの絵を額に入れて差し出している図">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; }
    </style>
  </defs>

  <!-- 舞台背景（クリーム） -->
  <rect width="640" height="360" rx="16" fill="#faf6ef"/>

  <!-- 空の書き割り -->
  <rect x="12" y="56" width="616" height="248" fill="#eef3e6"/>
  <ellipse cx="120" cy="192" rx="38" ry="13" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="560" cy="204" rx="32" ry="12" fill="#ffffff" opacity="0.9"/>
  <circle cx="590" cy="96" r="20" fill="#c9a44a" opacity="0.85"/>

  <!-- 緞帳（どんちょう） -->
  <rect x="0" y="0" width="640" height="42" fill="#b85f3d"/>
  <path d="M0 42 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 v-8 h-640 Z" fill="#b85f3d"/>
  <g fill="#a04e2f" opacity="0.5">
    <rect x="70" y="0" width="7" height="40"/>
    <rect x="230" y="0" width="7" height="40"/>
    <rect x="390" y="0" width="7" height="40"/>
    <rect x="550" y="0" width="7" height="40"/>
  </g>
  <!-- 袖幕（左右） -->
  <path d="M0 0 h34 q8 84 -4 164 q-8 54 -30 72 Z" fill="#a04e2f"/>
  <path d="M640 0 h-34 q-8 84 4 164 q8 54 30 72 Z" fill="#a04e2f"/>

  <!-- 木の看板 -->
  <line x1="320" y1="42" x2="320" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="252" y1="42" x2="260" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="388" y1="42" x2="380" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <g transform="translate(212 58)">
    <rect width="216" height="38" rx="6" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="3"/>
    <text x="108" y="25" text-anchor="middle" class="cap" font-size="15" fill="#4a3b2f">第二幕「チラシの挿絵」</text>
  </g>

  <!-- ふきだし（うた美さん・左上） -->
  <g>
    <rect x="26" y="66" width="192" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M150 106 l12 16 l4 -16 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="122" y="91" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">ちょうどいい絵がないの…</text>
  </g>

  <!-- ふきだし（AIさん・右） -->
  <g>
    <rect x="392" y="118" width="230" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M516 158 l-4 14 l-10 -14 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="507" y="143" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">ご注文は、1行でどうぞ</text>
  </g>

  <!-- うた美さん（お祭り係の人形） -->
  <g transform="translate(200 200)">
    <!-- 胴体（テラコッタ地に水玉） -->
    <g>
      <path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36 C36 18 -36 18 -52 36 Z" fill="#d97757"/>
      <clipPath id="dress"><path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36 C36 18 -36 18 -52 36 Z"/></clipPath>
      <g clip-path="url(#dress)" fill="#f4e6c8">
        <circle cx="-30" cy="48" r="6"/><circle cx="6" cy="60" r="6"/><circle cx="38" cy="46" r="6"/>
        <circle cx="-16" cy="86" r="6"/><circle cx="24" cy="94" r="6"/><circle cx="-40" cy="102" r="6"/>
      </g>
      <path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36" fill="none" stroke="#b85f3d" stroke-width="1.6" stroke-dasharray="4 4"/>
    </g>
    <!-- 腕（左：白紙のチラシを持つ） -->
    <path d="M-44 48 C-70 52 -84 40 -88 24" fill="none" stroke="#d97757" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-90" cy="20" r="11" fill="#f0c9a8"/>
    <!-- 白紙のチラシ -->
    <g transform="translate(-140 -18) rotate(-6)">
      <rect width="70" height="52" rx="3" fill="#ffffff" stroke="#8a7a5c" stroke-width="2.5"/>
      <text x="35" y="20" text-anchor="middle" class="cap" font-size="12" fill="#6b5a3c">なつまつり</text>
      <rect x="12" y="28" width="46" height="16" rx="2" fill="none" stroke="#c9c2b4" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="35" y="40" text-anchor="middle" class="cap" font-size="9" fill="#9a948a">絵？</text>
    </g>
    <!-- 腕（右：ほほに手） -->
    <path d="M44 52 C66 58 72 44 66 28" fill="none" stroke="#d97757" stroke-width="18" stroke-linecap="round"/>
    <circle cx="64" cy="24" r="11" fill="#f0c9a8"/>
    <!-- 頭 -->
    <circle cx="0" cy="-30" r="52" fill="#f0c9a8"/>
    <path d="M-52 -30 a52 52 0 0 1 104 0" fill="none" stroke="#d9b28c" stroke-width="1.6" stroke-dasharray="4 4"/>
    <!-- ほほ（大きめの赤丸） -->
    <circle cx="-30" cy="-6" r="10" fill="#e79a78" opacity="0.75"/>
    <circle cx="30" cy="-6" r="10" fill="#e79a78" opacity="0.75"/>
    <!-- 小さめの丸い鼻 -->
    <circle cx="0" cy="-14" r="9" fill="#d97757"/>
    <!-- 眉（困り） -->
    <path d="M-32 -42 q12 -10 24 -4" stroke="#4a3b2f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M8 -46 q12 -4 24 6" stroke="#4a3b2f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 丸い目（まつげ付き） -->
    <circle cx="-16" cy="-30" r="7" fill="#2a2620"/>
    <circle cx="16" cy="-30" r="7" fill="#2a2620"/>
    <circle cx="-14" cy="-32" r="2.4" fill="#ffffff"/>
    <circle cx="18" cy="-32" r="2.4" fill="#ffffff"/>
    <path d="M-26 -38 l-6 -4 M26 -38 l6 -4" stroke="#2a2620" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 口（うーん） -->
    <path d="M-7 8 q7 -5 14 1" stroke="#9e4a3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- 髪（こげ茶のおかっぱ）とスカーフ -->
    <path d="M-52 -34 C-54 -80 54 -80 52 -34 C52 -22 44 -18 42 -30 C30 -52 -30 -52 -42 -30 C-44 -18 -52 -22 -52 -34 Z" fill="#6b4a2f"/>
    <!-- スカーフ（緑・音符柄） -->
    <path d="M-50 -50 C-40 -88 40 -88 50 -50 C30 -66 -30 -66 -50 -50 Z" fill="#4a8c3f"/>
    <path d="M-50 -50 C-30 -66 30 -66 50 -50 L44 -40 C26 -56 -26 -56 -44 -40 Z" fill="#2d5a27"/>
    <path d="M50 -50 q18 4 22 18 q-14 -2 -24 -8 Z" fill="#4a8c3f"/>
    <!-- 音符 -->
    <g fill="#faf6ef">
      <circle cx="-16" cy="-66" r="3.5"/><rect x="-13.5" y="-80" width="2" height="14"/>
      <circle cx="14" cy="-68" r="3.5"/><rect x="16.5" y="-82" width="2" height="14"/><path d="M16.5 -82 q6 2 8 6 l0 -5 q-4 -4 -8 -6 Z"/>
    </g>
  </g>

  <!-- AIさん（蝶ネクタイ・額入りの絵を差し出す） -->
  <g transform="translate(0 46)">
    <rect x="452" y="150" width="68" height="58" rx="14" fill="#2d5a27"/>
    <line x1="486" y1="140" x2="486" y2="150" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="486" cy="136" r="5" fill="#d97757"/>
    <path d="M466 174 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M494 174 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M476 192 q10 7 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M486 214 l-16 -9 v18 z" fill="#b85f3d"/>
    <path d="M486 214 l16 -9 v18 z" fill="#b85f3d"/>
    <circle cx="486" cy="214" r="4" fill="#c9a44a"/>
    <rect x="460" y="222" width="52" height="42" rx="10" fill="#4a8c3f" opacity="0.9"/>
    <!-- 腕と額入りの絵 -->
    <path d="M462 232 C440 236 428 228 420 216" fill="none" stroke="#4a8c3f" stroke-width="12" stroke-linecap="round"/>
    <g transform="translate(352 156) rotate(-4)">
      <rect x="-6" y="-6" width="88" height="70" rx="4" fill="#c9a44a"/>
      <rect width="76" height="58" fill="#2a3a5c"/>
      <!-- 提灯 -->
      <circle cx="14" cy="12" r="6" fill="#d97757"/><line x1="14" y1="4" x2="14" y2="1" stroke="#c9a44a" stroke-width="2"/>
      <circle cx="38" cy="9" r="6" fill="#c9a44a"/><line x1="38" y1="1" x2="38" y2="-2" stroke="#c9a44a" stroke-width="2"/>
      <circle cx="62" cy="12" r="6" fill="#d97757"/><line x1="62" y1="4" x2="62" y2="1" stroke="#c9a44a" stroke-width="2"/>
      <!-- 踊る人影 -->
      <g fill="#f4e6c8">
        <circle cx="24" cy="32" r="5"/>
        <path d="M18 40 q6 -6 12 0 l-2 10 h-8 Z"/>
        <path d="M14 34 l6 4 M34 32 l-4 6" stroke="#f4e6c8" stroke-width="3" stroke-linecap="round"/>
        <circle cx="52" cy="34" r="5"/>
        <path d="M46 42 q6 -6 12 0 l-2 10 h-8 Z"/>
        <path d="M60 34 l-4 6 M42 36 l6 4" stroke="#f4e6c8" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
    <circle cx="418" cy="212" r="10" fill="#4a8c3f"/>
  </g>

  <!-- 波の書き割り -->
  <g>
    <path d="M-10 316 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 q20 -22 40 0 v60 h-650 Z" fill="#3a6ea5" opacity="0.85"/>
    <path d="M-30 334 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 q20 -20 40 0 v40 h-690 Z" fill="#2a5580"/>
  </g>
</svg>
