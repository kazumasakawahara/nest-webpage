<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="家の中に3つの部屋がある図。「写真」と「仕事の書類」の部屋には鍵がかかり、AIは入れない。「AI作業室」だけ扉が開いていて、ロボットが中で働いている。AIに渡すのは、この部屋だけの鍵1本">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <text x="24" y="40" class="lbl" font-size="17" font-weight="700" fill="#2f5d3a">AIに渡すのは、“この部屋だけ”の鍵1本</text>

  <!-- 家 -->
  <path d="M60 118 L320 58 L580 118" fill="none" stroke="#b18a58" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="76" y="118" width="488" height="146" fill="#faf6ef" stroke="#ddd3c1" stroke-width="2"/>

  <!-- 部屋1：写真（施錠） -->
  <rect x="96" y="136" width="136" height="110" rx="8" fill="#efe9dd" stroke="#ddd3c1" stroke-width="1.5"/>
  <text x="164" y="164" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#7c7360">写真</text>
  <g transform="translate(150,182)">
    <rect x="0" y="10" width="28" height="22" rx="5" fill="#7c7360"/>
    <path d="M6 10 v-4 a8 8 0 0 1 16 0 v4" fill="none" stroke="#7c7360" stroke-width="4"/>
    <circle cx="14" cy="20" r="3.4" fill="#efe9dd"/>
  </g>
  <text x="164" y="236" text-anchor="middle" class="lbl" font-size="11.5" fill="#9a907c">AIは入れない</text>

  <!-- 部屋2：仕事の書類（施錠） -->
  <rect x="252" y="136" width="136" height="110" rx="8" fill="#efe9dd" stroke="#ddd3c1" stroke-width="1.5"/>
  <text x="320" y="164" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#7c7360">仕事の書類</text>
  <g transform="translate(306,182)">
    <rect x="0" y="10" width="28" height="22" rx="5" fill="#7c7360"/>
    <path d="M6 10 v-4 a8 8 0 0 1 16 0 v4" fill="none" stroke="#7c7360" stroke-width="4"/>
    <circle cx="14" cy="20" r="3.4" fill="#efe9dd"/>
  </g>
  <text x="320" y="236" text-anchor="middle" class="lbl" font-size="11.5" fill="#9a907c">AIは入れない</text>

  <!-- 部屋3：AI作業室（開放） -->
  <rect x="408" y="136" width="136" height="110" rx="8" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="2.5"/>
  <text x="476" y="164" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700" fill="#2f5d3a">AI作業室</text>
  <!-- 開いた扉 -->
  <path d="M424 246 v-62 l20 -8 v70" fill="#c9a06c" stroke="#b18a58" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- ロボット -->
  <g transform="translate(458,178)">
    <line x1="18" y1="7" x2="18" y2="2" stroke="#2f5d3a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="18" cy="0" r="3.2" fill="#ffd15c"/>
    <rect x="2" y="7" width="32" height="26" rx="8" fill="#faf6ef" stroke="#2f5d3a" stroke-width="2.2"/>
    <rect x="9" y="13" width="18" height="14" rx="4.5" fill="#1f3a26"/>
    <circle cx="14.5" cy="20" r="2.6" fill="#8fe0b0"/>
    <circle cx="21.5" cy="20" r="2.6" fill="#8fe0b0"/>
  </g>
  <!-- 鍵 -->
  <g transform="translate(500,186)">
    <circle cx="8" cy="8" r="7" fill="none" stroke="#d97757" stroke-width="4"/>
    <path d="M14 14 l14 14 M22 22 l5 -5 M27 27 l4 -4" fill="none" stroke="#d97757" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="476" y="236" text-anchor="middle" class="lbl" font-size="11.5" font-weight="700" fill="#4a8c3f">見せたフォルダだけ</text>

  <text x="320" y="288" text-anchor="middle" class="lbl" font-size="12.5" fill="#7c7360">家じゅうの鍵束を渡すわけでは、ありません</text>
</svg>
