<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="ブランチの図解。下の横一本の線が「本編」で、左からA（初稿）、B（考察を加筆）と進む。Bの地点から上に枝分かれした線が「試作ブランチ」で、C（考察をテーマ別に組み替え）、D（AIに全面的に整えさせた）と続き、再び下の本編に合流してE（良いほうを採用して合流）、F（投稿規定に合わせて調整）へ進む。枝の部分に「ここを試している間、本編は1文字も変わらない」という吹き出しが付いている">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; }
    </style>
  </defs>

  <!-- 舞台背景（クリーム） -->
  <rect width="640" height="400" rx="16" fill="#faf6ef"/>

  <!-- 書き割り -->
  <rect x="12" y="56" width="616" height="330" fill="#eef3e6"/>

  <!-- 緞帳（どんちょう） -->
  <rect x="0" y="0" width="640" height="42" fill="#b85f3d"/>
  <path d="M0 42 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 v-8 h-640 Z" fill="#b85f3d"/>
  <g fill="#a04e2f" opacity="0.5">
    <rect x="70" y="0" width="7" height="40"/>
    <rect x="230" y="0" width="7" height="40"/>
    <rect x="390" y="0" width="7" height="40"/>
    <rect x="550" y="0" width="7" height="40"/>
  </g>
  <!-- 袖幕（左右・細め） -->
  <path d="M0 0 h34 q8 84 -4 164 q-8 54 -30 72 Z" fill="#a04e2f"/>
  <path d="M640 0 h-34 q-8 84 4 164 q8 54 30 72 Z" fill="#a04e2f"/>

  <!-- 木の看板（中央・ぶら下がり） -->
  <line x1="320" y1="42" x2="320" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="246" y1="42" x2="254" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="394" y1="42" x2="386" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <g transform="translate(212 58)">
    <rect width="216" height="38" rx="6" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="3"/>
    <text x="108" y="25" text-anchor="middle" class="cap" font-size="14" fill="#4a3b2f">第二幕「どこを変えられたか」</text>
  </g>

  <!-- 本編（main）の一本道 -->
  <line x1="60" y1="290" x2="600" y2="290" stroke="#2d5a27" stroke-width="6" stroke-linecap="round"/>
  <path d="M600 290 l-12 -7 v14 z" fill="#2d5a27"/>
  <text x="600" y="272" text-anchor="end" class="cap" font-size="12" fill="#2d5a27">本編（main）</text>

  <!-- 試作ブランチ（破線） -->
  <path d="M165 290 C190 245 200 195 240 195 H440 C468 195 476 242 490 287" fill="none" stroke="#b85f3d" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="222" y="180" text-anchor="middle" class="cap" font-size="11" fill="#b85f3d">試作ブランチ</text>

  <!-- ふきだし（枝の下） -->
  <g>
    <path d="M322 222 l8 -15 l10 15 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <rect x="250" y="221" width="180" height="54" rx="10" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="340" y="244" text-anchor="middle" class="cap" font-size="12" fill="#2a2620">ここを試している間、</text>
    <text x="340" y="263" text-anchor="middle" class="cap" font-size="12" fill="#2a2620">本編は1文字も変わらない</text>
  </g>

  <!-- 本編のセーブポイント -->
  <g>
    <circle cx="85" cy="290" r="14" fill="#4a8c3f" stroke="#2d5a27" stroke-width="3"/>
    <text x="85" y="295" text-anchor="middle" class="cap" font-size="13" fill="#ffffff">A</text>
    <text x="85" y="322" text-anchor="middle" class="cap" font-size="11" fill="#4a3b2f">初稿</text>

    <circle cx="165" cy="290" r="14" fill="#4a8c3f" stroke="#2d5a27" stroke-width="3"/>
    <text x="165" y="295" text-anchor="middle" class="cap" font-size="13" fill="#ffffff">B</text>
    <text x="165" y="322" text-anchor="middle" class="cap" font-size="11" fill="#4a3b2f">考察を加筆</text>

    <circle cx="490" cy="290" r="14" fill="#4a8c3f" stroke="#2d5a27" stroke-width="3"/>
    <text x="490" y="295" text-anchor="middle" class="cap" font-size="13" fill="#ffffff">E</text>
    <text x="490" y="318" text-anchor="middle" class="cap" font-size="11" fill="#4a3b2f">良いほうを</text>
    <text x="490" y="332" text-anchor="middle" class="cap" font-size="11" fill="#4a3b2f">採用して合流</text>

    <circle cx="570" cy="290" r="14" fill="#4a8c3f" stroke="#2d5a27" stroke-width="3"/>
    <text x="570" y="295" text-anchor="middle" class="cap" font-size="13" fill="#ffffff">F</text>
    <text x="570" y="318" text-anchor="middle" class="cap" font-size="11" fill="#4a3b2f">投稿規定に</text>
    <text x="570" y="332" text-anchor="middle" class="cap" font-size="11" fill="#4a3b2f">合わせて調整</text>
  </g>

  <!-- 試作ブランチのセーブポイント -->
  <g>
    <circle cx="285" cy="195" r="13" fill="#ffffff" stroke="#b85f3d" stroke-width="3"/>
    <text x="285" y="200" text-anchor="middle" class="cap" font-size="13" fill="#b85f3d">C</text>
    <text x="285" y="150" text-anchor="middle" class="cap" font-size="11" fill="#4a3b2f">考察をテーマ別に</text>
    <text x="285" y="164" text-anchor="middle" class="cap" font-size="11" fill="#4a3b2f">組み替え</text>

    <circle cx="395" cy="195" r="13" fill="#ffffff" stroke="#b85f3d" stroke-width="3"/>
    <text x="395" y="200" text-anchor="middle" class="cap" font-size="13" fill="#b85f3d">D</text>
    <text x="395" y="150" text-anchor="middle" class="cap" font-size="11" fill="#4a3b2f">AIに全面的に</text>
    <text x="395" y="164" text-anchor="middle" class="cap" font-size="11" fill="#4a3b2f">整えさせた</text>
  </g>
</svg>
