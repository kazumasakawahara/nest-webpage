<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="あやしいSMSに困っている人を、盾を持ったAIさんが守り、「急がせる」「お金・個人情報」「リンクへ誘導」という3つの手口の札を指摘している図">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; }
      .label { font-family: 'Noto Sans JP', sans-serif; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="640" height="360" rx="16" fill="#faf6ef"/>

  <!-- 人（左）：トップページのマスコット（白髪・金縁メガネ・紺フリース・カップ）。表情は不安げ -->
  <g>
    <g transform="translate(104,138) scale(0.35)">
      <!-- あぐらの下半身 -->
      <path d="M-64 250 C-72 302 -18 320 10 302 C-4 326 -66 322 -72 286 Z" fill="#1c2942"/>
      <path d="M64 250 C72 302 18 320 -10 302 C4 326 66 322 72 286 Z" fill="#243654"/>
      <!-- 首 -->
      <rect x="-14" y="48" width="28" height="22" rx="7" fill="#e6b892"/>
      <!-- 胴体（紺フリース） -->
      <path d="M-66 252 C-78 168 -58 80 -18 64 C-8 58 8 58 18 64 C58 80 78 168 66 252 Z" fill="#22314f"/>
      <!-- 襟・インナー -->
      <path d="M-30 70 Q0 56 30 70 L22 98 Q0 84 -22 98 Z" fill="#2c3c5e"/>
      <path d="M-17 78 Q0 68 17 78 L11 100 Q0 92 -11 100 Z" fill="#e9eef5"/>
      <line x1="0" y1="96" x2="0" y2="244" stroke="#33456b" stroke-width="3"/>
      <!-- 髪（後ろ・白髪ウェーブ） -->
      <path d="M-72 6 C-88 -66 -44 -100 0 -100 C44 -100 88 -66 72 6 C64 -6 54 -4 48 8 C40 -8 30 -6 24 8 C16 -8 4 -8 -2 8 C-10 -8 -22 -8 -28 8 C-36 -6 -48 -6 -54 10 C-60 2 -66 2 -72 6 Z" fill="#8c908c"/>
      <!-- 顔 -->
      <circle cx="0" cy="0" r="60" fill="#f0c9a8"/>
      <path d="M-52 -52 C-30 -74 30 -74 52 -50" stroke="#a9ada8" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M-44 -34 C-30 -50 -6 -52 6 -40" stroke="#7d817d" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M46 -30 C34 -46 14 -48 4 -38" stroke="#7d817d" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- ほほ -->
      <circle cx="-38" cy="24" r="10" fill="#e79a78" opacity="0.5"/>
      <circle cx="38" cy="24" r="10" fill="#e79a78" opacity="0.5"/>
      <!-- 不安げな眉と目（開いた点目） -->
      <path d="M-40 -12 Q-26 -20 -14 -14" stroke="#4a3b2f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M14 -14 Q26 -20 40 -12" stroke="#4a3b2f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <circle cx="-26" cy="8" r="6" fill="#4a3b2f"/>
      <circle cx="26" cy="8" r="6" fill="#4a3b2f"/>
      <!-- 金縁メガネ -->
      <g stroke="#c9a44a" stroke-width="3.5" fill="#ffffff" fill-opacity="0.14">
        <ellipse cx="-26" cy="6" rx="22" ry="15"/>
        <ellipse cx="26" cy="6" rx="22" ry="15"/>
      </g>
      <path d="M-4 4 Q0 -1 4 4" stroke="#c9a44a" stroke-width="3.5" fill="none"/>
      <line x1="-48" y1="2" x2="-64" y2="-4" stroke="#c9a44a" stroke-width="3"/>
      <line x1="48" y1="2" x2="64" y2="-4" stroke="#c9a44a" stroke-width="3"/>
      <!-- 口（心配そうにきゅっと） -->
      <path d="M-12 40 Q0 33 12 40" stroke="#9e4a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- 腕（カップを持つ） -->
      <path d="M-56 132 C-64 178 -32 198 -8 198" fill="none" stroke="#22314f" stroke-width="30" stroke-linecap="round"/>
      <path d="M56 132 C64 178 32 198 8 198" fill="none" stroke="#243654" stroke-width="30" stroke-linecap="round"/>
      <!-- カップ -->
      <path d="M-17 176 h34 a4 4 0 0 1 4 4 v13 a13 13 0 0 1 -13 13 h-16 a13 13 0 0 1 -13 -13 v-13 a4 4 0 0 1 4 -4 Z" fill="#ffffff" stroke="#d9cfbb" stroke-width="1.5"/>
      <path d="M21 182 a9 9 0 0 1 0 18" fill="none" stroke="#d9cfbb" stroke-width="3"/>
      <ellipse cx="0" cy="180" rx="15" ry="4.5" fill="#8a5a3c"/>
      <!-- 手 -->
      <circle cx="-12" cy="198" r="13" fill="#f0c9a8"/>
      <circle cx="12" cy="198" r="13" fill="#f0c9a8"/>
    </g>
    <!-- ふきだし -->
    <g>
      <rect x="40" y="24" width="146" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
      <path d="M96 64 l8 12 l4 -12 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
      <text x="113" y="50" text-anchor="middle" class="cap" font-size="19" fill="#2a2620">これ、ほんもの…？</text>
    </g>
  </g>

  <!-- 中央：あやしいSMSのスマホ -->
  <g transform="translate(236 84) rotate(-3)">
    <rect width="118" height="188" rx="16" fill="#ffffff" stroke="#c9c2b4" stroke-width="3"/>
    <rect x="8" y="10" width="102" height="168" rx="10" fill="#f4f1ea"/>
    <!-- SMSふきだし -->
    <rect x="14" y="22" width="90" height="104" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
    <text x="22" y="44" class="label" font-size="12" fill="#2a2620">お荷物を</text>
    <text x="22" y="62" class="label" font-size="12" fill="#2a2620">保管中です。</text>
    <text x="22" y="84" class="label" font-size="12" fill="#b8452e">本日中に</text>
    <text x="22" y="102" class="label" font-size="12" fill="#b8452e">ご確認を→</text>
    <text x="22" y="120" class="label" font-size="11" fill="#3a6ea5" text-decoration="underline">http://〇〇…</text>
    <!-- ？マーク -->
    <text x="58" y="164" text-anchor="middle" class="cap" font-size="26" fill="#b85f3d">？</text>
  </g>

  <!-- AIさん（右）：盾を構える -->
  <g>
    <rect x="486" y="72" width="68" height="58" rx="14" fill="#2d5a27"/>
    <line x1="520" y1="62" x2="520" y2="72" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="520" cy="58" r="5" fill="#d97757"/>
    <!-- 目（にこにこ） -->
    <path d="M500 96 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M528 96 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M510 114 q10 7 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <!-- 体 -->
    <rect x="494" y="136" width="52" height="42" rx="10" fill="#4a8c3f" opacity="0.9"/>
    <!-- 盾 -->
    <g transform="translate(438 120)">
      <path d="M0 8 Q28 -6 56 8 L56 52 Q56 88 28 102 Q0 88 0 52 Z" fill="#e8efe6" stroke="#2d5a27" stroke-width="3.5"/>
      <path d="M28 26 l7 14 15 2 -11 11 3 15 -14 -8 -14 8 3 -15 -11 -11 15 -2 z" fill="#2d5a27" opacity="0.85"/>
    </g>
    <!-- ふきだし -->
    <g>
      <rect x="398" y="6" width="222" height="42" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
      <path d="M540 48 l-4 12 l-8 -12 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
      <text x="509" y="33" text-anchor="middle" class="cap" font-size="19" fill="#2a2620">押す前に、見せてください</text>
    </g>
  </g>

  <!-- 下段：詐欺の3つの筋の札 -->
  <text x="320" y="300" text-anchor="middle" class="cap" font-size="16" fill="#7b756a">AIさんが見ている「詐欺の3つの筋」</text>
  <g class="cap" font-size="15">
    <g transform="translate(112 310) rotate(-2)">
      <rect width="120" height="34" rx="8" fill="#ffffff" stroke="#b85f3d" stroke-width="2"/>
      <text x="60" y="23" text-anchor="middle" fill="#b85f3d">⚠ 急がせる</text>
    </g>
    <g transform="translate(252 312)">
      <rect width="150" height="34" rx="8" fill="#ffffff" stroke="#b85f3d" stroke-width="2"/>
      <text x="75" y="23" text-anchor="middle" fill="#b85f3d">⚠ お金・個人情報</text>
    </g>
    <g transform="translate(422 310) rotate(2)">
      <rect width="140" height="34" rx="8" fill="#ffffff" stroke="#b85f3d" stroke-width="2"/>
      <text x="70" y="23" text-anchor="middle" fill="#b85f3d">⚠ リンクへ誘導</text>
    </g>
  </g>
</svg>
