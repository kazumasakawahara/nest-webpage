<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="人形劇の舞台。研究者人形が「最終版」と書かれた札の付いた書類の山に埋もれて困り顔をしている。その横で蝶ネクタイのAIさん人形が、札のない一冊の原稿と、その横に立つ小さな旗（セーブポイント）の並んだ道を指さして「名前で悩むのは、もう終わりにしましょう」と言っている図">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; }
    </style>
  </defs>

  <!-- 舞台背景（クリーム） -->
  <rect width="640" height="360" rx="16" fill="#faf6ef"/>

  <!-- 研究室の書き割り -->
  <rect x="12" y="56" width="616" height="248" fill="#eef3e6"/>
  <!-- 壁の時計 -->
  <circle cx="86" cy="98" r="18" fill="#ffffff" stroke="#8a7a5c" stroke-width="3"/>
  <line x1="86" y1="98" x2="86" y2="87" stroke="#8a7a5c" stroke-width="3" stroke-linecap="round"/>
  <line x1="86" y1="98" x2="94" y2="102" stroke="#8a7a5c" stroke-width="3" stroke-linecap="round"/>

  <!-- 緞帳（どんちょう） -->
  <rect x="0" y="0" width="640" height="42" fill="#b85f3d"/>
  <path d="M0 42 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 v-8 h-640 Z" fill="#b85f3d"/>
  <g fill="#a04e2f" opacity="0.5">
    <rect x="70" y="0" width="7" height="40"/>
    <rect x="230" y="0" width="7" height="40"/>
    <rect x="390" y="0" width="7" height="40"/>
    <rect x="550" y="0" width="7" height="40"/>
  </g>
  <!-- 袖幕（左右・細め） -->
  <path d="M0 0 h34 q8 84 -4 164 q-8 54 -30 72 Z" fill="#a04e2f"/>
  <path d="M640 0 h-34 q-8 84 4 164 q8 54 30 72 Z" fill="#a04e2f"/>

  <!-- 木の看板（中央・ぶら下がり） -->
  <line x1="320" y1="42" x2="320" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="252" y1="42" x2="260" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="388" y1="42" x2="380" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <g transform="translate(216 58)">
    <rect width="208" height="38" rx="6" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="3"/>
    <text x="104" y="25" text-anchor="middle" class="cap" font-size="14" fill="#4a3b2f">第一幕「最終版が6つある」</text>
  </g>

  <!-- ふきだし（AIさん・右上） -->
  <g>
    <rect x="424" y="90" width="192" height="58" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M552 148 l12 26 l8 -26 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="520" y="114" text-anchor="middle" class="cap" font-size="14" fill="#2a2620">名前で悩むのは、</text>
    <text x="520" y="136" text-anchor="middle" class="cap" font-size="14" fill="#2a2620">もう終わりにしましょう</text>
  </g>

  <!-- 書類の山（「最終版」の札つき）＋埋もれた研究者人形 -->
  <g>
    <!-- 研究者人形（山のうしろから頭と両手だけ） -->
    <g transform="translate(165 152)">
      <!-- 頭 -->
      <circle cx="0" cy="0" r="42" fill="#f0c9a8"/>
      <path d="M-42 0 a42 42 0 0 1 84 0" fill="none" stroke="#d9b28c" stroke-width="1.6" stroke-dasharray="4 4"/>
      <!-- 髪（こげ茶・ぼさぼさ気味） -->
      <path d="M-42 -4 C-44 -46 44 -46 42 -4 C30 -24 -30 -24 -42 -4 Z" fill="#6b4a2f"/>
      <path d="M-40 -14 l-7 -9 M-18 -28 l-4 -11 M14 -29 l3 -11 M38 -16 l7 -9" stroke="#6b4a2f" stroke-width="5" stroke-linecap="round"/>
      <!-- 困り眉（内側が上がる） -->
      <path d="M-30 -12 q12 -10 22 -6" stroke="#4a3b2f" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M8 -18 q12 -4 22 6" stroke="#4a3b2f" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- 目（うるうる） -->
      <circle cx="-16" cy="-2" r="5" fill="#2a2620"/>
      <circle cx="16" cy="-2" r="5" fill="#2a2620"/>
      <circle cx="-14" cy="-4" r="1.6" fill="#ffffff"/>
      <circle cx="18" cy="-4" r="1.6" fill="#ffffff"/>
      <!-- ほほ -->
      <circle cx="-28" cy="12" r="5" fill="#e8a87c" opacity="0.55"/>
      <circle cx="28" cy="12" r="5" fill="#e8a87c" opacity="0.55"/>
      <!-- 口（へにゃっと困り顔） -->
      <path d="M-9 22 q9 -7 18 0" stroke="#9e4a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- 汗 -->
      <path d="M46 -20 q7 10 0 15 q-7 -5 0 -15 Z" fill="#3a6ea5" opacity="0.8"/>
    </g>
    <!-- 書類の山 -->
    <g stroke="#8a7a5c" stroke-width="2">
      <rect x="118" y="196" width="96" height="26" rx="3" fill="#f4ecd9" transform="rotate(-7 166 209)"/>
      <rect x="96" y="216" width="120" height="28" rx="3" fill="#ffffff" transform="rotate(4 156 230)"/>
      <rect x="140" y="234" width="112" height="28" rx="3" fill="#f4ecd9" transform="rotate(-4 196 248)"/>
      <rect x="78" y="240" width="104" height="28" rx="3" fill="#ffffff" transform="rotate(6 130 254)"/>
      <rect x="112" y="258" width="130" height="30" rx="3" fill="#ffffff" transform="rotate(-2 177 273)"/>
      <rect x="66" y="266" width="112" height="30" rx="3" fill="#f4ecd9" transform="rotate(3 122 281)"/>
      <rect x="60" y="284" width="216" height="26" rx="3" fill="#ffffff"/>
    </g>
    <!-- 紙の行 -->
    <g stroke="#b8b2a4" stroke-width="2" opacity="0.8">
      <line x1="132" y1="206" x2="196" y2="200"/>
      <line x1="110" y1="230" x2="196" y2="234"/>
      <line x1="90" y1="252" x2="164" y2="258"/>
    </g>
    <!-- 両手（山のわきから突き出す） -->
    <circle cx="70" cy="248" r="11" fill="#f0c9a8"/>
    <circle cx="262" cy="230" r="11" fill="#f0c9a8"/>
    <!-- 「最終版」の札（ひもつき） -->
    <g>
      <g transform="translate(70 196) rotate(-10)">
        <line x1="50" y1="16" x2="62" y2="26" stroke="#9e4a3a" stroke-width="2"/>
        <rect width="54" height="20" rx="3" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="2"/>
        <text x="27" y="14" text-anchor="middle" class="cap" font-size="10" fill="#4a3b2f">最終版</text>
      </g>
      <g transform="translate(212 178) rotate(8)">
        <line x1="4" y1="18" x2="-6" y2="28" stroke="#9e4a3a" stroke-width="2"/>
        <rect width="54" height="20" rx="3" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="2"/>
        <text x="27" y="14" text-anchor="middle" class="cap" font-size="10" fill="#4a3b2f">最終版</text>
      </g>
      <g transform="translate(236 244) rotate(-6)">
        <line x1="2" y1="16" x2="-8" y2="24" stroke="#9e4a3a" stroke-width="2"/>
        <rect width="54" height="20" rx="3" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="2"/>
        <text x="27" y="14" text-anchor="middle" class="cap" font-size="10" fill="#4a3b2f">最終版</text>
      </g>
    </g>
  </g>

  <!-- AIさん（続投デザイン・蝶ネクタイ） -->
  <g transform="translate(80 46)">
    <rect x="452" y="150" width="68" height="58" rx="14" fill="#2d5a27"/>
    <line x1="486" y1="140" x2="486" y2="150" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="486" cy="136" r="5" fill="#d97757"/>
    <path d="M466 174 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M494 174 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M476 192 q10 7 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M486 214 l-16 -9 v18 z" fill="#b85f3d"/>
    <path d="M486 214 l16 -9 v18 z" fill="#b85f3d"/>
    <circle cx="486" cy="214" r="4" fill="#c9a44a"/>
    <rect x="460" y="222" width="52" height="42" rx="10" fill="#4a8c3f" opacity="0.9"/>
    <!-- 旗の道を指さす腕 -->
    <path d="M462 232 C446 228 434 222 424 214" fill="none" stroke="#2d5a27" stroke-width="10" stroke-linecap="round"/>
    <circle cx="421" cy="212" r="6" fill="#2d5a27"/>
  </g>

  <!-- 札のない原稿1冊と、セーブポイントの旗が並ぶ道 -->
  <g>
    <!-- 道 -->
    <path d="M336 290 C400 284 460 286 520 281 C560 278 590 278 610 276" fill="none" stroke="#d8cdb4" stroke-width="20" stroke-linecap="round" opacity="0.9"/>
    <!-- 原稿（札なし・一冊きり） -->
    <g transform="translate(288 252)">
      <rect x="4" y="6" width="64" height="44" rx="3" fill="#d8cdb4" stroke="#8a7a5c" stroke-width="2"/>
      <rect x="0" y="0" width="64" height="44" rx="3" fill="#ffffff" stroke="#8a7a5c" stroke-width="2.5"/>
      <line x1="8" y1="12" x2="56" y2="12" stroke="#b8b2a4" stroke-width="2"/>
      <line x1="8" y1="21" x2="50" y2="21" stroke="#b8b2a4" stroke-width="2"/>
      <line x1="8" y1="30" x2="56" y2="30" stroke="#b8b2a4" stroke-width="2"/>
    </g>
    <!-- 旗1：初稿 -->
    <g>
      <line x1="380" y1="286" x2="380" y2="252" stroke="#6b4a2f" stroke-width="3" stroke-linecap="round"/>
      <path d="M380 252 l22 6 l-22 6 z" fill="#4a8c3f"/>
      <text x="380" y="246" text-anchor="middle" class="cap" font-size="9" fill="#4a3b2f">初稿</text>
    </g>
    <!-- 旗2：考察を入れ替え -->
    <g>
      <line x1="444" y1="284" x2="444" y2="234" stroke="#6b4a2f" stroke-width="3" stroke-linecap="round"/>
      <path d="M444 234 l22 6 l-22 6 z" fill="#c9a44a"/>
      <text x="444" y="228" text-anchor="middle" class="cap" font-size="9" fill="#4a3b2f">考察を入れ替え</text>
    </g>
    <!-- 旗3：倫理的配慮を追記 -->
    <g>
      <line x1="506" y1="282" x2="506" y2="222" stroke="#6b4a2f" stroke-width="3" stroke-linecap="round"/>
      <path d="M506 222 l-22 6 l22 6 z" fill="#b85f3d"/>
      <text x="526" y="216" text-anchor="end" class="cap" font-size="9" fill="#4a3b2f">倫理的配慮を追記</text>
    </g>
    <!-- 道の先のかがやき -->
    <g stroke="#c9a44a" stroke-width="3" stroke-linecap="round">
      <line x1="606" y1="262" x2="614" y2="254"/>
      <line x1="596" y1="252" x2="600" y2="244"/>
    </g>
  </g>

  <!-- 事務机の書き割り（手前。人形の下半身と山のすそを隠す） -->
  <g>
    <rect x="-10" y="308" width="660" height="60" fill="#8a6a48"/>
    <rect x="-10" y="300" width="660" height="14" rx="6" fill="#a5825c"/>
    <!-- えんぴつ -->
    <g transform="translate(330 314) rotate(-4)">
      <rect width="40" height="7" rx="2" fill="#c9a44a"/>
      <path d="M40 0 l8 3.5 l-8 3.5 z" fill="#f0c9a8"/>
    </g>
    <!-- 湯のみ -->
    <g transform="translate(218 296)">
      <rect x="0" y="8" width="26" height="20" rx="4" fill="#4a8c3f"/>
      <path d="M3 4 q10 -8 20 0" fill="none" stroke="#b8b2a4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>
</svg>
