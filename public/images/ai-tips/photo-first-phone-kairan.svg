<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-label="スマホのチャット画面のイラスト。手書きの回覧のお知らせの写真を送り、「要点だけ教えて。日付と持ち物を抜き出して」と聞くと、AIが町内清掃の日付と持ち物を箇条書きで答えている">
  <defs>
    <style>
      .lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}
      .hand{font-family:'Zen Kurenaido','Shippori Mincho B1',serif;}
    </style>
  </defs>

  <!-- スマホ本体 -->
  <rect x="40" y="10" width="280" height="450" rx="34" fill="#2b3a2c"/>
  <rect x="52" y="22" width="256" height="426" rx="24" fill="#f4efe4"/>

  <!-- 上部バー -->
  <rect x="52" y="22" width="256" height="44" rx="24" fill="#2d5a27"/>
  <rect x="52" y="44" width="256" height="22" fill="#2d5a27"/>
  <circle cx="86" cy="44" r="12" fill="#4a8c3f"/>
  <path d="M81 42 q2 3 5 0 M91 42 q2 3 5 0" stroke="#faf6ef" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M83 50 q4 3 8 0" stroke="#faf6ef" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="106" y="49" class="lbl" font-size="13" fill="#faf6ef">AIさん</text>

  <!-- ① 撮った写真（手書きの回覧） -->
  <g>
    <rect x="140" y="78" width="156" height="104" rx="10" fill="#ffffff" stroke="#d8cdb4" stroke-width="2"/>
    <rect x="148" y="86" width="140" height="88" rx="6" fill="#c9bfa8"/>
    <!-- 手書きの紙（少し傾く） -->
    <g transform="rotate(-2 218 130)">
      <rect x="156" y="92" width="124" height="76" rx="3" fill="#fffdf6" stroke="#8a7a5c" stroke-width="1.6"/>
      <text x="218" y="108" text-anchor="middle" class="hand" font-size="12" fill="#3d3a33">おしらせ（回覧）</text>
      <!-- 手書き風の行 -->
      <g stroke="#6b5f4c" stroke-width="1.8" fill="none" stroke-linecap="round">
        <path d="M166 118 q10 -3 20 0 q10 3 22 0 q12 -3 24 0 q10 2 20 0"/>
        <path d="M166 130 q12 -3 24 0 q12 3 24 0 q12 -3 26 0 q8 2 16 0"/>
        <path d="M166 142 q10 3 20 0 q12 -3 24 0 q12 3 24 0"/>
        <path d="M166 154 q12 -3 24 0 q10 3 20 0"/>
      </g>
      <!-- 判子 -->
      <circle cx="264" cy="152" r="9" fill="none" stroke="#c0492c" stroke-width="1.8"/>
    </g>
  </g>
  <g>
    <rect x="128" y="70" width="54" height="19" rx="9.5" fill="#b85f3d"/>
    <text x="155" y="83.5" text-anchor="middle" class="lbl" font-size="10.5" fill="#ffffff">① 撮る</text>
  </g>

  <!-- ② ひとこと添えて送る -->
  <g>
    <rect x="100" y="196" width="196" height="46" rx="12" fill="#4a8c3f"/>
    <text x="114" y="215" class="lbl" font-size="11.5" fill="#ffffff">要点だけ教えて。</text>
    <text x="114" y="232" class="lbl" font-size="11.5" fill="#ffffff">日付と持ち物を抜き出して</text>
  </g>
  <g>
    <rect x="88" y="188" width="54" height="19" rx="9.5" fill="#b85f3d"/>
    <text x="115" y="201.5" text-anchor="middle" class="lbl" font-size="10.5" fill="#ffffff">② 送る</text>
  </g>

  <!-- ③ 返ってくる -->
  <g>
    <rect x="62" y="256" width="212" height="86" rx="12" fill="#ffffff" stroke="#ddd6c6" stroke-width="2"/>
    <text x="76" y="276" class="lbl" font-size="11.5" fill="#3d3a33">町内清掃のお知らせです。</text>
    <text x="76" y="294" class="lbl" font-size="11.5" fill="#3d3a33">・日付：9月7日（日）朝8時</text>
    <text x="76" y="312" class="lbl" font-size="11.5" fill="#3d3a33">・持ち物：軍手、タオル、飲み物</text>
    <text x="76" y="330" class="lbl" font-size="11.5" fill="#3d3a33">雨の日は、翌週に順延です。</text>
  </g>
  <g>
    <rect x="56" y="248" width="84" height="19" rx="9.5" fill="#b85f3d"/>
    <text x="98" y="261.5" text-anchor="middle" class="lbl" font-size="10.5" fill="#ffffff">③ 返ってくる</text>
  </g>

  <!-- 入力欄 -->
  <g>
    <rect x="64" y="408" width="232" height="30" rx="15" fill="#ffffff" stroke="#d8cdb4" stroke-width="2"/>
    <circle cx="82" cy="423" r="9" fill="none" stroke="#7a8a6a" stroke-width="2"/>
    <path d="M78 423 h8 M82 419 v8" stroke="#7a8a6a" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="427" class="lbl" font-size="10.5" fill="#9b917e">メッセージ</text>
  </g>
</svg>
