<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">むかしは呪文を覚えた人だけ、いまは日本語でだれでも頼める</title>
  <desc id="d">左（むかし）では、英語のような記号が並んだ黒板の前で代表マスコットが汗をかき「私には、無理……」とつぶやいている。右（いま）では、代表マスコットが「今月が誕生日の人を、一覧にしてください」と日本語で頼み、AIさん人形が「日本語で、どうぞ」と言いながら「できました」と書かれた一覧のカードを差し出している。</desc>
