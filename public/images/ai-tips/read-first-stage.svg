<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="人形劇の舞台で、付箋だらけの分厚い通知の束を抱えたメガネの所長さん人形が「付箋を貼って、力尽きた…」と困り、蝶ネクタイのAIさんが「先に私が読みましょう」と答えている図">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; }
    </style>
  </defs>

  <!-- 舞台背景（クリーム） -->
  <rect width="640" height="360" rx="16" fill="#faf6ef"/>

  <!-- 事務室の書き割り -->
  <rect x="12" y="56" width="616" height="248" fill="#eef3e6"/>
  <!-- 壁の時計 -->
  <circle cx="560" cy="100" r="20" fill="#ffffff" stroke="#8a7a5c" stroke-width="3"/>
  <line x1="560" y1="100" x2="560" y2="88" stroke="#8a7a5c" stroke-width="3" stroke-linecap="round"/>
  <line x1="560" y1="100" x2="569" y2="104" stroke="#8a7a5c" stroke-width="3" stroke-linecap="round"/>
  <!-- 本棚 -->
  <g transform="translate(60 150)">
    <rect x="-8" y="-10" width="120" height="60" fill="#d8cdb4" stroke="#8a7a5c" stroke-width="2.5"/>
    <rect x="0" y="0" width="14" height="42" fill="#4a8c3f"/>
    <rect x="17" y="6" width="14" height="36" fill="#b85f3d"/>
    <rect x="34" y="2" width="14" height="40" fill="#3a6ea5"/>
    <rect x="51" y="8" width="14" height="34" fill="#c9a44a"/>
    <rect x="68" y="4" width="14" height="38" fill="#2d5a27"/>
    <rect x="85" y="10" width="18" height="32" fill="#e8d9b8" stroke="#8a7a5c" stroke-width="2"/>
  </g>

  <!-- 緞帳（どんちょう） -->
  <rect x="0" y="0" width="640" height="42" fill="#b85f3d"/>
  <path d="M0 42 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 v-8 h-640 Z" fill="#b85f3d"/>
  <g fill="#a04e2f" opacity="0.5">
    <rect x="70" y="0" width="7" height="40"/>
    <rect x="230" y="0" width="7" height="40"/>
    <rect x="390" y="0" width="7" height="40"/>
    <rect x="550" y="0" width="7" height="40"/>
  </g>
  <!-- 袖幕（左右・細め） -->
  <path d="M0 0 h34 q8 84 -4 164 q-8 54 -30 72 Z" fill="#a04e2f"/>
  <path d="M640 0 h-34 q-8 84 4 164 q8 54 30 72 Z" fill="#a04e2f"/>

  <!-- 木の看板（中央・ぶら下がり） -->
  <line x1="320" y1="42" x2="320" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="252" y1="42" x2="260" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="388" y1="42" x2="380" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <g transform="translate(222 58)">
    <rect width="196" height="38" rx="6" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="3"/>
    <text x="98" y="25" text-anchor="middle" class="cap" font-size="15" fill="#4a3b2f">第五幕「長い通知」</text>
  </g>

  <!-- ふきだし（所長さん・左上） -->
  <g>
    <rect x="26" y="58" width="196" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M150 98 l12 16 l4 -16 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="124" y="83" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">付箋を貼って、力尽きた…</text>
  </g>

  <!-- ふきだし（AIさん・右） -->
  <g>
    <rect x="396" y="118" width="222" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M516 158 l-4 14 l-10 -14 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="507" y="143" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">先に私が読みましょう</text>
  </g>

  <!-- 所長さん（メガネの事務方の人形） -->
  <g transform="translate(210 202)">
    <!-- 胴体（青いカーディガン） -->
    <path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36 C36 18 -36 18 -52 36 Z" fill="#3a6ea5"/>
    <path d="M-14 22 L0 44 L14 22 L0 30 Z" fill="#faf6ef"/>
    <line x1="0" y1="44" x2="0" y2="116" stroke="#2a5580" stroke-width="2.5"/>
    <circle cx="0" cy="58" r="3.5" fill="#c9a44a"/>
    <circle cx="0" cy="78" r="3.5" fill="#c9a44a"/>
    <path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36" fill="none" stroke="#8ba3c4" stroke-width="1.6" stroke-dasharray="4 4"/>
    <!-- 腕（左：通知の束を抱える） -->
    <path d="M-44 48 C-70 54 -84 42 -88 26" fill="none" stroke="#3a6ea5" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-90" cy="22" r="11" fill="#f0c9a8"/>
    <!-- 分厚い通知の束（付箋つき） -->
    <g transform="translate(-152 -22) rotate(-6)">
      <rect x="4" y="10" width="78" height="56" rx="3" fill="#e8e2d2" stroke="#8a7a5c" stroke-width="2"/>
      <rect x="2" y="5" width="78" height="56" rx="3" fill="#f1ecdd" stroke="#8a7a5c" stroke-width="2"/>
      <rect x="0" y="0" width="78" height="56" rx="3" fill="#ffffff" stroke="#8a7a5c" stroke-width="2.5"/>
      <text x="39" y="22" text-anchor="middle" class="cap" font-size="12" fill="#6b5a3c">厚労省より</text>
      <text x="39" y="42" text-anchor="middle" class="cap" font-size="11" fill="#9e4a3a">全30ページ</text>
      <!-- 付箋 -->
      <rect x="70" y="6" width="16" height="8" fill="#d97757"/>
      <rect x="72" y="20" width="16" height="8" fill="#c9a44a"/>
      <rect x="70" y="34" width="16" height="8" fill="#4a8c3f"/>
      <rect x="72" y="48" width="16" height="8" fill="#d97757" opacity="0.8"/>
    </g>
    <!-- 腕（右：ほほに手） -->
    <path d="M44 52 C66 58 72 44 66 28" fill="none" stroke="#3a6ea5" stroke-width="18" stroke-linecap="round"/>
    <circle cx="64" cy="24" r="11" fill="#f0c9a8"/>
    <!-- 頭 -->
    <circle cx="0" cy="-30" r="52" fill="#f0c9a8"/>
    <path d="M-52 -30 a52 52 0 0 1 104 0" fill="none" stroke="#d9b28c" stroke-width="1.6" stroke-dasharray="4 4"/>
    <!-- 髪（グレーのまとめ髪＋おだんご） -->
    <path d="M-52 -34 C-50 -86 50 -86 52 -34 C36 -58 -36 -58 -52 -34 Z" fill="#9a9186"/>
    <circle cx="0" cy="-84" r="13" fill="#9a9186"/>
    <circle cx="0" cy="-84" r="13" fill="none" stroke="#847b70" stroke-width="1.6" stroke-dasharray="4 4"/>
    <rect x="8" y="-94" width="18" height="4" rx="2" transform="rotate(-30 8 -94)" fill="#c9a44a"/>
    <!-- 眉（困り） -->
    <path d="M-36 -50 q14 -10 26 -3" stroke="#4a3b2f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M10 -53 q14 -3 26 7" stroke="#4a3b2f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 金縁の丸メガネ＋目 -->
    <circle cx="-18" cy="-28" r="14" fill="#ffffff" opacity="0.4" stroke="#c9a44a" stroke-width="3"/>
    <circle cx="18" cy="-28" r="14" fill="#ffffff" opacity="0.4" stroke="#c9a44a" stroke-width="3"/>
    <line x1="-4" y1="-30" x2="4" y2="-30" stroke="#c9a44a" stroke-width="3"/>
    <circle cx="-18" cy="-28" r="6" fill="#2a2620"/>
    <circle cx="18" cy="-28" r="6" fill="#2a2620"/>
    <circle cx="-16" cy="-30" r="2" fill="#ffffff"/>
    <circle cx="20" cy="-30" r="2" fill="#ffffff"/>
    <!-- ほほ -->
    <circle cx="-34" cy="-8" r="6" fill="#e8a87c" opacity="0.55"/>
    <circle cx="34" cy="-8" r="6" fill="#e8a87c" opacity="0.55"/>
    <!-- 口（へにゃ） -->
    <path d="M-8 6 q8 -6 16 2" stroke="#9e4a3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- AIさん（続投デザイン＋蝶ネクタイ。机に足元が隠れる高さ） -->
  <g transform="translate(0 46)">
    <rect x="452" y="150" width="68" height="58" rx="14" fill="#2d5a27"/>
    <line x1="486" y1="140" x2="486" y2="150" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="486" cy="136" r="5" fill="#d97757"/>
    <path d="M466 174 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M494 174 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M476 192 q10 7 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M486 214 l-16 -9 v18 z" fill="#b85f3d"/>
    <path d="M486 214 l16 -9 v18 z" fill="#b85f3d"/>
    <circle cx="486" cy="214" r="4" fill="#c9a44a"/>
    <rect x="460" y="222" width="52" height="42" rx="10" fill="#4a8c3f" opacity="0.9"/>
  </g>

  <!-- 事務机の書き割り（手前。人形の下半身を隠す） -->
  <g>
    <rect x="-10" y="308" width="660" height="60" fill="#8a6a48"/>
    <rect x="-10" y="300" width="660" height="14" rx="6" fill="#a5825c"/>
    <!-- 回覧板 -->
    <g transform="translate(300 306) rotate(-3)">
      <rect width="88" height="30" rx="4" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="2.5"/>
      <circle cx="10" cy="8" r="4" fill="#6b4a2f"/>
      <text x="50" y="21" text-anchor="middle" class="cap" font-size="14" fill="#4a3b2f">回覧</text>
    </g>
    <!-- 湯のみ -->
    <g transform="translate(120 292)">
      <rect x="0" y="8" width="26" height="20" rx="4" fill="#4a8c3f"/>
      <path d="M3 4 q10 -8 20 0" fill="none" stroke="#b8b2a4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>
</svg>
