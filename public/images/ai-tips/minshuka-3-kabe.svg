<g transform="translate(296 162)"><circle cx="0" cy="6" r="6" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.2"/><path d="M-7 24 v-6 q0-6 7-6 q7 0 7 6 v6Z" fill="#4a8c3f"/></g>
<g transform="translate(320 162)"><circle cx="0" cy="6" r="6" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.2"/><path d="M-7 24 v-6 q0-6 7-6 q7 0 7 6 v6Z" fill="#4a8c3f"/></g>
<g transform="translate(344 162)"><circle cx="0" cy="6" r="6" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.2"/><path d="M-7 24 v-6 q0-6 7-6 q7 0 7 6 v6Z" fill="#4a8c3f"/></g>
<g transform="translate(470 228)"><circle cx="0" cy="6" r="6" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.2"/><path d="M-7 24 v-6 q0-6 7-6 q7 0 7 6 v6Z" fill="#4a8c3f"/></g>
<g transform="translate(490 228)"><circle cx="0" cy="6" r="6" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.2"/><path d="M-7 24 v-6 q0-6 7-6 q7 0 7 6 v6Z" fill="#4a8c3f"/></g>
<g transform="translate(510 228)"><circle cx="0" cy="6" r="6" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.2"/><path d="M-7 24 v-6 q0-6 7-6 q7 0 7 6 v6Z" fill="#4a8c3f"/></g>
<g transform="translate(530 228)"><circle cx="0" cy="6" r="6" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.2"/><path d="M-7 24 v-6 q0-6 7-6 q7 0 7 6 v6Z" fill="#4a8c3f"/></g>
<g transform="translate(550 228)"><circle cx="0" cy="6" r="6" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.2"/><path d="M-7 24 v-6 q0-6 7-6 q7 0 7 6 v6Z" fill="#4a8c3f"/></g>
<g transform="translate(570 228)"><circle cx="0" cy="6" r="6" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.2"/><path d="M-7 24 v-6 q0-6 7-6 q7 0 7 6 v6Z" fill="#4a8c3f"/></g>
<g transform="translate(590 228)"><circle cx="0" cy="6" r="6" fill="#f3d3b3" stroke="#2b2a27" stroke-width="1.2"/><path d="M-7 24 v-6 q0-6 7-6 q7 0 7 6 v6Z" fill="#4a8c3f"/></g>
  <g class="mono" font-size="12.5" text-anchor="middle" fill="#2b2a27">
    <rect x="30" y="294" width="160" height="28" rx="6" fill="#fff" stroke="#d6cbb3"/>
    <text x="110" y="313">10110000 01100001</text>
    <rect x="240" y="294" width="160" height="28" rx="6" fill="#fff" stroke="#d6cbb3"/>
    <text x="320" y="313">print("こんにちは")</text>
  </g>
  <rect x="450" y="294" width="160" height="28" rx="6" fill="#fff" stroke="#d97757"/>
  <text x="530" y="313" class="hand" font-size="14" text-anchor="middle" fill="#2b2a27">「あいさつを出して」</text>
  <g class="hand" text-anchor="middle">
    <text x="110" y="346" font-size="13" fill="#7c7360">1940〜50年代</text>
    <text x="320" y="346" font-size="13" fill="#7c7360">1950年代〜</text>
    <text x="530" y="346" font-size="13" fill="#b4542f">2020年代〜</text>
    <text x="110" y="370" font-size="15" font-weight="700" fill="#2b2a27">ひと握りの研究者</text>
    <text x="320" y="370" font-size="15" font-weight="700" fill="#2b2a27">勉強した人</text>
    <text x="530" y="370" font-size="15" font-weight="700" fill="#b4542f">話せる人みんな</text>
  </g>
  <text x="320" y="394" class="serif mute" font-size="12" text-anchor="middle">壁の上に立てる人＝コンピュータに仕事を頼める人</text>
</svg>
