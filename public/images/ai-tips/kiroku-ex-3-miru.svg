<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" width="640" height="244" role="img" aria-label="四列の流れ図を右から左へ。AI の仕分け係が パソコンの保管庫に 日々 と ページ を書き、同期で Google ドライブを経て、同期アプリがスマホ内フォルダへ運ぶ。スマホに Obsidian モバイルがあればノートと糸の地図が見え、ドライブアプリだけならファイルの一覧しか見えない">
  <defs>
    <style>
      .t { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; fill: #2f2a24; font-size: 12px; }
      .s { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; fill: #8a7f6e; font-size: 10.5px; }
      .h { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; fill: #8a7f6e; font-size: 11.5px; letter-spacing: 1px; }
      .ok { fill: #3f7a5a; }
      .box { fill: #ffffff; stroke: #2f2a24; stroke-width: 1.3; }
      .box-ok { fill: #eef3e6; stroke: #3f7a5a; stroke-width: 1.3; }
      .ghost { fill: none; stroke: #8a7f6e; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .dev { fill: #ffffff; stroke: #2f2a24; stroke-width: 1.2; }
      .col { stroke: #e2dccf; stroke-dasharray: 3 4; }
      .ar { stroke: #2f2a24; stroke-width: 1.5; fill: none; marker-end: url(#m-ink); }
      .ar-ok { stroke: #3f7a5a; stroke-width: 1.5; fill: none; marker-end: url(#m-ok); }
    </style>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#2f2a24"/></marker>
    <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#3f7a5a"/></marker>
  </defs>

  <rect width="640" height="244" rx="16" fill="#faf6ef"/>

  <text class="h" x="105" y="24" text-anchor="middle">スマホ（Android）</text>
  <text class="h" x="270" y="24" text-anchor="middle">クラウド</text>
  <text class="h" x="425" y="24" text-anchor="middle">パソコン</text>
  <text class="h" x="570" y="24" text-anchor="middle">AI</text>
  <line class="col" x1="197" y1="36" x2="197" y2="222"/>
  <line class="col" x1="337" y1="36" x2="337" y2="222"/>
  <line class="col" x1="507" y1="36" x2="507" y2="222"/>

  <!-- AI -->
  <rect class="box-ok" x="515" y="90" width="110" height="50" rx="8"/>
  <text class="t" x="570" y="109" text-anchor="middle">仕分け係</text>
  <text class="s" x="570" y="126" text-anchor="middle">日々/ ページ/ を書く</text>
  <line class="ar-ok" x1="513" y1="115" x2="495" y2="115"/>
  <text class="s ok" x="504" y="106" text-anchor="middle">書く</text>

  <!-- Mac -->
  <rect class="box-ok" x="358" y="84" width="134" height="62" rx="5"/>
  <text class="t" x="425" y="103" text-anchor="middle">保管庫 記録/</text>
  <text class="s" x="425" y="120" text-anchor="middle">raw/ 日々/ ページ/</text>
  <text class="s" x="425" y="135" text-anchor="middle">パソコンの Obsidian で地図が見える</text>
  <line class="ar" x1="356" y1="115" x2="333" y2="115"/>
  <text class="s" x="344" y="106" text-anchor="middle">同期</text>

  <!-- クラウド -->
  <rect class="box" x="210" y="90" width="120" height="50" rx="8"/>
  <text class="t" x="270" y="109" text-anchor="middle">Google ドライブ</text>
  <text class="s" x="270" y="126" text-anchor="middle">記録/ 全体</text>
  <line class="ar-ok" x1="208" y1="115" x2="188" y2="115"/>
  <text class="s ok" x="198" y="106" text-anchor="middle">同期アプリ</text>

  <!-- スマホ -->
  <rect class="dev" x="25" y="44" width="160" height="172" rx="14"/>
  <rect class="box-ok" x="40" y="62" width="130" height="58" rx="5"/>
  <text class="t ok" x="105" y="80" text-anchor="middle">Obsidian モバイル</text>
  <text class="s" x="105" y="97" text-anchor="middle">ノートが読める</text>
  <text class="s" x="105" y="111" text-anchor="middle">糸の地図（グラフ）が見える</text>
  <rect class="ghost" x="40" y="140" width="130" height="58" rx="5"/>
  <text class="s" x="105" y="159" text-anchor="middle">ドライブアプリだけ</text>
  <text class="s" x="105" y="175" text-anchor="middle">ファイルの一覧は見えるが</text>
  <text class="s" x="105" y="189" text-anchor="middle">糸も地図も出ない</text>

  <text class="t ok" x="320" y="234" text-anchor="middle">同じ道を、逆向きに戻ってきます</text>
</svg>
