<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
  <title id="t">AIは、人と職人さんのあいだに入った通訳</title>
  <desc id="d">上段（むかし）は、人が職人さんの言葉を自分で勉強して書き、コンピュータに直接渡している。下段（いま）は、人が日本語でお願いし、AIさん人形が通訳として職人さんの言葉に訳してから、コンピュータに渡している。</desc>
  <defs>
    <style>
      .ink{fill:#2b2a27}.mute{fill:#6b6a66}
      .hand{font-family:"Zen Kurenaido","Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
      .serif{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
      .mono{font-family:"SFMono-Regular",Menlo,Consolas,"Courier New",monospace}
    </style>
    <g id="person">
      <ellipse cx="0" cy="176" rx="46" ry="7" fill="#e3d9c3"/>
      <path d="M-34 172 V80 q0-30 34-30 q34 0 34 30 V172 Z" fill="#4a8c3f"/>
      <circle cx="0" cy="26" r="34" fill="#f3d3b3" stroke="#2b2a27" stroke-width="2"/>
      <path d="M-34 20 q10-36 46-28 q22 6 22 26 q-16-14-38-8 q-18 6-30 10Z" fill="#3b2f2a"/>
      <circle cx="-11" cy="30" r="3" fill="#2b2a27"/>
      <circle cx="11" cy="30" r="3" fill="#2b2a27"/>
      <path d="M-7 44 q7 5 14 0" stroke="#2b2a27" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <g id="robot">
      <ellipse cx="0" cy="156" rx="44" ry="7" fill="#e3d9c3"/>
      <rect x="-34" y="40" width="68" height="104" rx="18" fill="#d97757"/>
      <rect x="-9" y="26" width="18" height="16" rx="4" fill="#6b6a66" stroke="#2b2a27" stroke-width="1.5"/>
      <rect x="-30" y="-30" width="60" height="58" rx="14" fill="#fff" stroke="#2b2a27" stroke-width="2"/>
      <rect x="-22" y="-20" width="44" height="34" rx="8" fill="#2b2a27"/>
      <circle cx="-9" cy="-4" r="5" fill="#8fe3a3"/>
      <circle cx="9" cy="-4" r="5" fill="#8fe3a3"/>
      <path d="M-8 6 q8 5 16 0" stroke="#8fe3a3" stroke-width="2" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="0" y2="-44" stroke="#2b2a27" stroke-width="2"/>
      <circle cx="0" cy="-48" r="5" fill="#d97757" stroke="#2b2a27" stroke-width="2"/>
      <path d="M-12 44 l10 6 l-10 6Z M12 44 l-10 6 l10 6Z" fill="#2b2a27"/>
    </g>
  </defs>
  <rect width="640" height="380" fill="#f7f1e3"/>
  <rect x="0" y="0" width="640" height="180" fill="#ece5d5"/>
  <text x="20" y="34" class="hand" font-size="20" font-weight="700" fill="#7c7360">むかし</text>
  <g transform="translate(76 66) scale(.48)"><use href="#person"/></g>
<path d="M120 112 H494 M484 104 l10 8 l-10 8" stroke="#8f846f" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="306" y="98" class="hand" font-size="15" fill="#5f5847" text-anchor="middle">職人さんの言葉を、自分で勉強して書く</text>
  <text x="306" y="138" class="mono" font-size="12" fill="#7c7360" text-anchor="middle">for r in csv.DictReader(f): …</text>
<g transform="translate(512 74)"><rect x="0" y="0" width="84" height="58" rx="6" fill="#fff" stroke="#2b2a27" stroke-width="2"/><rect x="8" y="8" width="68" height="42" rx="3" fill="#2f4a3a"/><path d="M16 22 h30 M16 32 h44 M16 42 h22" stroke="#8fe3a3" stroke-width="3" stroke-linecap="round"/><path d="M36 58 v10 M24 70 h36" stroke="#2b2a27" stroke-width="3" stroke-linecap="round"/></g>
  <text x="554" y="170" class="hand" font-size="13" fill="#5f5847" text-anchor="middle">コンピュータ（職人さん）</text>
  <text x="20" y="214" class="hand" font-size="20" font-weight="700" fill="#2f5d3a">いま</text>
  <g transform="translate(76 236) scale(.48)"><use href="#person"/></g>
<path d="M120 282 H250 M240 274 l10 8 l-10 8" stroke="#4a8c3f" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="186" y="268" class="hand" font-size="15" fill="#264a2c" text-anchor="middle">日本語でお願い</text>
  <g transform="translate(306 258) scale(.48)"><use href="#robot"/></g>
  <text x="306" y="350" class="hand" font-size="14" font-weight="700" fill="#b4542f" text-anchor="middle">AIさん（通訳）</text>
<path d="M352 282 H494 M484 274 l10 8 l-10 8" stroke="#d97757" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="424" y="268" class="hand" font-size="15" fill="#8a3d22" text-anchor="middle">職人さんの言葉に訳す</text>
<g transform="translate(512 244)"><rect x="0" y="0" width="84" height="58" rx="6" fill="#fff" stroke="#2b2a27" stroke-width="2"/><rect x="8" y="8" width="68" height="42" rx="3" fill="#2f4a3a"/><path d="M16 22 h30 M16 32 h44 M16 42 h22" stroke="#8fe3a3" stroke-width="3" stroke-linecap="round"/><path d="M36 58 v10 M24 70 h36" stroke="#2b2a27" stroke-width="3" stroke-linecap="round"/></g>
  <text x="554" y="340" class="hand" font-size="13" fill="#5f5847" text-anchor="middle">コンピュータ（職人さん）</text>
  <text x="320" y="374" class="serif mute" font-size="12" text-anchor="middle">職人さんの言葉がなくなったのではない。書く係が、人からAIに代わった</text>
</svg>
