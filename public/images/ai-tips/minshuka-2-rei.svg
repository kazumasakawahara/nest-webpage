<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">民主化＝ひと握りの人のものが、みんなのものになる</title>
  <desc id="d">写真・文書・プログラムの三つについて、むかしといまを並べた図。写真は写真館で撮ってもらうものから、スマホでだれでも撮るものへ。文書は専門の人が和文タイプで打つものから、パソコンでだれでも作るものへ。プログラムは勉強した人だけが書くものから、日本語でだれでも頼めるものへ。</desc>
  <defs>
    <style>
      .ink{fill:#2b2a27}.mute{fill:#6b6a66}
      .hand{font-family:"Zen Kurenaido","Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
      .serif{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
      .mono{font-family:"SFMono-Regular",Menlo,Consolas,"Courier New",monospace}
    </style>
    <g id="person">
      <ellipse cx="0" cy="176" rx="46" ry="7" fill="#e3d9c3"/>
      <path d="M-34 172 V80 q0-30 34-30 q34 0 34 30 V172 Z" fill="#4a8c3f"/>
      <circle cx="0" cy="26" r="34" fill="#f3d3b3" stroke="#2b2a27" stroke-width="2"/>
      <path d="M-34 20 q10-36 46-28 q22 6 22 26 q-16-14-38-8 q-18 6-30 10Z" fill="#3b2f2a"/>
      <circle cx="-11" cy="30" r="3" fill="#2b2a27"/>
      <circle cx="11" cy="30" r="3" fill="#2b2a27"/>
      <path d="M-7 44 q7 5 14 0" stroke="#2b2a27" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <g id="robot">
      <ellipse cx="0" cy="156" rx="44" ry="7" fill="#e3d9c3"/>
      <rect x="-34" y="40" width="68" height="104" rx="18" fill="#d97757"/>
      <rect x="-9" y="26" width="18" height="16" rx="4" fill="#6b6a66" stroke="#2b2a27" stroke-width="1.5"/>
      <rect x="-30" y="-30" width="60" height="58" rx="14" fill="#fff" stroke="#2b2a27" stroke-width="2"/>
      <rect x="-22" y="-20" width="44" height="34" rx="8" fill="#2b2a27"/>
      <circle cx="-9" cy="-4" r="5" fill="#8fe3a3"/>
      <circle cx="9" cy="-4" r="5" fill="#8fe3a3"/>
      <path d="M-8 6 q8 5 16 0" stroke="#8fe3a3" stroke-width="2" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="0" y2="-44" stroke="#2b2a27" stroke-width="2"/>
      <circle cx="0" cy="-48" r="5" fill="#d97757" stroke="#2b2a27" stroke-width="2"/>
      <path d="M-12 44 l10 6 l-10 6Z M12 44 l-10 6 l10 6Z" fill="#2b2a27"/>
    </g>
  </defs>
  <rect width="640" height="400" fill="#f7f1e3"/>
  <text x="320" y="34" class="hand ink" font-size="19" font-weight="700" text-anchor="middle">「民主化」＝ ひと握りの人のものが、みんなのものになる</text>
  <text x="237" y="56" class="hand mute" font-size="13" text-anchor="middle">むかし</text><text x="508" y="56" class="hand mute" font-size="13" text-anchor="middle">いま</text>
  <g transform="translate(0 62)">
    <text x="70" y="52" class="hand ink" font-size="18" font-weight="700" text-anchor="middle">写真</text>
    <rect x="130" y="4" width="214" height="84" rx="12" fill="#ece5d5" stroke="#d6cbb3" stroke-width="1.5"/>
    <text x="146" y="40" class="hand" font-size="16" font-weight="700" fill="#5f5847">写真館で、撮ってもらう</text>
    <text x="146" y="66" class="hand" font-size="13" fill="#7c7360">撮るのも現像も、専門の人</text>
    <path d="M354 46 h30 M376 38 l10 8 l-10 8" stroke="#d97757" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="396" y="4" width="224" height="84" rx="12" fill="#eaf2e5" stroke="#bcd7b3" stroke-width="2"/>
    <text x="412" y="40" class="hand" font-size="16" font-weight="700" fill="#264a2c">スマホで、だれでも撮る</text>
    <text x="412" y="66" class="hand" font-size="13" fill="#3f6b45">撮って、すぐ見られる</text>
  </g>
  <g transform="translate(0 162)">
    <text x="70" y="52" class="hand ink" font-size="18" font-weight="700" text-anchor="middle">文書</text>
    <rect x="130" y="4" width="214" height="84" rx="12" fill="#ece5d5" stroke="#d6cbb3" stroke-width="1.5"/>
    <text x="146" y="40" class="hand" font-size="16" font-weight="700" fill="#5f5847">清書は、専門の人が打つ</text>
    <text x="146" y="66" class="hand" font-size="13" fill="#7c7360">和文タイプは、習った人の技</text>
    <path d="M354 46 h30 M376 38 l10 8 l-10 8" stroke="#d97757" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="396" y="4" width="224" height="84" rx="12" fill="#eaf2e5" stroke="#bcd7b3" stroke-width="2"/>
    <text x="412" y="40" class="hand" font-size="16" font-weight="700" fill="#264a2c">パソコンで、だれでも作る</text>
    <text x="412" y="66" class="hand" font-size="13" fill="#3f6b45">書いて、直して、印刷する</text>
  </g>
  <g transform="translate(0 262)">
    <text x="70" y="52" class="hand ink" font-size="18" font-weight="700" text-anchor="middle">プログラム</text>
    <rect x="130" y="4" width="214" height="84" rx="12" fill="#ece5d5" stroke="#d6cbb3" stroke-width="1.5"/>
    <text x="146" y="40" class="hand" font-size="16" font-weight="700" fill="#5f5847">勉強した人だけが書く</text>
    <text x="146" y="66" class="hand" font-size="13" fill="#7c7360">職人さんの言葉を、何年も学ぶ</text>
    <path d="M354 46 h30 M376 38 l10 8 l-10 8" stroke="#d97757" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="396" y="4" width="224" height="84" rx="12" fill="#fbe7dc" stroke="#d97757" stroke-width="2"/>
    <text x="412" y="40" class="hand" font-size="16" font-weight="700" fill="#264a2c">日本語で、だれでも頼める</text>
    <text x="412" y="66" class="hand" font-size="13" fill="#3f6b45">書くのは、AIの係になった</text>
  </g>
  <text x="320" y="388" class="hand mute" font-size="13" text-anchor="middle">中身が簡単になったのではなく、使うための「入口」が低くなった</text>
</svg>
