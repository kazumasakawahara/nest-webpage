<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d">
  <title id="t">民主化のあとも、人の仕事は残る</title>
  <desc id="d">三つの枠が矢印でつながった図。①決める（人）：何に困っていて、何がほしいか。②書く（AIさん）：職人さんの言葉でプログラムや図を書く。③確かめる（人）：動くか、ちがわないか、使ってよいか。③から②へ「直してほしい所は、また日本語で」と書かれた点線の矢印が戻っている。</desc>
  <defs>
    <style>
      .ink{fill:#2b2a27}.mute{fill:#6b6a66}
      .hand{font-family:"Zen Kurenaido","Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
      .serif{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
      .mono{font-family:"SFMono-Regular",Menlo,Consolas,"Courier New",monospace}
    </style>
    <g id="person">
      <ellipse cx="0" cy="176" rx="46" ry="7" fill="#e3d9c3"/>
      <path d="M-34 172 V80 q0-30 34-30 q34 0 34 30 V172 Z" fill="#4a8c3f"/>
      <circle cx="0" cy="26" r="34" fill="#f3d3b3" stroke="#2b2a27" stroke-width="2"/>
      <path d="M-34 20 q10-36 46-28 q22 6 22 26 q-16-14-38-8 q-18 6-30 10Z" fill="#3b2f2a"/>
      <circle cx="-11" cy="30" r="3" fill="#2b2a27"/>
      <circle cx="11" cy="30" r="3" fill="#2b2a27"/>
      <path d="M-7 44 q7 5 14 0" stroke="#2b2a27" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <g id="robot">
      <ellipse cx="0" cy="156" rx="44" ry="7" fill="#e3d9c3"/>
      <rect x="-34" y="40" width="68" height="104" rx="18" fill="#d97757"/>
      <rect x="-9" y="26" width="18" height="16" rx="4" fill="#6b6a66" stroke="#2b2a27" stroke-width="1.5"/>
      <rect x="-30" y="-30" width="60" height="58" rx="14" fill="#fff" stroke="#2b2a27" stroke-width="2"/>
      <rect x="-22" y="-20" width="44" height="34" rx="8" fill="#2b2a27"/>
      <circle cx="-9" cy="-4" r="5" fill="#8fe3a3"/>
      <circle cx="9" cy="-4" r="5" fill="#8fe3a3"/>
      <path d="M-8 6 q8 5 16 0" stroke="#8fe3a3" stroke-width="2" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="0" y2="-44" stroke="#2b2a27" stroke-width="2"/>
      <circle cx="0" cy="-48" r="5" fill="#d97757" stroke="#2b2a27" stroke-width="2"/>
      <path d="M-12 44 l10 6 l-10 6Z M12 44 l-10 6 l10 6Z" fill="#2b2a27"/>
    </g>
  </defs>
  <rect width="640" height="320" fill="#f7f1e3"/>
  <text x="320" y="32" class="hand ink" font-size="19" font-weight="700" text-anchor="middle">民主化のあとも、人の仕事は残る</text>
  <rect x="20" y="52" width="180" height="168" rx="14" fill="#eaf2e5" stroke="#bcd7b3" stroke-width="2"/>
  <rect x="230" y="52" width="180" height="168" rx="14" fill="#fbe7dc" stroke="#d97757" stroke-width="2"/>
  <rect x="440" y="52" width="180" height="168" rx="14" fill="#eaf2e5" stroke="#bcd7b3" stroke-width="2"/>
  <g transform="translate(110 70) scale(.36)"><use href="#person"/></g>
  <g transform="translate(320 84) scale(.34)"><use href="#robot"/></g>
  <g transform="translate(530 70) scale(.36)"><use href="#person"/></g>
  <g class="hand" text-anchor="middle">
    <text x="110" y="158" font-size="18" font-weight="700" fill="#264a2c">① 決める（人）</text>
    <text x="110" y="182" font-size="13" fill="#3f6b45">何に困っていて、</text>
    <text x="110" y="200" font-size="13" fill="#3f6b45">何がほしいか</text>
    <text x="320" y="158" font-size="18" font-weight="700" fill="#8a3d22">② 書く（AIさん）</text>
    <text x="320" y="182" font-size="13" fill="#8a3d22">職人さんの言葉で</text>
    <text x="320" y="200" font-size="13" fill="#8a3d22">プログラムや図を書く</text>
    <text x="530" y="158" font-size="18" font-weight="700" fill="#264a2c">③ 確かめる（人）</text>
    <text x="530" y="182" font-size="13" fill="#3f6b45">動くか、ちがわないか、</text>
    <text x="530" y="200" font-size="13" fill="#3f6b45">使ってよいか</text>
  </g>
  <path d="M204 136 h20 M216 128 l8 8 l-8 8" stroke="#2b2a27" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M414 136 h20 M426 128 l8 8 l-8 8" stroke="#2b2a27" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M530 224 q0 44 -105 44 h-0 q-105 0 -105 -36" stroke="#d97757" stroke-width="3" fill="none" stroke-dasharray="7 5" stroke-linecap="round"/>
  <path d="M312 236 l8 -10 l8 10" stroke="#d97757" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="425" y="296" class="hand" font-size="14" fill="#8a3d22" text-anchor="middle">直してほしい所は、また日本語で</text>
</svg>
