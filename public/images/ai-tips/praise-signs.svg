<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="3コマの図。①「素晴らしい」で始まる：返事の1行目が「素晴らしいですね！」。②骨格そのまま：企画書の骨組みは変えずに、肯定の言葉だけが足されている。③すぐ折れる：少し反論しただけで「おっしゃるとおりです」と引き下がる">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <text x="24" y="34" class="lbl" font-size="17" font-weight="700" fill="#2f5d3a">ほめすぎのサインは、3つ</text>

  <!-- パネル1 -->
  <g transform="translate(20,52)">
    <rect width="192" height="228" rx="14" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
    <rect width="192" height="38" rx="14" fill="#f7ede7"/><rect y="26" width="192" height="12" fill="#f7ede7"/>
    <text x="96" y="25" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#b0492c">① 「素晴らしい」で始まる</text>
    <!-- 返事の紙 -->
    <rect x="26" y="56" width="140" height="100" rx="6" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
    <rect x="34" y="64" width="124" height="20" rx="4" fill="#fdf1ec" stroke="#d97757" stroke-width="1.5"/>
    <text x="96" y="78" text-anchor="middle" class="lbl" font-size="11" font-weight="700" fill="#b0492c">素晴らしいですね！</text>
    <line x1="36" y1="98" x2="150" y2="98" stroke="#ddd3c1" stroke-width="2"/>
    <line x1="36" y1="112" x2="130" y2="112" stroke="#ddd3c1" stroke-width="2"/>
    <line x1="36" y1="126" x2="144" y2="126" stroke="#ddd3c1" stroke-width="2"/>
    <line x1="36" y1="140" x2="110" y2="140" stroke="#ddd3c1" stroke-width="2"/>
    <text x="96" y="184" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">1行目がほめ言葉なら</text>
    <text x="96" y="201" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">あとの指摘は遠慮がち</text>
  </g>

  <!-- パネル2 -->
  <g transform="translate(224,52)">
    <rect width="192" height="228" rx="14" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
    <rect width="192" height="38" rx="14" fill="#f7ede7"/><rect y="26" width="192" height="12" fill="#f7ede7"/>
    <text x="96" y="25" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#b0492c">② 骨格は、そのまま</text>
    <!-- 自分の案 → AIの返事 -->
    <rect x="18" y="60" width="64" height="84" rx="5" fill="#ffffff" stroke="#8a7a5c" stroke-width="1.5"/>
    <text x="50" y="76" text-anchor="middle" class="lbl" font-size="9" fill="#4a3b2f">私の案</text>
    <g stroke="#2a2620" stroke-width="2.4" stroke-linecap="round"><line x1="26" y1="90" x2="74" y2="90"/><line x1="26" y1="104" x2="66" y2="104"/><line x1="26" y1="118" x2="72" y2="118"/></g>
    <path d="M88 100 h14 M98 94 l6 6 -6 6" fill="none" stroke="#b7ac97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="110" y="60" width="64" height="84" rx="5" fill="#ffffff" stroke="#8a7a5c" stroke-width="1.5"/>
    <text x="142" y="76" text-anchor="middle" class="lbl" font-size="9" fill="#4a3b2f">AIの返事</text>
    <g stroke="#2a2620" stroke-width="2.4" stroke-linecap="round"><line x1="118" y1="90" x2="166" y2="90"/><line x1="118" y1="104" x2="158" y2="104"/><line x1="118" y1="118" x2="164" y2="118"/></g>
    <!-- 飾りの言葉 -->
    <g fill="#d97757" opacity="0.9">
      <path d="M166 64 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
      <path d="M114 128 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
      <path d="M170 132 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
    </g>
    <text x="96" y="184" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">骨組みは同じで</text>
    <text x="96" y="201" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">飾りの言葉だけ増えている</text>
  </g>

  <!-- パネル3 -->
  <g transform="translate(428,52)">
    <rect width="192" height="228" rx="14" fill="#ffffff" stroke="#ddd3c1" stroke-width="1.5"/>
    <rect width="192" height="38" rx="14" fill="#f7ede7"/><rect y="26" width="192" height="12" fill="#f7ede7"/>
    <text x="96" y="25" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#b0492c">③ すぐ折れる</text>
    <rect x="18" y="60" width="120" height="30" rx="10" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="1.2"/>
    <text x="78" y="79" text-anchor="middle" class="lbl" font-size="11" fill="#2a2620">でも、それは違うと思う</text>
    <rect x="54" y="104" width="120" height="30" rx="10" fill="#f7ede7" stroke="#d97757" stroke-width="1.2"/>
    <text x="114" y="123" text-anchor="middle" class="lbl" font-size="11" fill="#2a2620">おっしゃるとおりです</text>
    <text x="96" y="158" text-anchor="middle" class="lbl" font-size="10" fill="#9a907c">（0.5秒）</text>
    <text x="96" y="184" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">意見ではなく</text>
    <text x="96" y="201" text-anchor="middle" class="lbl" font-size="11" fill="#5f5847">空気に合わせている証拠</text>
  </g>
</svg>
