<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="ホワイトボードに会話の吹き出しが下から積み上がり、上のほうの古い吹き出し（事業所名・参加人数・駐車場などの最初の前提）が薄れて読めなくなっている図。新しい話は下に足され、古い話から薄れていく">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <text x="24" y="36" class="lbl" font-size="17" font-weight="700" fill="#2f5d3a">会話は、ホワイトボードに書き足されていく</text>

  <!-- ボード -->
  <rect x="150" y="52" width="340" height="252" rx="6" fill="#ffffff" stroke="#8a7a5c" stroke-width="3"/>
  <rect x="230" y="304" width="180" height="8" rx="3" fill="#8a7a5c"/>

  <!-- 古い話（薄い） -->
  <g opacity="0.18">
    <rect x="166" y="62" width="210" height="24" rx="10" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="1.5"/>
    <text x="178" y="79" class="lbl" font-size="11.5" fill="#2a2620">うちの事業所は〇〇です。参加は40名</text>
  </g>
  <g opacity="0.28">
    <rect x="258" y="92" width="216" height="24" rx="10" fill="#f7ede7" stroke="#d97757" stroke-width="1.5"/>
    <text x="270" y="109" class="lbl" font-size="11.5" fill="#2a2620">駐車場は12台。雨天決行で考えます</text>
  </g>
  <g opacity="0.45">
    <rect x="166" y="122" width="190" height="24" rx="10" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="1.5"/>
    <text x="178" y="139" class="lbl" font-size="11.5" fill="#2a2620">会場はデイルーム。出演は3組</text>
  </g>
  <g opacity="0.65">
    <rect x="258" y="152" width="216" height="24" rx="10" fill="#f7ede7" stroke="#d97757" stroke-width="1.5"/>
    <text x="270" y="169" class="lbl" font-size="11.5" fill="#2a2620">出演順は、合唱→ハンドベル→……</text>
  </g>
  <g opacity="0.85">
    <rect x="166" y="182" width="200" height="24" rx="10" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="1.5"/>
    <text x="178" y="199" class="lbl" font-size="11.5" fill="#2a2620">案内文、もう少しやわらかく</text>
  </g>
  <g>
    <rect x="258" y="212" width="216" height="24" rx="10" fill="#f7ede7" stroke="#d97757" stroke-width="1.5"/>
    <text x="270" y="229" class="lbl" font-size="11.5" fill="#2a2620">はい、こちらでいかがでしょう……</text>
  </g>
  <g>
    <rect x="166" y="242" width="180" height="24" rx="10" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="1.5"/>
    <text x="178" y="259" class="lbl" font-size="11.5" fill="#2a2620">椅子の数はどうしよう</text>
  </g>
  <g>
    <rect x="258" y="272" width="216" height="24" rx="10" fill="#f7ede7" stroke="#d97757" stroke-width="1.5"/>
    <text x="270" y="289" class="lbl" font-size="11.5" fill="#2a2620">……どちらの事業所でしたか？</text>
  </g>

  <!-- 右：矢印「新しい話は下に」 -->
  <g transform="translate(512,150)">
    <path d="M12 0 v120 M4 110 l8 12 8 -12" fill="none" stroke="#4a8c3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="60" class="lbl" font-size="12" font-weight="700" fill="#2f5d3a">新しい話は</text>
    <text x="30" y="78" class="lbl" font-size="12" font-weight="700" fill="#2f5d3a">下に足される</text>
  </g>

  <!-- 左：矢印「古い話から薄れる」 -->
  <g transform="translate(24,60)">
    <path d="M116 120 v-100 M108 30 l8 -12 8 12" fill="none" stroke="#d97757" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
    <text x="0" y="40" class="lbl" font-size="12" font-weight="700" fill="#b0492c">古い話から</text>
    <text x="0" y="58" class="lbl" font-size="12" font-weight="700" fill="#b0492c">薄れていく</text>
    <text x="0" y="90" class="lbl" font-size="10.5" fill="#9a907c">消えるのは、たいてい</text>
    <text x="0" y="106" class="lbl" font-size="10.5" fill="#9a907c">いちばん大事な前提</text>
  </g>

  <text x="320" y="330" text-anchor="middle" class="lbl" font-size="11.5" fill="#7c7360">定員の大きさはAIごとに違います。数は覚えなくて大丈夫。「定員がある」ことだけ</text>
</svg>
