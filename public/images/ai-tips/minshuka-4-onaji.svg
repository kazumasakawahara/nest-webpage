  <rect width="640" height="360" fill="#f7f1e3"/>
  <text x="320" y="32" class="hand ink" font-size="19" font-weight="700" text-anchor="middle">同じお願いを、二つの言葉で</text>
  <rect x="20" y="50" width="352" height="232" rx="12" fill="#2f3a35" stroke="#2b2a27" stroke-width="2"/>
  <text x="36" y="76" class="hand" font-size="14" fill="#c9d6c4">職人さんの言葉（Python）で書くと</text>
  <g class="mono" font-size="12.5" fill="#e4eedb">
    <text x="36" y="112">import csv, datetime</text>
    <text x="36" y="136">m = datetime.date.today().month</text>
    <text x="36" y="160">with open("meibo.csv") as f:</text>
    <text x="66" y="184">for r in csv.DictReader(f):</text>
    <text x="96" y="208">if int(r["誕生月"]) == m:</text>
    <text x="126" y="232">print(r["名前"])</text>
  </g>
  <rect x="392" y="50" width="228" height="232" rx="12" fill="#fff" stroke="#d97757" stroke-width="2.5"/>
  <text x="408" y="76" class="hand" font-size="14" fill="#b4542f">日本語で頼むと</text>
  <g class="hand ink" font-size="19" font-weight="700">
    <text x="412" y="124">名簿の中から、</text>
    <text x="412" y="156">今月が誕生日の</text>
    <text x="412" y="188">人だけを選んで、</text>
    <text x="412" y="220">並べてください。</text>
  </g>
  <g class="hand" font-size="14">
    <circle cx="40" cy="306" r="9" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <path d="M35 301 l10 10 M45 301 l-10 10" stroke="#c0392b" stroke-width="2.5"/>
    <text x="58" y="311" fill="#5f5847">点やかっこが一つ違うだけで、動かない</text>
    <circle cx="412" cy="306" r="9" fill="none" stroke="#4a8c3f" stroke-width="2.5"/>
    <text x="428" y="311" fill="#264a2c">言い方が少し違っても通じる</text>
  </g>
  <text x="320" y="346" class="serif mute" font-size="12" text-anchor="middle">コンピュータがする仕事は、どちらも同じ</text>
</svg>
