<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="人形劇の舞台で、エラーE-052を表示して止まったコピー機を前に、メガネの所長さん人形が「E-052…？　説明書、どこ…」と困り、蝶ネクタイのAIさんがスマホを構えて「その画面、撮って見せてください」と答えている図">
  <defs>
    <style>
      .cap { font-family: 'Zen Kurenaido', 'Shippori Mincho B1', serif; }
    </style>
  </defs>

  <!-- 舞台背景（クリーム） -->
  <rect width="640" height="360" rx="16" fill="#faf6ef"/>

  <!-- 事務室の書き割り -->
  <rect x="12" y="56" width="616" height="248" fill="#eef3e6"/>
  <!-- 壁の時計 -->
  <circle cx="576" cy="96" r="18" fill="#ffffff" stroke="#8a7a5c" stroke-width="3"/>
  <line x1="576" y1="96" x2="576" y2="85" stroke="#8a7a5c" stroke-width="3" stroke-linecap="round"/>
  <line x1="576" y1="96" x2="584" y2="100" stroke="#8a7a5c" stroke-width="3" stroke-linecap="round"/>
  <!-- 観葉植物 -->
  <g transform="translate(52 236)">
    <path d="M14 26 q-20 -28 -6 -46 q10 14 10 30 Z" fill="#4a8c3f"/>
    <path d="M18 26 q2 -34 22 -40 q-2 20 -14 34 Z" fill="#2d5a27"/>
    <path d="M16 28 q22 -14 34 -6 q-12 12 -28 12 Z" fill="#4a8c3f"/>
    <path d="M0 28 h36 l-5 30 h-26 Z" fill="#b85f3d"/>
  </g>

  <!-- 緞帳（どんちょう） -->
  <rect x="0" y="0" width="640" height="42" fill="#b85f3d"/>
  <path d="M0 42 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 q40 24 80 0 v-8 h-640 Z" fill="#b85f3d"/>
  <g fill="#a04e2f" opacity="0.5">
    <rect x="70" y="0" width="7" height="40"/>
    <rect x="230" y="0" width="7" height="40"/>
    <rect x="390" y="0" width="7" height="40"/>
    <rect x="550" y="0" width="7" height="40"/>
  </g>
  <!-- 袖幕（左右・細め） -->
  <path d="M0 0 h34 q8 84 -4 164 q-8 54 -30 72 Z" fill="#a04e2f"/>
  <path d="M640 0 h-34 q-8 84 4 164 q8 54 30 72 Z" fill="#a04e2f"/>

  <!-- 木の看板（中央・ぶら下がり） -->
  <line x1="320" y1="42" x2="320" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="252" y1="42" x2="260" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="388" y1="42" x2="380" y2="60" stroke="#6b4a2f" stroke-width="3"/>
  <g transform="translate(216 58)">
    <rect width="208" height="38" rx="6" fill="#e8d9b8" stroke="#6b4a2f" stroke-width="3"/>
    <text x="104" y="25" text-anchor="middle" class="cap" font-size="15" fill="#4a3b2f">第七幕「写真で見せる」</text>
  </g>

  <!-- ふきだし（所長さん・左上） -->
  <g>
    <rect x="22" y="58" width="188" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M120 98 l12 16 l4 -16 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="116" y="83" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">E-052…？　説明書、どこ…</text>
  </g>

  <!-- ふきだし（AIさん・右） -->
  <g>
    <rect x="398" y="112" width="226" height="40" rx="12" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <path d="M512 152 l-4 14 l-10 -14 z" fill="#ffffff" stroke="#e6e0d4" stroke-width="2"/>
    <text x="511" y="137" text-anchor="middle" class="cap" font-size="15" fill="#2a2620">その画面、撮って見せてください</text>
  </g>

  <!-- 所長さん（メガネの事務方の人形） -->
  <g transform="translate(150 206)">
    <!-- 胴体（青いカーディガン） -->
    <path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36 C36 18 -36 18 -52 36 Z" fill="#3a6ea5"/>
    <path d="M-14 22 L0 44 L14 22 L0 30 Z" fill="#faf6ef"/>
    <line x1="0" y1="44" x2="0" y2="116" stroke="#2a5580" stroke-width="2.5"/>
    <circle cx="0" cy="58" r="3.5" fill="#c9a44a"/>
    <circle cx="0" cy="78" r="3.5" fill="#c9a44a"/>
    <path d="M-52 36 C-56 90 -46 118 0 118 C46 118 56 90 52 36" fill="none" stroke="#8ba3c4" stroke-width="1.6" stroke-dasharray="4 4"/>
    <!-- 腕（左：ほほに手） -->
    <path d="M-44 52 C-66 58 -72 44 -66 28" fill="none" stroke="#3a6ea5" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-64" cy="24" r="11" fill="#f0c9a8"/>
    <!-- 腕（右：コピー機を指す） -->
    <path d="M44 48 C70 50 84 42 94 30" fill="none" stroke="#3a6ea5" stroke-width="18" stroke-linecap="round"/>
    <circle cx="98" cy="26" r="11" fill="#f0c9a8"/>
    <!-- 頭 -->
    <circle cx="0" cy="-30" r="52" fill="#f0c9a8"/>
    <path d="M-52 -30 a52 52 0 0 1 104 0" fill="none" stroke="#d9b28c" stroke-width="1.6" stroke-dasharray="4 4"/>
    <!-- 髪（グレーのまとめ髪＋おだんご） -->
    <path d="M-52 -34 C-50 -86 50 -86 52 -34 C36 -58 -36 -58 -52 -34 Z" fill="#9a9186"/>
    <circle cx="0" cy="-84" r="13" fill="#9a9186"/>
    <circle cx="0" cy="-84" r="13" fill="none" stroke="#847b70" stroke-width="1.6" stroke-dasharray="4 4"/>
    <rect x="8" y="-94" width="18" height="4" rx="2" transform="rotate(-30 8 -94)" fill="#c9a44a"/>
    <!-- 眉（困り） -->
    <path d="M-36 -50 q14 -10 26 -3" stroke="#4a3b2f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M10 -53 q14 -3 26 7" stroke="#4a3b2f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 金縁の丸メガネ＋目 -->
    <circle cx="-18" cy="-28" r="14" fill="#ffffff" opacity="0.4" stroke="#c9a44a" stroke-width="3"/>
    <circle cx="18" cy="-28" r="14" fill="#ffffff" opacity="0.4" stroke="#c9a44a" stroke-width="3"/>
    <line x1="-4" y1="-30" x2="4" y2="-30" stroke="#c9a44a" stroke-width="3"/>
    <circle cx="-18" cy="-28" r="6" fill="#2a2620"/>
    <circle cx="18" cy="-28" r="6" fill="#2a2620"/>
    <circle cx="-16" cy="-30" r="2" fill="#ffffff"/>
    <circle cx="20" cy="-30" r="2" fill="#ffffff"/>
    <!-- ほほ -->
    <circle cx="-34" cy="-8" r="6" fill="#e8a87c" opacity="0.55"/>
    <circle cx="34" cy="-8" r="6" fill="#e8a87c" opacity="0.55"/>
    <!-- 口（へにゃ） -->
    <path d="M-8 6 q8 -6 16 2" stroke="#9e4a3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- コピー機（エラー停止中・中央） -->
  <g transform="translate(268 176)">
    <!-- 原稿カバー -->
    <rect x="-8" y="0" width="146" height="18" rx="6" fill="#9a907c"/>
    <!-- 本体 -->
    <rect x="0" y="16" width="130" height="118" rx="10" fill="#b7ac97" stroke="#8a7a5c" stroke-width="2.5"/>
    <!-- 操作パネル（エラー表示） -->
    <rect x="12" y="28" width="74" height="38" rx="6" fill="#faf6ef" stroke="#8a7a5c" stroke-width="2"/>
    <text x="49" y="46" text-anchor="middle" class="cap" font-size="15" font-weight="700" fill="#c0492c">E-052</text>
    <path d="M22 60 h54" stroke="#c0492c" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- 撮影フォーカス枠（AIさんのスマホが狙う先） -->
    <rect x="4" y="20" width="90" height="54" rx="8" fill="none" stroke="#ffd15c" stroke-width="3.5" stroke-dasharray="7 6"/>
    <!-- ボタン -->
    <g fill="#8b8271">
      <rect x="94" y="30" width="24" height="14" rx="4"/>
      <rect x="94" y="50" width="24" height="14" rx="4"/>
    </g>
    <!-- 用紙トレイ -->
    <rect x="10" y="82" width="110" height="16" rx="4" fill="#a59a84" stroke="#8a7a5c" stroke-width="2"/>
    <rect x="10" y="104" width="110" height="16" rx="4" fill="#a59a84" stroke="#8a7a5c" stroke-width="2"/>
    <!-- 途中で止まった紙 -->
    <path d="M30 76 l24 -14 h34 l-18 14 Z" fill="#ffffff" stroke="#8a7a5c" stroke-width="2"/>
  </g>

  <!-- AIさん（続投デザイン＋蝶ネクタイ。スマホを構える） -->
  <g transform="translate(0 46)">
    <!-- アンテナ -->
    <line x1="500" y1="140" x2="500" y2="150" stroke="#2d5a27" stroke-width="4" stroke-linecap="round"/>
    <circle cx="500" cy="136" r="5" fill="#d97757"/>
    <!-- 頭胴体 -->
    <rect x="466" y="150" width="68" height="58" rx="14" fill="#2d5a27"/>
    <path d="M480 174 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M508 174 q6 6 12 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <path d="M490 192 q10 7 20 0" fill="none" stroke="#faf6ef" stroke-width="3" stroke-linecap="round"/>
    <!-- 蝶ネクタイ -->
    <path d="M500 214 l-16 -9 v18 z" fill="#b85f3d"/>
    <path d="M500 214 l16 -9 v18 z" fill="#b85f3d"/>
    <circle cx="500" cy="214" r="4" fill="#c9a44a"/>
    <!-- 腕（左：スマホを構える） -->
    <path d="M466 190 C448 186 436 178 430 168" fill="none" stroke="#2d5a27" stroke-width="10" stroke-linecap="round"/>
    <!-- スマホ -->
    <g transform="translate(414 128) rotate(-8)">
      <rect x="0" y="0" width="28" height="48" rx="7" fill="#2a2620"/>
      <rect x="3" y="5" width="22" height="38" rx="4" fill="#8fe0b0"/>
      <circle cx="14" cy="10" r="2.5" fill="#2a2620"/>
    </g>
    <!-- シャッターのきらめき -->
    <g stroke="#ffd15c" stroke-width="3" stroke-linecap="round">
      <line x1="404" y1="118" x2="396" y2="110"/>
      <line x1="416" y1="112" x2="414" y2="102"/>
      <line x1="394" y1="132" x2="384" y2="130"/>
    </g>
    <!-- 下半身 -->
    <rect x="474" y="222" width="52" height="42" rx="10" fill="#4a8c3f" opacity="0.9"/>
  </g>

  <!-- 事務机の書き割り（手前。人形の下半身を隠す） -->
  <g>
    <rect x="-10" y="308" width="660" height="60" fill="#8a6a48"/>
    <rect x="-10" y="300" width="660" height="14" rx="6" fill="#a5825c"/>
    <!-- コピー用紙の束 -->
    <g transform="translate(180 288)">
      <rect x="0" y="10" width="64" height="8" fill="#e8e2d2" stroke="#8a7a5c" stroke-width="1.6"/>
      <rect x="2" y="2" width="64" height="8" fill="#ffffff" stroke="#8a7a5c" stroke-width="1.6"/>
    </g>
    <!-- 湯のみ -->
    <g transform="translate(560 292)">
      <rect x="0" y="8" width="26" height="20" rx="4" fill="#4a8c3f"/>
      <path d="M3 4 q10 -8 20 0" fill="none" stroke="#b8b2a4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>
</svg>
