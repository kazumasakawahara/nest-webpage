<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="引き継ぎメモの見本カード。4区画に分かれている。決まったこと：10月18日（土）午後、会場はデイルーム、出演は3組。前提：参加見込み40名、駐車場12台、雨天決行。残っている課題：椅子の借り先、案内文の配り方。次にやること：案内文の下書きを作る。下に「やめた案：体育館（遠くて送迎が回らない）」。右上に「人が読んで直しました」のチェック">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <!-- 台紙 -->
  <rect x="36" y="22" width="568" height="318" rx="8" fill="#d8cdb4"/>
  <rect x="44" y="30" width="552" height="302" rx="6" fill="#ffffff" stroke="#8a7a5c" stroke-width="2"/>
  <rect x="280" y="18" width="80" height="16" rx="5" fill="#8a7a5c"/>

  <text x="64" y="62" class="lbl" font-size="16" font-weight="700" fill="#4a3b2f">引き継ぎメモ ― 秋の音楽会（架空の例）</text>

  <!-- チェック -->
  <g transform="translate(452,44)">
    <rect width="132" height="26" rx="13" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="1.5"/>
    <circle cx="16" cy="13" r="8" fill="#4a8c3f"/>
    <path d="M12 13 l3 3 6 -6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="17.5" text-anchor="middle" class="lbl" font-size="10.5" font-weight="700" fill="#2f5d3a">人が読んで直しました</text>
  </g>

  <!-- 区画1：決まったこと -->
  <g transform="translate(64,82)">
    <rect width="250" height="96" rx="8" fill="#f3f6fb" stroke="#3a6ea5" stroke-width="1.5"/>
    <rect x="10" y="-9" width="82" height="18" rx="4" fill="#3a6ea5"/>
    <text x="51" y="4" text-anchor="middle" class="lbl" font-size="10.5" font-weight="700" fill="#fff">① 決まったこと</text>
    <text x="16" y="32" class="lbl" font-size="11.5" fill="#2a2620">・10月18日（土）午後</text>
    <text x="16" y="52" class="lbl" font-size="11.5" fill="#2a2620">・会場はデイルーム</text>
    <text x="16" y="72" class="lbl" font-size="11.5" fill="#2a2620">・出演は3組（4組目は時間が足りず見送り）</text>
    <!-- 赤ペンの追記 -->
    <path d="M144 76 q20 -10 40 -2" fill="none" stroke="#d9534f" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <text x="150" y="90" class="lbl" font-size="9" fill="#d9534f">← 理由を追記</text>
  </g>

  <!-- 区画2：前提 -->
  <g transform="translate(326,82)">
    <rect width="250" height="96" rx="8" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="1.5"/>
    <rect x="10" y="-9" width="150" height="18" rx="4" fill="#4a8c3f"/>
    <text x="85" y="4" text-anchor="middle" class="lbl" font-size="10.5" font-weight="700" fill="#fff">② 前提（変わらない条件）</text>
    <text x="16" y="32" class="lbl" font-size="11.5" fill="#2a2620">・参加見込み40名</text>
    <text x="16" y="52" class="lbl" font-size="11.5" fill="#2a2620">・駐車場は12台</text>
    <text x="16" y="72" class="lbl" font-size="11.5" fill="#2a2620">・雨天決行</text>
  </g>

  <!-- 区画3：残っている課題 -->
  <g transform="translate(64,194)">
    <rect width="250" height="80" rx="8" fill="#fdf8e8" stroke="#c9a44a" stroke-width="1.5"/>
    <rect x="10" y="-9" width="100" height="18" rx="4" fill="#c9a44a"/>
    <text x="60" y="4" text-anchor="middle" class="lbl" font-size="10.5" font-weight="700" fill="#fff">③ 残っている課題</text>
    <text x="16" y="32" class="lbl" font-size="11.5" fill="#2a2620">・椅子40脚の借り先</text>
    <text x="16" y="52" class="lbl" font-size="11.5" fill="#2a2620">・案内文の配り方（紙か、連絡アプリか）</text>
  </g>

  <!-- 区画4：次にやること -->
  <g transform="translate(326,194)">
    <rect width="250" height="80" rx="8" fill="#f7ede7" stroke="#b85f3d" stroke-width="1.5"/>
    <rect x="10" y="-9" width="86" height="18" rx="4" fill="#b85f3d"/>
    <text x="53" y="4" text-anchor="middle" class="lbl" font-size="10.5" font-weight="700" fill="#fff">④ 次にやること</text>
    <text x="16" y="32" class="lbl" font-size="11.5" fill="#2a2620">・案内文の下書きを作る</text>
    <text x="16" y="52" class="lbl" font-size="11.5" fill="#2a2620">・椅子の借り先に電話（担当：わたし）</text>
  </g>

  <!-- やめた案 -->
  <g transform="translate(64,290)">
    <rect width="512" height="28" rx="6" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="12" y="19" class="lbl" font-size="11" fill="#5f5847">やめた案：体育館（遠くて送迎が回らない）／屋台の出店（食品の管理が難しい）</text>
  </g>
</svg>
