<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="円卓の図。6つの席に暮らしの主体性・体のリスク・手続き・環境から考える・現場が回るか・家族や他の利用者の立場の参加者が座り、中央に進行役がいる。手前の1席だけが空席で、ご本人の席という札が置かれている">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <text x="24" y="34" class="lbl" font-size="16" font-weight="700" fill="#2f5d3a">7人の会議 ── ただし、1席は空けたまま</text>

  <!-- 円卓 -->
  <ellipse cx="320" cy="180" rx="120" ry="74" fill="#faf6ef" stroke="#bcd7b3" stroke-width="2.5"/>
  <text x="320" y="176" text-anchor="middle" class="lbl" font-size="13" font-weight="700" fill="#4a8c3f">進行役</text>
  <text x="320" y="196" text-anchor="middle" class="lbl" font-size="10.5" fill="#9a907c">争点を割り、判定する</text>

  <!-- 上段の席 -->
  <g class="lbl">
    <circle cx="228" cy="86" r="21" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="2"/>
    <text x="228" y="92" text-anchor="middle" font-size="17">🌱</text>
    <text x="228" y="126" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5f5847">暮らしの主体性</text>

    <circle cx="320" cy="72" r="21" fill="#f7ede7" stroke="#d97757" stroke-width="2"/>
    <text x="320" y="78" text-anchor="middle" font-size="17">🩺</text>
    <text x="320" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5f5847">体のリスク</text>

    <circle cx="412" cy="86" r="21" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="2"/>
    <text x="412" y="92" text-anchor="middle" font-size="17">📋</text>
    <text x="412" y="126" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5f5847">手続き</text>
  </g>

  <!-- 左右の席 -->
  <g class="lbl">
    <circle cx="128" cy="188" r="21" fill="#f7ede7" stroke="#d97757" stroke-width="2"/>
    <text x="128" y="194" text-anchor="middle" font-size="17">🧩</text>
    <text x="128" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5f5847">環境から考える</text>

    <circle cx="512" cy="188" r="21" fill="#eaf2e5" stroke="#4a8c3f" stroke-width="2"/>
    <text x="512" y="194" text-anchor="middle" font-size="17">⏰</text>
    <text x="512" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5f5847">現場が回るか</text>
  </g>

  <!-- 下段：家族の席 -->
  <g class="lbl">
    <circle cx="428" cy="268" r="21" fill="#f7ede7" stroke="#d97757" stroke-width="2"/>
    <text x="428" y="274" text-anchor="middle" font-size="17">👪</text>
    <text x="428" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5f5847">家族・ほかの利用者</text>
  </g>

  <!-- 空席 -->
  <g>
    <circle cx="212" cy="268" r="23" fill="#ffffff" stroke="#b7ac97" stroke-width="2.4" stroke-dasharray="6 5"/>
    <text x="212" y="304" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#b8543a">ご本人の席</text>
  </g>
  <rect x="60" y="248" width="112" height="42" rx="9" fill="#f7ede7" stroke="#e8c0ae" stroke-width="1.5"/>
  <text x="116" y="266" text-anchor="middle" class="lbl" font-size="11" font-weight="700" fill="#b8543a">ここには</text>
  <text x="116" y="282" text-anchor="middle" class="lbl" font-size="11" font-weight="700" fill="#b8543a">AIを座らせない</text>
  <line x1="174" y1="268" x2="187" y2="268" stroke="#e8c0ae" stroke-width="2"/>
</svg>
