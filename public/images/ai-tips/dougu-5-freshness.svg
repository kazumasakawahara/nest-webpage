<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="記録は賞味期限つきの観測、を示す図。左は書いたときのメモカード：お茶はストローだとむせにくい（出どころ：お母さん、確認日：2026-08-15）で新鮮のチェックつき。右は1年後の同じカード：内容はそのままに、オレンジ色の「要再確認」の札が付く。消さない・隠さない・札を貼るだけ。下段の赤い帯：アレルギーなど「してはいけない」の注意書きは、古くなっても剥がさない。外すときだけ、人がきちんと確かめる">
  <defs>
    <style>.lbl{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}</style>
  </defs>

  <text x="24" y="40" class="lbl" font-size="17" font-weight="700" fill="#2f5d3a">記録は、“賞味期限つきの観測”</text>

  <!-- 左：書いたとき -->
  <text x="46" y="76" class="lbl" font-size="13" font-weight="700" fill="#4a8c3f">書いたとき</text>
  <rect x="40" y="88" width="240" height="128" rx="12" fill="#ffffff" stroke="#bcd7b3" stroke-width="2"/>
  <text x="60" y="118" class="lbl" font-size="13.5" font-weight="700" fill="#2f5d3a">お茶はストローだと</text>
  <text x="60" y="139" class="lbl" font-size="13.5" font-weight="700" fill="#2f5d3a">むせにくい</text>
  <line x1="60" y1="156" x2="260" y2="156" stroke="#ddd3c1" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="60" y="177" class="lbl" font-size="11.5" fill="#7c7360">出どころ：お母さん</text>
  <text x="60" y="197" class="lbl" font-size="11.5" fill="#7c7360">確認日：2026-08-15</text>
  <g transform="translate(240,96)">
    <circle cx="12" cy="12" r="12" fill="#4a8c3f"/>
    <path d="M6 12 l4 4 8 -8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 矢印：1年後 -->
  <g transform="translate(292,140)">
    <path d="M8 12 h30 M30 4 l10 8 -10 8" fill="none" stroke="#d97757" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="40" text-anchor="middle" class="lbl" font-size="11.5" font-weight="700" fill="#d97757">1年後</text>
  </g>

  <!-- 右：1年後 -->
  <text x="366" y="76" class="lbl" font-size="13" font-weight="700" fill="#7c7360">確かめないまま、1年</text>
  <rect x="360" y="88" width="240" height="128" rx="12" fill="#faf6ef" stroke="#ddd3c1" stroke-width="1.5"/>
  <text x="380" y="118" class="lbl" font-size="13.5" font-weight="700" fill="#5f5847">お茶はストローだと</text>
  <text x="380" y="139" class="lbl" font-size="13.5" font-weight="700" fill="#5f5847">むせにくい</text>
  <line x1="380" y1="156" x2="580" y2="156" stroke="#ddd3c1" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="380" y="177" class="lbl" font-size="11.5" fill="#9a907c">出どころ：お母さん</text>
  <text x="380" y="197" class="lbl" font-size="11.5" fill="#9a907c">確認日：2026-08-15</text>
  <!-- 要再確認の札 -->
  <g transform="translate(506,94)">
    <path d="M10 0 h72 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-72 l-10 -15 z" fill="#d97757"/>
    <circle cx="8" cy="15" r="3" fill="#ffffff"/>
    <text x="46" y="20" text-anchor="middle" class="lbl" font-size="12.5" font-weight="700" fill="#ffffff">要再確認</text>
  </g>
  <text x="480" y="238" text-anchor="middle" class="lbl" font-size="12" font-weight="700" fill="#2f5d3a">消さない・隠さない。札を貼るだけ</text>

  <!-- 下段：非対称ルール -->
  <rect x="40" y="262" width="560" height="72" rx="12" fill="#fdf1ec" stroke="#d97757" stroke-width="1.8"/>
  <g transform="translate(62,280)">
    <path d="M18 0 L36 32 H0 Z" fill="#d97757"/>
    <text x="18" y="26" text-anchor="middle" class="lbl" font-size="15" font-weight="700" fill="#ffffff">!</text>
  </g>
  <text x="116" y="290" class="lbl" font-size="13.5" font-weight="700" fill="#b0492c">「してはいけない」の注意書きは、古くなっても剥がさない</text>
  <text x="116" y="313" class="lbl" font-size="12" fill="#7c7360">外すのは、しかるべき人がきちんと確かめてから。安全は常に“残す側”に倒す</text>
</svg>
